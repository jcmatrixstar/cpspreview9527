<!-- Version: 1.9 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 彩池設定</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)"
      @update-lock.window="poolSettingLocked = $event.detail">

    <div id="layout-sidebar"></div>

    <!-- Modals Container -->
    <div x-data="modalData()"
         @open-jackpot-detail.window="openDetail($event.detail)"
         @open-settings-modal.window="openSettings($event.detail)"
         @open-add-revenue-modal.window="openAddRevenue()"
         @open-revenue-detail.window="openRevenueDetail($event.detail)">

        <!-- 彩池設定 (Settings) Modal -->
        <div x-show="showSettings" style="display: none;" class="fixed inset-0 z-[300] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 overflow-hidden flex flex-col" @click.outside="!isSettingsEditing && (showSettings = false)">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
                    <h3 class="text-lg font-bold text-gray-800 flex items-baseline gap-2">
                        彩池設定 <span class="text-xs text-gray-400 font-medium">設定</span>
                    </h3>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 gap-y-4">
                        <!-- 開關 -->
                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-gray-700 w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-right" data-tip="啟用時禁止更改設定">開關</label>
                            <div class="h-[34px] flex items-center">
                                <label class="relative inline-flex items-center" :class="isSettingsEditing ? 'cursor-pointer' : 'cursor-not-allowed opacity-60'">
                                    <input type="checkbox" x-model="tempSettingLocked" :disabled="!isSettingsEditing" class="sr-only peer">
                                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                    <template x-if="!isSettingsEditing">
                        <div class="flex gap-3">
                            <button @click="showSettings = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">關閉</button>
                            <button @click="isSettingsEditing = true;" class="px-6 py-2 bg-amber-500 text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold">編輯</button>
                        </div>
                    </template>
                    <template x-if="isSettingsEditing">
                        <div class="flex gap-3">
                            <button @click="isSettingsEditing = false; tempSettingLocked = poolSettingLocked;" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">取消</button>
                            <button @click="saveSettings()" class="px-6 py-2 bg-primary text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">確認</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- 彩池詳細/編輯 Modal -->
        <div x-show="detailOpen" style="display: none;" class="fixed inset-0 z-[250] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="!isEditing && (detailOpen = false)">

                <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center bg-gray-50 flex-shrink-0">
                    <div class="flex items-baseline gap-3">
                        <h3 class="text-lg font-bold text-gray-800">彩池定義</h3>
                        <span class="text-sm text-gray-400 font-mono" x-text="editForm.key"></span>
                    </div>
                </div>

                <div class="overflow-y-auto custom-scroll flex-1 p-6">
                    <div class="bg-gray-50 border border-gray-200 rounded-xl mb-8 flex divide-x divide-gray-200 overflow-hidden shadow-sm">
                        <div class="flex-1 p-5">
                            <span class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2 block w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="每 5 秒鐘即時結算，當前累積的彩金總額">目前彩池</span>
                            <div class="text-3xl font-mono font-black text-gray-800" x-text="`$${editForm.pool}`"></div>
                        </div>
                        <div class="flex-1 p-5" style="border-left-width: 0;">
                            <span class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2 block w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="前次觸發彩池派彩歸零紀錄">前次派彩</span>
                            <div class="flex flex-col">
                                <span class="text-base font-bold text-blue-600 truncate" x-text="editForm.lastWinner"></span>
                                <span class="text-[11px] text-gray-400 font-mono mt-1 time-hover-trigger inline-block w-fit tooltip tooltip-right"
                                      :data-tip="editForm.lastTimeFull"
                                      x-text="editForm.lastTime"></span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-y-6 gap-x-6 text-sm">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5 uppercase">Key</label>
                            <div class="font-mono text-gray-400 bg-gray-50 px-3 py-2 rounded border border-gray-100" x-text="editForm.key"></div>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">名稱</label>
                            <div class="font-bold text-gray-800 text-base bg-gray-50 px-3 py-2 rounded border border-gray-100" x-text="editForm.name"></div>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">彩池獎金</label>
                            <template x-if="!isEditing">
                                <div class="text-gray-700 text-sm px-1" x-text="editForm.bonusRange"></div>
                            </template>
                            <template x-if="isEditing">
                                <input type="text" x-model="editForm.bonusRange" class="detail-input">
                            </template>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5 w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="最低單筆押注金額，超過才會抽水進彩池">中獎門檻</label>
                            <template x-if="!isEditing">
                                <div class="font-mono font-bold text-gray-700 text-base px-1" x-text="`$${editForm.threshold}`"></div>
                            </template>
                            <template x-if="isEditing">
                                <div class="flex items-center gap-2">
                                    <span class="text-gray-400">$</span>
                                    <input type="number" x-model="editForm.threshold" class="detail-input font-mono">
                                </div>
                            </template>
                        </div>
                        <!-- 觸發中獎 (Modal - Detail & Edit) -->
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5 w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="系統隨機生成">觸發中獎</label>
                            <template x-if="!isEditing">
                                <!-- 詳細彈窗：正常顯示數值 -->
                                <div class="font-mono font-bold text-gray-700 text-base px-1" x-text="`$${editForm.trigger}`"></div>
                            </template>
                            <template x-if="isEditing">
                                <!-- 編輯彈窗：正常顯示數值且不可異動 (disabled) -->
                                <div class="flex items-center gap-2">
                                    <span class="text-gray-400">$</span>
                                    <input type="text" :value="editForm.trigger" disabled
                                           class="detail-input font-mono bg-gray-50 border-gray-200 text-gray-400 cursor-not-allowed">
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 flex-shrink-0">
                    <template x-if="!isEditing">
                        <div class="flex gap-3">
                            <button @click="detailOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">關閉</button>
                            <button @click="if(poolSettingLocked) { $dispatch('notify', {message: '設定開關啟用時，禁止更改設定'}); } else { isEditing = true; }" class="px-6 py-2 bg-amber-500 text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold">編輯</button>
                        </div>
                    </template>
                    <template x-if="isEditing">
                        <div class="flex gap-3">
                            <button @click="isEditing = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">取消</button>
                            <button @click="saveEdit" class="px-6 py-2 bg-primary text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">儲存</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- 營收設定 詳細/編輯 Modal -->
        <div x-show="revenueModalOpen" style="display: none;" class="fixed inset-0 z-[250] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="!isRevenueEditing && (revenueModalOpen = false)">

                <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center bg-gray-50 flex-shrink-0">
                    <div class="flex items-baseline gap-3">
                        <h3 class="text-lg font-bold text-gray-800">營收設定</h3>
                        <span class="text-sm text-gray-400" :class="revenueForm.isNew ? 'font-medium' : 'font-mono'" x-text="revenueForm.isNew ? '新增' : revenueForm.name"></span>
                    </div>
                </div>

                <div class="overflow-y-auto custom-scroll flex-1 p-6">

                    <!-- 其他資訊 (僅詳細/編輯模式顯示) -->
                    <template x-if="!revenueForm.isNew">
                        <div class="bg-[#e2e8f0] rounded-lg p-4 mb-6 grid grid-cols-3 gap-4 border border-slate-200 shadow-sm">
                            <div class="col-span-3 sm:col-span-1">
                                <div class="text-[11px] font-bold text-gray-500 mb-1 tracking-wider">建立時間</div>
                                <div class="text-sm text-gray-700 font-medium" x-text="revenueForm.createTime"></div>
                            </div>
                            <div class="col-span-3 sm:col-span-1">
                                <div class="text-[11px] font-bold text-gray-500 mb-1 tracking-wider">最後異動時間</div>
                                <div class="text-sm text-gray-700 font-medium" x-text="revenueForm.updateTime"></div>
                            </div>
                            <div class="col-span-3 sm:col-span-1">
                                <div class="text-[11px] font-bold text-gray-500 mb-1 tracking-wider">操作者</div>
                                <div class="text-sm text-gray-700 font-medium" x-text="revenueForm.operator"></div>
                            </div>
                        </div>
                    </template>

                    <div class="grid grid-cols-2 gap-y-6 gap-x-6 text-sm">
                        <!-- 名稱 -->
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">名稱</label>
                            <template x-if="!isRevenueEditing">
                                <div class="font-bold text-gray-800 text-base px-1 min-h-[38px] flex items-center" x-text="revenueForm.name"></div>
                            </template>
                            <template x-if="isRevenueEditing">
                                <input type="text" x-model="revenueForm.name" class="detail-input">
                            </template>
                        </div>

                        <!-- 狀態 -->
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">狀態</label>
                            <template x-if="!isRevenueEditing">
                                <div class="min-h-[38px] flex items-center px-1">
                                    <span class="px-2 py-0.5 rounded text-[11px] font-bold tracking-wider"
                                          :class="revenueForm.status === '啟用' ? 'bg-green-100 text-green-600 border border-green-200' : 'bg-red-100 text-red-600 border border-red-200'"
                                          x-text="revenueForm.status"></span>
                                </div>
                            </template>
                            <template x-if="isRevenueEditing">
                                <div class="min-h-[38px] flex items-center px-1">
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" x-model="revenueForm.status" true-value="啟用" false-value="停用" class="sr-only peer">
                                        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
                                        <span class="ml-2 text-sm font-medium text-gray-700" x-text="revenueForm.status"></span>
                                    </label>
                                </div>
                            </template>
                        </div>

                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5 w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-right" data-tip="不分獎項，未限制押注額，每筆注單皆需抽指定 RTP">貢獻金</label>
                            <template x-if="!isRevenueEditing">
                                <div class="font-mono text-gray-700 text-base px-1" x-text="revenueForm.contribution"></div>
                            </template>
                            <template x-if="isRevenueEditing">
                                <input type="number" step="any" x-model="revenueForm.contribution" class="detail-input font-mono">
                            </template>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">GRAND</label>
                            <template x-if="!isRevenueEditing">
                                <div class="font-mono text-gray-700 text-base px-1" x-text="revenueForm.grand"></div>
                            </template>
                            <template x-if="isRevenueEditing">
                                <input type="number" step="any" x-model="revenueForm.grand" class="detail-input font-mono">
                            </template>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">MAJOR</label>
                            <template x-if="!isRevenueEditing">
                                <div class="font-mono text-gray-700 text-base px-1" x-text="revenueForm.major"></div>
                            </template>
                            <template x-if="isRevenueEditing">
                                <input type="number" step="any" x-model="revenueForm.major" class="detail-input font-mono">
                            </template>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">MINI</label>
                            <template x-if="!isRevenueEditing">
                                <div class="font-mono text-gray-700 text-base px-1" x-text="revenueForm.mini"></div>
                            </template>
                            <template x-if="isRevenueEditing">
                                <input type="number" step="any" x-model="revenueForm.mini" class="detail-input font-mono">
                            </template>
                        </div>

                        <!-- 遊戲商 -->
                        <div class="col-span-2">
                            <label class="text-gray-500 block text-xs font-bold mb-1.5">遊戲商</label>
                            <template x-if="!isRevenueEditing">
                                <div class="font-bold text-gray-700 text-base px-1" x-text="revenueForm.provider.join(', ')"></div>
                            </template>
                            <template x-if="isRevenueEditing">
                                <div class="flex flex-wrap gap-4 mt-2 px-1">
                                    <template x-for="p in availableProviders" :key="p">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" :value="p" x-model="revenueForm.provider" class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary focus:ring-2">
                                            <span class="text-sm font-medium text-gray-700" x-text="p"></span>
                                        </label>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 flex-shrink-0">
                    <template x-if="!isRevenueEditing">
                        <div class="flex gap-3">
                            <button @click="revenueModalOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">關閉</button>
                            <button @click="if(poolSettingLocked) { $dispatch('notify', {message: '設定開關啟用時，禁止更改設定'}); } else { isRevenueEditing = true; }" class="px-6 py-2 bg-amber-500 text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold">編輯</button>
                        </div>
                    </template>
                    <template x-if="isRevenueEditing">
                        <div class="flex gap-3">
                            <button @click="revenueModalOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">取消</button>
                            <button @click="saveRevenueEdit" class="px-6 py-2 bg-primary text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">確認</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full bg-slate-50" x-data="jackpotPage()">

        <div id="layout-header"></div>

        <div class="flex-1 overflow-auto relative h-full flex flex-col p-4 md:p-6">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">遊戲管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">彩池設定 v2</span>
                    </nav>
                    <div class="flex items-center gap-2">
                        <!-- 說明按鈕含 Tip -->
                        <div class="relative group" x-data="{ showHelp: false }">
                            <button @click="showHelp = !showHelp" class="w-8 h-8 rounded-full bg-yellow-50 text-yellow-500 hover:bg-yellow-100 hover:text-yellow-600 transition-colors flex items-center justify-center border border-yellow-200 shadow-sm"><i class="ph-fill ph-lightbulb text-lg"></i></button>
                            <span class="btn-tip">說明</span>
                            <div x-show="showHelp" @click.outside="showHelp = false" class="absolute right-0 top-full mt-2 w-80 p-4 bg-yellow-50 shadow-xl rounded-lg z-[120] border border-yellow-100 text-xs text-yellow-800 leading-relaxed" x-cloak>
                                <ul class="list-disc pl-4 space-y-2">
                                    <li>遊戲清單：「全部電子遊戲」都加入彩池活動</li>
                                    <li>彩池開關：「啟用」時禁止更改設定，避免影響彩池計算</li>
                                    <li>更改設定：異動後，「觸發中獎」系統自動更新新值，「目前彩池」將重置為"彩池獎金：起始值"</li>
                                    <li>基本限制：會員需完成「首儲」，才可參與彩池活動</li>
                                </ul>
                            </div>
                        </div>
                        <!-- 設定按鈕含 Tip -->
                        <div class="relative group">
                            <button @click="$dispatch('open-settings-modal', poolSettingLocked)" class="w-8 h-8 rounded-full bg-gray-50 text-gray-500 hover:bg-gray-100 hover:text-primary transition-colors flex items-center justify-center border border-gray-200 shadow-sm">
                                <i class="ph-bold ph-gear-six text-lg"></i>
                            </button>
                            <span class="btn-tip">設定</span>
                        </div>
                        <!-- 新增按鈕含 Tip -->
                        <div class="relative group" x-show="activeTab === 'revenue'" style="display: none;" x-transition>
                            <button @click="if(poolSettingLocked) { $dispatch('notify', '設定開關啟用時，禁止更改設定'); } else { $dispatch('open-add-revenue-modal'); }" class="w-8 h-8 rounded-full bg-primary text-white hover:bg-primary-hover transition-colors flex items-center justify-center shadow-sm">
                                <i class="ph-bold ph-plus text-lg"></i>
                            </button>
                            <span class="btn-tip">新增</span>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-1 border-b border-gray-200 px-4 pt-2 flex-shrink-0 overflow-x-auto no-scrollbar">
                    <button @click="activeTab = 'define'"
                            class="px-8 py-2.5 text-sm font-bold border-b-2 transition-all flex items-center justify-center gap-2 whitespace-nowrap"
                            :class="activeTab === 'define' ? 'border-primary text-primary bg-white rounded-t-md shadow-sm' : 'border-transparent text-gray-400 hover:text-gray-600'">
                        <i class="ph-bold ph-list-numbers text-lg"></i>彩池定義
                    </button>
                    <button @click="activeTab = 'revenue'"
                            class="px-8 py-2.5 text-sm font-bold border-b-2 transition-all flex items-center justify-center gap-2 whitespace-nowrap"
                            :class="activeTab === 'revenue' ? 'border-primary text-primary bg-white rounded-t-md shadow-sm' : 'border-transparent text-gray-400 hover:text-gray-600'">
                        <i class="ph-bold ph-chart-line-up text-lg"></i>營收設定
                    </button>
                </div>

                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col flex-1 min-h-0 relative">

                    <div class="bg-gray-50 border-b border-gray-200 flex-shrink-0 flex items-center justify-end p-3">
                        <div class="flex flex-col text-right px-4">
                            <span class="text-xs text-gray-500 font-bold">筆數</span>
                            <span class="text-sm font-bold text-gray-800" x-text="activeTab === 'define' ? jackpotList.length : revenueList.length"></span>
                        </div>
                    </div>

                    <div class="flex-1 overflow-auto custom-scroll relative z-0 h-full">

                        <!-- 彩池定義 Table -->
                        <table x-show="activeTab === 'define'" class="w-full text-left border-collapse min-w-[1200px]">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3">Key</th>
                                    <th class="px-4 py-3">名稱</th>
                                    <th class="px-4 py-3 text-center">彩池獎金</th>
                                    <th class="px-4 py-3">
                                        <span class="border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="最低單筆押注金額，超過才會抽水進彩池">中獎門檻</span>
                                    </th>
                                    <!-- 觸發中獎 (List Header) -->
                                    <th class="px-4 py-3">
                                        <span class="border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="系統隨機生成">觸發中獎</span>
                                    </th>
                                    <!-- 目前彩池 (List Header) -->
                                    <th class="px-4 py-3 font-bold">
                                        <span class="border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="每 5 秒鐘即時結算，當前累積的彩金總額">目前彩池</span>
                                    </th>
                                    <th class="px-4 py-3">
                                        <span class="border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="前次觸發彩池派彩歸零紀錄">前次派彩</span>
                                    </th>
                                    <th class="px-4 py-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="(row, index) in jackpotList" :key="index">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 font-mono text-gray-400 text-xs" x-text="row.key"></td>
                                        <td class="px-4 py-3 font-bold text-gray-700" x-text="row.name"></td>
                                        <td class="px-4 py-3 text-center" x-text="row.bonusRange"></td>
                                        <td class="px-4 py-3 font-mono font-bold" x-text="`$${row.threshold}`"></td>
                                        <!-- 觸發中獎 (List Cell) - 打碼 -->
                                        <td class="px-4 py-3 font-mono font-bold" x-text="`$${maskValue(row.trigger)}`"></td>
                                        <td class="px-4 py-3 font-mono font-bold text-gray-800" x-text="`$${row.pool}`"></td>
                                        <td class="px-4 py-3">
                                            <div class="flex flex-col">
                                                <span class="text-blue-600 font-medium" x-text="row.lastWinner"></span>
                                                <span class="text-[11px] text-gray-400 mt-0.5 time-hover-trigger inline-block w-fit tooltip tooltip-down"
                                                      :data-tip="row.lastTimeFull"
                                                      x-text="row.lastTime"></span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <button @click="$dispatch('open-jackpot-detail', row)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-primary transition-colors tooltip tooltip-down" data-tip="檢視"><i class="ph ph-caret-right text-lg"></i></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- 營收設定 Table -->
                        <table x-show="activeTab === 'revenue'" style="display: none;" class="w-full text-left border-collapse min-w-[1000px]">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3">名稱</th>
                                    <th class="px-4 py-3">狀態</th>
                                    <th class="px-4 py-3">
                                        <span class="border-b border-dotted border-gray-400 cursor-help tooltip tooltip-down" data-tip="不分獎項，未限制押注額，每筆注單皆需抽指定 RTP">貢獻金</span>
                                    </th>
                                    <th class="px-4 py-3 text-center">GRAND</th>
                                    <th class="px-4 py-3 text-center">MAJOR</th>
                                    <th class="px-4 py-3 text-center">MINI</th>
                                    <th class="px-4 py-3 text-center">遊戲商</th>
                                    <th class="px-4 py-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="(row, index) in revenueList" :key="index">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 font-bold text-gray-700" x-text="row.name"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-[11px] font-bold tracking-wider"
                                                  :class="row.status === '啟用' ? 'bg-green-100 text-green-600 border border-green-200' : 'bg-red-100 text-red-600 border border-red-200'"
                                                  x-text="row.status"></span>
                                        </td>
                                        <td class="px-4 py-3 font-mono text-gray-700 font-bold" x-text="row.contribution"></td>
                                        <td class="px-4 py-3 font-mono text-gray-700 text-center" x-text="row.grand"></td>
                                        <td class="px-4 py-3 font-mono text-gray-700 text-center" x-text="row.major"></td>
                                        <td class="px-4 py-3 font-mono text-gray-700 text-center" x-text="row.mini"></td>
                                        <td class="px-4 py-3 text-center">
                                            <div class="relative inline-block" x-data="{ showTip: false }" @click.outside="showTip = false">
                                                <button @click="showTip = !showTip" class="w-6 h-6 rounded-full hover:bg-blue-50 text-primary font-bold transition-colors focus:outline-none" x-text="row.provider.length"></button>
                                                <div x-show="showTip" x-transition.opacity class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-max px-3 py-1.5 bg-gray-800 text-white text-xs rounded shadow-lg z-50 whitespace-nowrap" x-cloak>
                                                    <span x-text="row.provider.join(', ')"></span>
                                                    <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-gray-800"></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <button @click="$dispatch('open-revenue-detail', row)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-primary transition-colors tooltip tooltip-down" data-tip="檢視"><i class="ph ph-caret-right text-lg"></i></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        window.PAGE_CONFIG = {
            title:  '彩池設定 v2',
            parent: '遊戲管理'
        };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>
    <script>
        function modalData() {
            return {
                detailOpen: false,
                isEditing: false,
                editForm: {},
                showSettings: false,
                isSettingsEditing: false,
                tempSettingLocked: false,

                revenueModalOpen: false,
                isRevenueEditing: false,
                revenueForm: { provider:[] },
                availableProviders:['FC', 'JILI', 'PG', 'JDB', 'CQ9', 'RSG', 'BNG'],

                openDetail(record) {
                    this.editForm = { ...record };
                    this.isEditing = false;
                    this.detailOpen = true;
                },
                saveEdit() {
                    this.$dispatch('notify', '更新成功');
                    this.isEditing = false;
                    this.detailOpen = false;
                },
                openSettings(currentLock) {
                    this.isSettingsEditing = false;
                    this.tempSettingLocked = currentLock;
                    this.showSettings = true;
                },
                saveSettings() {
                    this.$dispatch('update-lock', this.tempSettingLocked);
                    this.isSettingsEditing = false;
                    this.$dispatch('notify', '更新成功');
                },
                openAddRevenue() {
                    this.revenueForm = {
                        isNew: true,
                        name: '',
                        status: '啟用',
                        contribution: '',
                        grand: '',
                        major: '',
                        mini: '',
                        provider:[],
                        createTime: '',
                        updateTime: '',
                        operator: ''
                    };
                    this.isRevenueEditing = true;
                    this.revenueModalOpen = true;
                },
                openRevenueDetail(record) {
                    this.revenueForm = {
                        isNew: false,
                        ...record,
                        provider:[...record.provider] // 確保陣列深拷貝
                    };
                    this.isRevenueEditing = false;
                    this.revenueModalOpen = true;
                },
                saveRevenueEdit() {
                    this.$dispatch('notify', this.revenueForm.isNew ? '新增成功' : '更新成功');
                    this.isRevenueEditing = false;
                    this.revenueModalOpen = false;
                }
            }
        }

        function jackpotPage() {
            return {
                activeTab: 'define',
                poolSettingLocked: false,
                maskValue(val) { return val === '0' || val === 0 ? '***' : val; },
                jackpotList:[
                    { key: 'GRAND', name: '巨獎', bonusRange: '$30,000 ~ $100,000', threshold: '5', trigger: '5', pool: '123,456', lastWinner: '【FC】大過年路路發', lastTime: '3 天前', lastTimeFull: '2025/11/25 14:30:05' },
                    { key: 'MAJOR', name: '大獎', bonusRange: '$3,000 ~ $15,000', threshold: '2', trigger: '0', pool: '45,678', lastWinner: '【FC】羅賓漢', lastTime: '11 天前', lastTimeFull: '2025/11/17 09:12:33' },
                    { key: 'MINI', name: '小獎', bonusRange: '$300 ~ $1,300', threshold: '0', trigger: '0', pool: '789', lastWinner: '【FC】蜜糖爆擊', lastTime: '3 小時前', lastTimeFull: '2025/11/28 17:45:10' }
                ],
                revenueList:[
                    { name: 'NewYear', status: '啟用', contribution: '0.00077', grand: '0.00077', major: '0.00066', mini: '0.00055', provider: ['FC', 'PG'], createTime: '2026/01/15 10:20:00', updateTime: '2026/01/20 14:30:12', operator: 'System' },
                    { name: '0X', status: '啟用', contribution: '0.00101', grand: '0.00301', major: '0.00201', mini: '0.00101', provider: ['JILI'], createTime: '2026/01/10 09:15:30', updateTime: '2026/01/10 09:15:30', operator: 'Admin01' },
                    { name: 'HighRTP', status: '啟用', contribution: '0.00516', grand: '0.00316', major: '0.00116', mini: '0.00116', provider: ['PG', 'CQ9', 'RSG'], createTime: '2026/01/26 17:19:09', updateTime: '2026/01/28 13:17:58', operator: 'System' },
                    { name: 'Normal', status: '停用', contribution: '0.00200', grand: '0.00100', major: '0.00050', mini: '0.00050', provider: ['JDB'], createTime: '2025/12/01 11:00:00', updateTime: '2026/02/01 10:00:00', operator: 'Admin02' },
                    { name: 'LowRTP', status: '啟用', contribution: '0.00100', grand: '0.00050', major: '0.00030', mini: '0.00020', provider:['FC', 'JILI', 'BNG'], createTime: '2025/11/20 16:45:00', updateTime: '2025/12/15 09:30:00', operator: 'System' }
                ]
            }
        }
    </script>
</body>
</html>
