<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    ┌──────────────────────────────────────────────────────────────┐
    │  CPS-BO 頁面範本                                               │
    │  複製此檔案後，依步驟修改標記 [TODO] 的區塊                    │
    │                                                              │
    │  路徑規則：                                                   │
    │    根目錄頁面（如 Dashboard_v1.html）→ _shared/xxx           │
    │    子目錄頁面（如 MemberManagement/xxx.html）→ ../_shared/xxx │
    └──────────────────────────────────────────────────────────────┘
    -->

    <!-- [TODO] 修改頁面標題 -->
    <title>合規後台 - 頁面標題</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <!-- CDN 函式庫（固定，勿更動版本） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- 選用：日期選擇器（僅在需要時啟用） -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script> -->
    <!-- <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script> -->

    <!-- 選用：圖表（僅在需要時啟用） -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script> -->

    <!-- Tailwind 色彩擴充（固定，勿更動） -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark:    { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>

    <!-- 共用樣式（路徑依頁面深度調整） -->
    <link rel="stylesheet" href="../_shared/styles.css">

    <!-- [TODO] 僅在需要時加入頁面專屬樣式，重複的共用樣式不再寫在這裡 -->
    <style>
        /* 頁面專屬 CSS */
    </style>
</head>

<!--
    body 說明：
    • x-data="appData()"  — 由 ../_shared/shared.js 提供，管理 sidebar / dark mode / toast
    • @notify.window       — 全域 toast 事件監聽
-->
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <!--
    ┌─────────────────────────────────────────────┐
    │  共用版面掛載點                               │
    │  layout.js 在 alpine:init 時自動注入：        │
    │    • Toast 通知容器                           │
    │    • 手機遮罩                                 │
    │    • 側邊欄 (aside)                           │
    └─────────────────────────────────────────────┘
    -->
    <div id="layout-sidebar"></div>

    <!--
    ┌─────────────────────────────────────────────────────────────┐
    │  主內容區                                                    │
    │  [TODO] 若頁面無獨立狀態，移除 x-data="pageData()"          │
    └─────────────────────────────────────────────────────────────┘
    -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="pageData()">

        <!--
        Header 掛載點
        layout.js 自動注入，標題來自 window.PAGE_CONFIG.title
        -->
        <div id="layout-header"></div>

        <!-- 頁面內容區 -->
        <div class="flex-1 overflow-auto bg-slate-50 p-4 md:p-6">

            <!--
            ┌───────────────────────────────────────────────┐
            │  麵包屑 & 右側動作按鈕列（樣式統一，勿變動）   │
            │  [TODO] 修改文字與按鈕內容                     │
            └───────────────────────────────────────────────┘
            -->
            <div class="flex items-center justify-between mb-5 flex-shrink-0">
                <!-- 麵包屑 -->
                <nav class="flex items-center gap-1.5 text-sm">
                    <!-- [TODO] 若為根層級頁面（如 Dashboard）可移除 parent + 分隔符 -->
                    <span class="text-gray-500">上層分類</span>
                    <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                    <span class="font-semibold text-primary">當前頁面</span>
                </nav>
                <!-- 右側動作按鈕 -->
                <div class="flex items-center gap-2">
                    <!-- [TODO] 依需求加入按鈕，範例如下 -->
                    <!-- 批次 -->
                    <!-- <button class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 hover:bg-gray-300 shadow-sm active:scale-95 transition-all flex items-center justify-center tooltip" data-tip="批次處理"><i class="ph ph-gear text-lg"></i></button> -->
                    <!-- 新增 -->
                    <!-- <button class="w-8 h-8 rounded-full bg-primary text-white hover:bg-blue-600 shadow-md active:scale-95 transition-all flex items-center justify-center tooltip" data-tip="新增"><i class="ph ph-plus text-lg"></i></button> -->
                </div>
            </div>

            <!-- ==================== 頁面專屬內容開始 ==================== -->

            <!--
                [TODO] 在此加入頁面內容。
                常見模組：
                  • 搜尋區：<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-5">...</div>
                  • 資料表格：<div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">...</div>
                  • 設定卡片：<div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">...</div>
                  • Modal：<div x-show="isModalOpen" class="fixed inset-0 z-[300] flex items-center justify-center ...">...</div>
            -->

            <!-- ==================== 頁面專屬內容結束 ==================== -->
        </div>
    </main>

    <!-- ─────────────────────────────────────────────────────────── -->
    <!--  Script 載入順序（重要，勿調整）：                          -->
    <!--  1. PAGE_CONFIG → 2. shared.js → 3. layout.js → 4. 頁面 JS  -->
    <!-- ─────────────────────────────────────────────────────────── -->

    <!-- [TODO] 修改此頁面設定 -->
    <script>
        window.PAGE_CONFIG = {
            title:  '頁面標題',   // 顯示在 header h1 及瀏覽器分頁
            parent: '上層分類'    // 顯示在麵包屑，根層級頁面設為 ''
        };
    </script>

    <!-- 共用 JS（路徑依頁面深度調整） -->
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>

    <!-- [TODO] 頁面專屬 Alpine.js 資料 -->
    <script>
        /**
         * pageData()
         * 本頁面的 Alpine.js 資料物件。
         * 若頁面無獨立狀態，可刪除此函式並移除 main 的 x-data。
         */
        function pageData() {
            return {
                /* ── 狀態 ── */
                // exampleList: [],
                // isModalOpen: false,

                /* ── 初始化 ── */
                init() {
                    // 頁面載入時的初始動作
                },

                /* ── 方法 ── */
                // openModal() { this.isModalOpen = true; },
                // closeModal() { this.isModalOpen = false; }
            };
        }

        /*
         * 其他頁面級函式（如圖表組件）也在此定義：
         *
         * function chartCard(type) { return { ... }; }
         */
    </script>
</body>
</html>
