<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 焦點資訊</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
        <div id="layout-header"></div>

        <div class="flex-1 overflow-auto bg-slate-50 p-6">
            <div class="max-w-[1600px] mx-auto space-y-6 pb-10">

                <div x-data="{
                    refreshing: false,
                    refreshData() { this.refreshing = true; setTimeout(() => this.refreshing = false, 1000); },
                    stats: [
                        { title: '註冊人數', value: '1,204',  trend:  12.5, icon: 'ph-user-plus',     color: 'blue',   tip: '今日成為「正式會員」的人次總計' },
                        { title: '在線人數', value: '8,540',  trend:   5.2, icon: 'ph-users',         color: 'indigo', tip: '10 分鐘內有交易紀錄的人次總計' },
                        { title: '損益總額', value: '-$45K',  trend:  -2.4, icon: 'ph-chart-line-up', color: 'green' },
                        { title: '儲值總額', value: '$2.1M',  trend:  15.3, icon: 'ph-coins',         color: 'red',    tip: '儲值成功的訂單金額總計' }
                    ]
                }">
                    <div class="flex justify-between items-end mb-3">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <i class="ph ph-chart-line-up text-primary"></i> 今日焦點
                            <a href="/Dashboard_v2" class="text-sm text-primary hover:underline ml-4 font-normal">進階版 »</a>
                        </h2>
                        <button @click="refreshData()" class="group flex items-center text-xs text-gray-400 bg-white border border-gray-200 px-2 py-1 rounded-full shadow-sm hover:text-indigo-600 transition-colors">
                            <i class="ph ph-arrows-clockwise mr-1 transition-transform duration-1000" :class="refreshing ? 'animate-spin' : ''"></i> 刷新頻率：5 分鐘
                        </button>
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <template x-for="stat in stats" :key="stat.title">
                            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all relative group">
                                <div class="flex justify-between items-start mb-2">
                                    <div class="relative">
                                        <p class="text-sm text-gray-500 font-medium" :class="stat.tip ? 'cursor-help text-dashed-tip' : ''" x-text="stat.title"></p>
                                        <div x-show="stat.tip" class="absolute left-0 bottom-full mb-2 w-40 p-2 bg-gray-800 text-white text-xs rounded shadow-lg z-50 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                                            <span x-text="stat.tip"></span><div class="absolute left-4 top-full -mt-1 w-2 h-2 bg-gray-800 rotate-45"></div>
                                        </div>
                                    </div>
                                    <div class="p-2 rounded-full flex items-center justify-center" :class="`bg-${stat.color}-50 text-${stat.color}-500`">
                                        <i class="ph text-xl" :class="stat.icon"></i>
                                    </div>
                                </div>
                                <div class="flex justify-between items-end mt-4">
                                    <h3 class="text-xl md:text-2xl font-bold text-gray-900" x-text="stat.value"></h3>
                                    <div class="flex items-center text-xs font-bold" :class="stat.trend >= 0 ? 'text-green-600' : 'text-red-500'">
                                        <i :class="stat.trend >= 0 ? 'ph-arrow-up' : 'ph-arrow-down'" class="ph mr-1"></i> <span x-text="Math.abs(stat.trend) + '%'"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="space-y-6">
                    <div x-data="chartCard('transaction')" class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden perspective-1000 relative group">
                        <template x-if="true"><div class="relative w-full transition-all duration-700 transform-style-3d" :class="isFlipped ? 'rotate-y-180' : ''">
                            <div class="backface-hidden bg-white w-full flex flex-col h-full">
                                <div class="p-5 border-b border-gray-100 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                                    <div class="flex items-center gap-4 flex-wrap"><h2 class="text-lg font-bold text-gray-800">交易紀錄</h2><div class="flex bg-gray-100 rounded-lg p-0.5 items-center">
                                        <template x-for="t in ['10分', '1日', '7日', '15日', '30日']"><button @click="updateTime(t)" class="px-3 py-1 text-xs rounded-md transition-all whitespace-nowrap" :class="timeRange === t ? 'bg-white shadow-sm text-primary font-bold' : 'text-gray-500 hover:text-gray-700'"><span x-text="t"></span></button></template>
                                        <div class="relative"><button x-ref="customDateBtn" @click="openDatePicker" class="px-3 py-1 text-xs rounded-md transition-all flex items-center gap-1" :class="timeRange === 'custom' ? 'bg-white shadow-sm text-primary font-bold' : 'text-gray-500 hover:text-gray-700'"><span x-text="dateLabel || '自訂'"></span></button><input x-ref="dateInput" type="text" class="absolute opacity-0 top-0 left-0 w-full h-full pointer-events-none"></div></div></div>
                                    <div class="flex flex-wrap items-center gap-4 w-full xl:w-auto justify-end">
                                        <div class="flex bg-gray-100 rounded-lg p-0.5"><template x-for="u in ['元', '筆', '人']"><button @click="updateUnit(u)" class="px-3 py-1 text-xs rounded-md transition-all w-8 text-center" :class="unit === u ? 'bg-white shadow-sm text-primary font-bold' : 'text-gray-500 hover:text-gray-700'"><span x-text="u"></span></button></template></div>
                                        <div class="flex items-center gap-2">
                                            <div @click="toggleCompare()" class="flex items-center gap-2 cursor-pointer select-none"><div class="w-9 h-5 rounded-full relative transition-colors duration-300" :class="compare ? 'bg-primary' : 'bg-gray-300'"><div class="absolute top-1 w-3 h-3 bg-white rounded-full shadow-sm transition-all duration-300 left-1" :class="compare ? 'translate-x-4' : 'translate-x-0'"></div></div><span class="text-xs text-gray-500">前期</span></div>
                                            <div class="relative" x-data="{ showInfo: false }">
                                                <button @click="showInfo = !showInfo" class="text-blue-500 hover:text-blue-600"><i class="ph ph-info"></i></button>
                                                <div x-show="showInfo" @click.outside="showInfo = false" class="absolute right-0 top-full mt-2 w-64 p-4 bg-white rounded-xl shadow-xl border border-gray-200 z-50 text-xs text-gray-600 space-y-2">
                                                    <p><strong>10分：</strong>前 1 日同時段</p><p><strong>7日：</strong>前 7 日</p><p><strong>15日：</strong>前 15 日</p><p><strong>30日：</strong>前 30 日</p><p><strong>自訂：</strong>指定區間前一段相同天數</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="relative group flex items-center">
                                            <button @click="isFlipped = true" class="w-8 h-8 flex items-center justify-center bg-white text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 hover:text-primary hover:border-primary shadow-sm transition-colors"><i class="ph ph-table text-lg"></i></button>
                                            <div class="absolute top-full right-0 mt-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-[60]">
                                                切換表格
                                                <div class="absolute bottom-full right-3 border-4 border-transparent border-b-gray-800"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="px-5 pt-4 pb-2 border-b border-gray-50 bg-slate-50/50"><div class="flex flex-col gap-3"><div class="flex gap-6 border-b border-gray-200 w-full"><button @click="setViewMode('total')" class="pb-2 text-sm font-medium border-b-2 transition-colors px-1" :class="viewMode==='total'?'border-blue-600 text-blue-600':'border-transparent text-gray-500'">總覽</button><button @click="toggleDetailCollapse()" class="pb-2 text-sm font-medium border-b-2 transition-colors px-1 flex items-center gap-1" :class="viewMode==='detail'?'border-blue-600 text-blue-600':'border-transparent text-gray-500'">詳細 <i class="ph ph-caret-down text-xs transition-transform" :class="isDetailOpen?'rotate-180':''"></i></button></div><div x-show="viewMode === 'detail' && isDetailOpen" x-collapse><div class="py-3 flex flex-wrap gap-x-8 gap-y-4 text-xs"><div class="flex items-center gap-3"><button @click="toggleCategory('deposit')" class="font-bold text-gray-500 bg-gray-200 px-2 py-0.5 rounded hover:bg-gray-300">存入</button><div class="flex gap-3"><template x-for="item in detailOptions.deposit"><label class="flex items-center gap-1.5 cursor-pointer hover:text-blue-600"><input type="checkbox" :value="item" x-model="selectedDetails" @change="updateChartRandom()" class="rounded text-blue-600 w-3.5 h-3.5"><span x-text="item"></span></label></template></div></div><div class="w-full flex items-center gap-3"><button @click="toggleCategory('withdraw')" class="font-bold text-gray-500 bg-gray-200 px-2 py-0.5 rounded hover:bg-gray-300">提出</button><div class="flex gap-3"><template x-for="item in detailOptions.withdraw"><label class="flex items-center gap-1.5 cursor-pointer hover:text-red-500"><input type="checkbox" :value="item" x-model="selectedDetails" @change="updateChartRandom()" class="rounded text-red-500 w-3.5 h-3.5"><span x-text="item"></span></label></template></div></div><div class="w-full flex items-center gap-3 flex-wrap"><button @click="toggleCategory('casino')" class="font-bold text-gray-500 bg-gray-200 px-2 py-0.5 rounded hover:bg-gray-300">娛樂城</button><div class="flex flex-wrap gap-3"><template x-for="item in detailOptions.casino"><label class="flex items-center gap-1.5 cursor-pointer hover:text-purple-600"><input type="checkbox" :value="item" x-model="selectedDetails" @change="updateChartRandom()" class="rounded text-purple-600 w-3.5 h-3.5"><span x-text="item"></span></label></template></div></div><div class="w-full flex items-center gap-3"><button @click="toggleCategory('other')" class="font-bold text-gray-500 bg-gray-200 px-2 py-0.5 rounded hover:bg-gray-300">其他</button><div class="flex gap-3"><template x-for="item in detailOptions.other"><label class="flex items-center gap-1.5 cursor-pointer hover:text-gray-600"><input type="checkbox" :value="item" x-model="selectedDetails" @change="updateChartRandom()" class="rounded text-gray-600 w-3.5 h-3.5"><span x-text="item"></span></label></template></div></div></div></div></div></div>
                                <div class="p-4 relative"><div class="h-[300px]"><canvas x-ref="canvas"></canvas></div><div class="flex flex-wrap justify-center gap-6 mt-4 pb-2 text-xs text-gray-600"><template x-for="ds in currentDatasets"><div class="flex items-center gap-2 cursor-pointer opacity-80 hover:opacity-100 transition-opacity"><span class="w-3 h-3 rounded-full border border-white shadow-sm" :style="{ backgroundColor: ds.borderColor, borderStyle: ds.borderDash ? 'dashed' : 'solid' }"></span><span x-text="ds.label"></span></div></template></div></div>
                                <div class="bg-gray-50 border-t border-gray-200 mt-auto"><button @click="expanded = !expanded" class="w-full py-3 flex flex-col items-center justify-center hover:bg-gray-100 transition-colors"><div class="flex items-center gap-2"><span class="text-sm text-gray-500">營收</span><span class="text-xl font-bold text-blue-600" x-text="transactionStats.total"></span></div><i class="ph ph-caret-down text-gray-400 mt-1 transition-transform" :class="expanded ? 'rotate-180' : ''"></i></button><div x-show="expanded" x-collapse class="border-t border-gray-200 p-6 bg-white"><div class="grid grid-cols-2 md:grid-cols-4 gap-6"><template x-for="item in transactionStats.details"><div class="text-center"><p class="text-xs text-gray-500 truncate px-1" x-text="item.label"></p><p class="font-bold text-gray-700 text-sm" x-text="item.value"></p></div></template></div></div></div>
                            </div>
                            <div class="absolute inset-0 bg-white rotate-y-180 backface-hidden flex flex-col h-full rounded-xl overflow-hidden"><div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50 flex-shrink-0"><h2 class="text-lg font-bold text-gray-800">交易詳細</h2>
                                <div class="relative group flex items-center">
                                    <button @click="isFlipped = false" class="w-8 h-8 flex items-center justify-center bg-white text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 hover:text-primary hover:border-primary shadow-sm transition-colors"><i class="ph ph-chart-line-up text-lg"></i></button>
                                    <div class="absolute top-full right-0 mt-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-[60]">
                                        切換圖表
                                        <div class="absolute bottom-full right-3 border-4 border-transparent border-b-gray-800"></div>
                                    </div>
                                </div>
                            </div><div class="px-6 py-2 bg-yellow-50 text-xs text-gray-600 border-b border-yellow-100 font-medium"><i class="ph ph-funnel mr-1"></i> 篩選條件：<span x-text="getFilterSummary()"></span></div><div class="flex-1 overflow-auto p-0 relative h-full"><table class="w-full text-sm text-right text-gray-600 whitespace-nowrap"><thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky-header sticky top-0 shadow-sm"><tr><template x-for="h in transactionHeaders"><th class="px-4 py-3 bg-gray-50" :class="h==='日期'?'text-left':''" x-text="h"></th></template></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr class="bg-gray-100 font-bold"><td class="px-4 py-3 text-left">總計</td><template x-for="i in transactionHeaders.length - 1"><td class="px-4 py-3"><div class="cell-metric"><span class="text-gray-900">100 / 人</span></div><div class="cell-metric"><span class="text-gray-900">300 / 筆</span></div><div class="cell-metric"><span class="text-gray-800">NT$ 9,999,999</span></div></td></template></tr><template x-for="row in mockTableData" :key="row.date"><tr class="hover:bg-gray-50"><td class="px-4 py-3 text-left font-mono text-xs text-gray-500" x-text="row.date"></td><template x-for="(cell, idx) in row.cells"><td class="px-4 py-3"><div class="cell-metric"><span class="text-gray-500 text-[10px]" x-text="cell.people + ' / 人'"></span></div><div class="cell-metric"><span class="text-gray-500 text-[10px]" x-text="cell.count + ' / 筆'"></span></div><div class="cell-metric"><span class="text-xs font-medium" :class="cell.rawAmount > 0 ? 'text-green-600' : (cell.rawAmount < 0 ? 'text-red-500' : 'text-gray-700')" x-text="cell.amount"></span></div></td></template></tr></template></tbody></table></div></div>
                        </div></template>
                    </div>

                    <div x-data="chartCard('betting')" class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden perspective-1000 relative group">
                        <div class="relative w-full transition-all duration-700 transform-style-3d" :class="isFlipped ? 'rotate-y-180' : ''">
                            <div class="backface-hidden bg-white w-full flex flex-col h-full">
                                <div class="p-5 border-b border-gray-100 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                                    <div class="flex items-center gap-4 flex-wrap"><h2 class="text-lg font-bold text-gray-800">押注紀錄</h2><div class="flex bg-gray-100 rounded-lg p-0.5 items-center">
                                        <template x-for="t in ['10分', '1日', '7日', '15日', '30日']"><button @click="updateTime(t)" class="px-3 py-1 text-xs rounded-md transition-all whitespace-nowrap" :class="timeRange === t ? 'bg-white shadow-sm text-primary font-bold' : 'text-gray-500 hover:text-gray-700'"><span x-text="t"></span></button></template>
                                        <div class="relative"><button x-ref="customDateBtn" @click="openDatePicker" class="px-3 py-1 text-xs rounded-md transition-all flex items-center gap-1" :class="timeRange === 'custom' ? 'bg-white shadow-sm text-primary font-bold' : 'text-gray-500 hover:text-gray-700'"><span x-text="dateLabel || '自訂'"></span></button><input x-ref="dateInput" type="text" class="absolute opacity-0 top-0 left-0 w-full h-full pointer-events-none"></div></div></div>
                                    <div class="flex flex-wrap items-center gap-4 w-full xl:w-auto justify-end">
                                        <div class="flex bg-gray-100 rounded-lg p-0.5"><template x-for="u in ['元', '筆', '人']"><button @click="updateUnit(u)" class="px-3 py-1 text-xs rounded-md transition-all w-8 text-center" :class="unit === u ? 'bg-white shadow-sm text-primary font-bold' : 'text-gray-500 hover:text-gray-700'"><span x-text="u"></span></button></template></div>
                                        <div class="flex items-center gap-2">
                                            <div @click="toggleCompare()" class="flex items-center gap-2 cursor-pointer select-none"><div class="w-9 h-5 rounded-full relative transition-colors duration-300" :class="compare ? 'bg-primary' : 'bg-gray-300'"><div class="absolute top-1 w-3 h-3 bg-white rounded-full shadow-sm transition-all duration-300 left-1" :class="compare ? 'translate-x-4' : 'translate-x-0'"></div></div><span class="text-xs text-gray-500">前期</span></div>
                                            <div class="relative" x-data="{ showInfo: false }"><button @click="showInfo = !showInfo" class="text-blue-500 hover:text-blue-600"><i class="ph ph-info"></i></button><div x-show="showInfo" @click.outside="showInfo = false" class="absolute right-0 top-full mt-2 w-64 p-4 bg-white rounded-xl shadow-xl border border-gray-200 z-50 text-xs text-gray-600 space-y-2"><p><strong>10分：</strong>前 1 日同時段</p><p><strong>7日：</strong>前 7 日</p><p><strong>15日：</strong>前 15 日</p><p><strong>30日：</strong>前 30 日</p><p><strong>自訂：</strong>指定區間前一段相同天數</p></div></div>
                                        </div>
                                        <div class="relative group flex items-center">
                                            <button @click="isFlipped = true" class="w-8 h-8 flex items-center justify-center bg-white text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 hover:text-primary hover:border-primary shadow-sm transition-colors"><i class="ph ph-table text-lg"></i></button>
                                            <div class="absolute top-full right-0 mt-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-[60]">
                                                切換表格
                                                <div class="absolute bottom-full right-3 border-4 border-transparent border-b-gray-800"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="px-5 py-3 border-b border-gray-50 flex flex-wrap items-center gap-3 overflow-x-auto no-scrollbar"><div class="flex gap-2 flex-shrink-0"><template x-for="g in ['全部', '電子', '捕魚', '街機', '棋牌']"><button @click="toggleGameCategory(g)" class="px-3 py-1 rounded-full text-xs border transition-colors whitespace-nowrap" :class="selectedCategories.includes(g) ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'" x-text="g"></button></template></div><div class="relative ml-auto"><i class="ph ph-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i><input type="text" x-model="searchQuery" @input.debounce.300ms="updateSearch()" placeholder="搜尋遊戲名稱..." class="pl-8 pr-3 py-1 text-xs border border-gray-200 rounded-full focus:outline-none focus:border-indigo-500 transition-colors w-32 sm:w-48"></div></div>
                                <div class="p-4 relative"><div class="h-[300px]"><canvas x-ref="canvas"></canvas></div><div class="flex flex-wrap justify-center gap-6 mt-4 pb-2 text-xs text-gray-600"><template x-for="ds in currentDatasets"><div class="flex items-center gap-2 cursor-pointer opacity-80 hover:opacity-100 transition-opacity"><span class="w-3 h-3 rounded-full border border-white shadow-sm" :style="{ backgroundColor: ds.borderColor, borderStyle: ds.borderDash ? 'dashed' : 'solid' }"></span><span x-text="ds.label"></span></div></template></div></div>
                                <div class="bg-gray-50 border-t border-gray-200 mt-auto"><button @click="expanded = !expanded" class="w-full py-3 flex flex-col items-center justify-center hover:bg-gray-100 transition-colors"><div class="flex items-center gap-2"><div class="relative group inline-block cursor-help"><span class="text-sm text-gray-500 text-dashed-tip">盈率</span><div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 p-2 bg-gray-800 text-white text-xs rounded hidden group-hover:block z-50 text-center">(損益總額 / 有效押注總額) * 100%<div class="absolute left-1/2 bottom-0 -mb-1 -ml-1 w-2 h-2 bg-gray-800 rotate-45"></div></div></div><span class="text-xl font-bold text-green-600">4.8%</span></div><i class="ph ph-caret-down text-gray-400 mt-1 transition-transform" :class="expanded ? 'rotate-180' : ''"></i></button><div x-show="expanded" x-collapse class="border-t border-gray-200 p-6 grid grid-cols-2 md:grid-cols-5 gap-6 bg-white"><div class="text-center"><p class="text-xs text-gray-500">押注</p><p class="font-bold text-gray-700">$5M</p></div><div class="text-center"><p class="text-xs text-gray-500">有效押注</p><p class="font-bold text-gray-700">$4.8M</p></div><div class="text-center"><p class="text-xs text-gray-500">贏分</p><p class="font-bold text-red-500">-$20K</p></div><div class="text-center"><p class="text-xs text-gray-500">損益</p><p class="font-bold text-green-600">+$230K</p></div></div></div>
                            </div>
                            <div class="absolute inset-0 bg-white rotate-y-180 backface-hidden flex flex-col h-full rounded-xl overflow-hidden"><div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50 flex-shrink-0"><h2 class="text-lg font-bold text-gray-800">押注詳細</h2>
                                <div class="relative group flex items-center">
                                    <button @click="isFlipped = false" class="w-8 h-8 flex items-center justify-center bg-white text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 hover:text-primary hover:border-primary shadow-sm transition-colors"><i class="ph ph-chart-line-up text-lg"></i></button>
                                    <div class="absolute top-full right-0 mt-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-[60]">
                                        切換圖表

                                            <div class="absolute top-full right-0 mt-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-[60]">

                                <div class="p-4 relative"><div class="h-[300px]"><canvas x-ref="canvas"></canvas></div><div class="flex flex-wrap justify-center gap-x-4 gap-y-2 mt-4 pb-2 text-xs text-gray-600 cursor-default"><div class="flex items-center gap-1.5 opacity-100"><span class="w-3 h-3 rounded-sm bg-blue-100 border border-blue-200"></span><span>全部</span></div><template x-for="(item, index) in (currentTab === 'type' ? depositLists.type : depositLists.channel)"><div class="flex items-center gap-1.5 opacity-100"><span class="w-3 h-3 rounded-full border border-white shadow-sm" :style="{ backgroundColor: getDepositColor(index) }"></span><span x-text="item"></span></div></template><template x-if="compare"><div class="flex items-center gap-1.5 opacity-100"><span class="w-3 h-3 rounded-sm border border-dashed border-gray-400 bg-gray-100/50"></span><span>前期-全部</span></div></template><template x-if="compare"><template x-for="(item, index) in (currentTab === 'type' ? depositLists.type : depositLists.channel)"><div class="flex items-center gap-1.5 opacity-100"><span class="w-3 h-3 rounded-full border border-white shadow-sm border-dashed" :style="{ backgroundColor: getDepositColor(index), opacity: 0.5 }"></span><span x-text="'前期-'+item"></span></div></template></template></div></div>

                                <div class="relative group flex items-center">
                                    <button @click="isFlipped = false" class="w-8 h-8 flex items-center justify-center bg-white text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 hover:text-primary hover:border-primary shadow-sm transition-colors"><i class="ph ph-chart-line-up text-lg"></i></button>

                            </div><div class="px-6 py-2 bg-yellow-50 text-xs text-gray-600 border-b border-yellow-100 font-medium"><i class="ph ph-funnel mr-1"></i> 篩選條件：<span x-text="getFilterSummary()"></span></div><div class="flex-1 overflow-auto p-0 relative h-full"><table class="w-full text-sm text-right text-gray-600 whitespace-nowrap"><thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky-header sticky top-0 shadow-sm"><tr><th class="px-4 py-3 text-left bg-gray-50">日期</th><template x-for="header in (currentTab === 'type' ? depositLists.type : depositLists.channel)"><th class="px-4 py-3 bg-gray-50" x-text="header"></th></template></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr class="bg-gray-100 font-bold"><td class="px-4 py-3 text-left">總計</td><template x-for="i in (currentTab === 'type' ? depositLists.type.length : depositLists.channel.length)"><td class="px-4 py-3"><div class="cell-metric"><span class="text-gray-900">100 / 人</span></div><div class="cell-metric"><span class="text-gray-900">200 / 筆</span></div><div class="cell-metric"><span class="text-green-600">NT$ 5,000</span></div></td></template></tr><template x-for="row in mockDepositData" :key="row.date"><tr class="hover:bg-gray-50"><td class="px-4 py-3 text-left font-mono text-xs text-gray-500" x-text="row.date"></td><template x-for="cell in row.cells"><td class="px-4 py-3"><div class="cell-metric"><span class="text-gray-500 text-[10px]" x-text="cell.people + ' / 人'"></span></div><div class="cell-metric"><span class="text-gray-500 text-[10px]" x-text="cell.count + ' / 筆'"></span></div><div class="cell-metric"><span class="text-xs font-medium text-green-600" x-text="cell.amount"></span></div></td></template></tr></template></tbody></table></div></div>

    <script>
        window.PAGE_CONFIG = {
            title:  '焦點資訊',
            parent: ''
        };
    </script>
    <script src="_shared/shared.js"></script>
    <script src="_shared/layout.js"></script>
    <script>
        // Global Helpers
        const hexToRgba = (hex, alpha) => {
            let r=0,g=0,b=0; hex=hex.replace('#','');
            if(hex.length==3){r=parseInt(hex[0]+hex[0],16);g=parseInt(hex[1]+hex[1],16);b=parseInt(hex[2]+hex[2],16);}
            else if(hex.length==6){r=parseInt(hex.substring(0,2),16);g=parseInt(hex.substring(2,4),16);b=parseInt(hex.substring(4,6),16);}
            return `rgba(${r},${g},${b},${alpha})`;
        };
        const createDiagonalPattern = (color = 'rgba(0,0,0,0.1)') => {
            const shape = document.createElement('canvas'); shape.width = 10; shape.height = 10;
            const c = shape.getContext('2d'); c.strokeStyle = color; c.lineWidth = 1;
            c.beginPath(); c.moveTo(0, 10); c.lineTo(10, 0); c.stroke();
            return c.createPattern(shape, 'repeat');
        };

        function chartCard(type) {
            let _chart = null;
            const palette = ['#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#6366f1', '#14b8a6', '#f97316', '#06b6d4', '#84cc16', '#d946ef', '#ef4444', '#64748b', '#a855f7'];

            return {
                type: type, isFlipped: false, expanded: false, compare: false, unit: '元', timeRange: '7日', dateLabel: '', category: '全部',
                currentTab: 'channel', selectedProviders: ['全部'], selectedCategories: ['全部'], searchQuery: '',
                viewMode: 'total', isDetailOpen: false, selectedDetails: ['儲值', '押注'], selectedDepositItems: ['玉山銀行', 'Line Pay'],
                currentDatasets: [], mockTableData: [], mockBetData: [], mockDepositData: [],
                transactionHeaders: [],
                transactionStats: { total: '$0', details: [] },
                depositStats: { total: '$0', details: [] },
                detailOptions: { deposit: ['儲值', '首儲', '系統存入', '保險箱提出'], withdraw: ['系統提出', '保險箱存入'], casino: ['押注', '結算', '押注並結算', '押注取消', '押注取消並結算', '派彩重置', '派彩取消', '派彩補發', '活動彩金', '免費遊戲贏分', 'JACKPOT巨獎'], other: ['其他'] },
                depositLists: {
                    type: ['快速', '一般', '禮包', '優惠卡'],
                    channel: ['玉山銀行', '提款卡', 'Line Pay', 'Apple Pay', 'Google Pay', '銀聯卡', 'GASH 點數', '信用卡', '7-11 付款', '全家付款', '萊爾富付款', 'OK 付款']
                },
                fp: null,

                init() {
                    if(this.type === 'deposit') this.selectedDepositItems = ['玉山銀行', 'Line Pay'];
                    this.generateTableData();
                    this.$nextTick(() => { setTimeout(() => this.initChart(), 50); });
                },
                openDatePicker() { if (!this.fp) { this.fp = flatpickr(this.$refs.dateInput, { mode: "range", dateFormat: "Y-m-d", locale: "zh_tw", onClose: (dates, str) => { if(dates.length) { this.timeRange='custom'; this.dateLabel=str; this.updateChartRandom(); this.generateTableData(); } } }); } this.fp.open(); },
                updateTime(t) { this.timeRange = t; this.dateLabel=''; this.updateChartRandom(); this.generateTableData(); },
                updateUnit(u) { this.unit = u; this.updateChartRandom(); },

                getFilterSummary() {
                    if (this.type === 'transaction') {
                        if (this.viewMode === 'total') return '總覽模式 (收入/提出/娛樂城/其他)';
                        return this.selectedDetails.join(', ');
                    }
                    if (this.type === 'betting') {
                        const cats = this.selectedCategories.join(', ');
                        return cats + (this.searchQuery ? ` (搜尋: ${this.searchQuery})` : '');
                    }
                    if (this.type === 'deposit') {
                        const provs = this.selectedProviders.join(', ');
                        return `[${this.currentTab === 'type' ? '種類' : '渠道'}] ${provs}`;
                    }
                    return '';
                },

                toggleGameCategory(cat) {
                    if (cat === '全部') { this.selectedCategories = ['全部']; }
                    else {
                        if (this.selectedCategories.includes('全部')) this.selectedCategories = [];
                        if (this.selectedCategories.includes(cat)) this.selectedCategories = this.selectedCategories.filter(c => c !== cat);
                        else this.selectedCategories.push(cat);
                        if (this.selectedCategories.length === 0) this.selectedCategories = ['全部'];
                    }
                    this.updateChartRandom();
                    this.generateTableData();
                },
                updateSearch() { this.updateChartRandom(); this.generateTableData(); },

                switchTab(tab) {
                    this.currentTab = tab;
                    this.selectedDepositItems = [this.depositLists[tab][0], this.depositLists[tab][1] || this.depositLists[tab][0]];
                    this.updateChartRandom();
                    this.generateTableData();
                },
                toggleProvider(prov) {
                    if(prov === '全部') { this.selectedProviders = ['全部']; }
                    else {
                        if(this.selectedProviders.includes('全部')) this.selectedProviders = [];
                        if(this.selectedProviders.includes(prov)) {
                            this.selectedProviders = this.selectedProviders.filter(p => p !== prov);
                        } else {
                            this.selectedProviders.push(prov);
                        }
                        if(this.selectedProviders.length === 0) this.selectedProviders = ['全部'];
                    }
                    this.updateChartRandom();
                },
                getDepositColor(index) { return palette[index % palette.length]; },

                setCategory(c) { this.category = c; this.updateChartRandom(); this.generateTableData(); },
                toggleCompare() { this.compare = !this.compare; this.updateChartRandom(); },
                setViewMode(m) { this.viewMode = m; if(m==='total') this.isDetailOpen=false; this.updateChartRandom(); this.generateTableData(); },
                toggleDetailCollapse() { this.viewMode = 'detail'; this.isDetailOpen = !this.isDetailOpen; if(this.isDetailOpen && !this.selectedDetails.length) this.selectedDetails=['儲值']; this.updateChartRandom(); this.generateTableData(); },
                toggleCategory(catKey) {
                    const group = this.detailOptions[catKey];
                    const allSelected = group.every(i => this.selectedDetails.includes(i));
                    if(allSelected) this.selectedDetails = this.selectedDetails.filter(i => !group.includes(i));
                    else this.selectedDetails = [...this.selectedDetails, ...group.filter(i => !this.selectedDetails.includes(i))];
                    this.updateChartRandom();
                    this.generateTableData();
                },
                generateData(baseVal, variance) {
                    let count = 7;
                    if (this.timeRange === '10分') count = 7;
                    if (this.timeRange === '1日') count = 24;
                    if (this.timeRange === '7日') count = 7;
                    if (this.timeRange === '15日') count = 15;
                    if (this.timeRange === '30日') count = 30;
                    return Array.from({length: count}, () => Math.floor(baseVal + Math.random() * variance - (variance/2)));
                },
                generateCell(isNeg = false) {
                    const amt = Math.floor(Math.random() * 50000);
                    return { amount: (isNeg ? '-' : '') + '$' + amt.toLocaleString(), rawAmount: isNeg ? -amt : amt, count: Math.floor(Math.random() * 50) + 1, people: Math.floor(Math.random() * 20) + 1 };
                },
                getLabels(range) {
                    if (range === '10分') {
                        const labels = [];
                        let time = new Date();
                        time.setMinutes(Math.floor(time.getMinutes() / 10) * 10);
                        for (let i = 6; i >= 0; i--) {
                            const t = new Date(time.getTime() - i * 10 * 60000);
                            labels.push(t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0'));
                        }
                        return labels;
                    }
                    if (range === '1日') {
                        return Array.from({length: 24}, (_, i) => i.toString().padStart(2, '0') + ':00');
                    }
                    let days = 7;
                    if (range === '15日') days = 15;
                    if (range === '30日') days = 30;
                    const labels = [];
                    for (let i = days - 1; i >= 0; i--) {
                        const d = new Date(); d.setDate(d.getDate() - i);
                        labels.push((d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0'));
                    }
                    return labels;
                },
                generateTableData() {
                    this.mockTableData = []; this.mockBetData = []; this.mockDepositData = [];
                    const labels = this.getLabels(this.timeRange);
                    const displayLabels = [...labels].reverse();

                    if (this.type === 'transaction') {
                        if (this.viewMode === 'total') {
                            this.transactionHeaders = ['日期', '收入', '提出', '娛樂城', '其他'];
                            this.mockTableData = displayLabels.map(d => {
                                return { date: d, cells: [ this.generateCell(), this.generateCell(true), this.generateCell(), this.generateCell() ] };
                            });
                        } else {
                            this.transactionHeaders = ['日期', ...this.selectedDetails];
                            this.mockTableData = displayLabels.map(d => {
                                return {
                                    date: d,
                                    cells: this.selectedDetails.map(item => {
                                        const isNeg = item.includes('提出') || item.includes('取款') || item.includes('送出');
                                        return this.generateCell(isNeg);
                                    })
                                };
                            });
                        }
                    } else if (this.type === 'betting') {
                        this.mockBetData = displayLabels.map(d => {
                            return { date: d, cells: [
                                this.generateCell(),
                                this.generateCell(),
                                this.generateCell(),
                                this.generateCell(Math.random() > 0.5)
                            ] };
                        });
                    } else {
                        const list = this.currentTab === 'type' ? this.depositLists.type : this.depositLists.channel;
                        this.mockDepositData = displayLabels.map(d => { return { date: d, cells: list.map(() => this.generateCell()) }; });
                    }
                },
                updateChartRandom() {
                    if (!_chart) return;
                    let datasets = [];
                    let multi = this.unit === '元' ? 1000 : (this.unit === '筆' ? 1 : 5);

                    if (this.type === 'transaction') {
                        let totalRevenue = 0; let details = [];
                        if (this.viewMode === 'total') {
                            const incData = this.generateData(50*multi,20*multi);
                            const withData = this.generateData(30*multi,15*multi);
                            const casinoData = this.generateData(20*multi,10*multi);
                            const otherData = this.generateData(5*multi,2*multi);
                            datasets.push({label:'收入', data: incData, borderColor:'#3b82f6', backgroundColor:'#3b82f6', tension:0.4});
                            datasets.push({label:'提出', data: withData, borderColor:'#ef4444', backgroundColor:'#ef4444', tension:0.4});
                            datasets.push({label:'娛樂城', data: casinoData, borderColor:'#9333ea', backgroundColor:'#9333ea', tension:0.4});
                            datasets.push({label:'其他', data: otherData, borderColor:'#64748b', backgroundColor:'#64748b', tension:0.4});

                            const sum = arr => arr.reduce((a,b) => a+b, 0);
                            totalRevenue = sum(incData) - sum(withData);
                            details = [{ label: '收入', value: '$'+sum(incData).toLocaleString() }, { label: '提出', value: '$'+sum(withData).toLocaleString() }, { label: '娛樂城', value: '$'+sum(casinoData).toLocaleString() }, { label: '其他', value: '$'+sum(otherData).toLocaleString() }];
                        } else {
                            const colors = ['#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#6366f1', '#64748b'];
                            this.selectedDetails.forEach((item, i) => {
                                const data = this.generateData(10*multi,5*multi);
                                datasets.push({label:item, data: data, borderColor:colors[i%6], backgroundColor:colors[i%6], tension:0.4});
                                const val = data.reduce((a,b)=>a+b,0); totalRevenue += val;
                                details.push({ label: item, value: '$'+val.toLocaleString() });
                            });
                        }
                        this.transactionStats = { total: '$'+totalRevenue.toLocaleString(), details: details };
                    } else if (this.type === 'betting') {
                        const bets=this.generateData(80*multi,30*multi);
                        const validBets=bets.map(v => Math.floor(v * 0.95));
                        const wins=this.generateData(75*multi,40*multi);
                        datasets.push({label:'押注',data:bets,borderColor:'#9333ea',backgroundColor:'#9333ea',tension:0.4});
                        datasets.push({label:'有效押注',data:validBets,borderColor:'#4f46e5',backgroundColor:'#4f46e5',tension:0.4});
                        datasets.push({label:'贏分',data:wins,borderColor:'#eab308',backgroundColor:'#eab308',tension:0.4});
                        datasets.push({label:'損益',data:wins.map((w,i)=>w-bets[i]),borderColor:'#22c55e',backgroundColor:'#22c55e',tension:0.4,borderDash:[5,5]});
                    } else {
                        let totalSum = 0; let details = [];
                        const itemList = this.currentTab === 'type' ? this.depositLists.type : this.depositLists.channel;
                        itemList.forEach(item => { const val = Math.floor(Math.random() * 500000); totalSum += val; details.push({ label: item, value: '$' + val.toLocaleString() }); });
                        this.depositStats = { total: '$' + totalSum.toLocaleString(), details: details };

                        const totalData = this.generateData(150*multi, 50*multi);
                        datasets.push({
                            type: 'bar', label: '全部', data: totalData, backgroundColor: 'rgba(59, 130, 246, 0.1)', borderColor: 'transparent', borderRadius: 4, order: 100
                        });
                        itemList.forEach((item, idx) => {
                            datasets.push({ type: 'line', label: item, data: this.generateData(30*multi, 10*multi), borderColor: this.getDepositColor(idx), backgroundColor: this.getDepositColor(idx), tension: 0.4, order: 1 });
                        });
                        if(this.compare) {
                            datasets.push({ type: 'bar', label: '前期-全部', data: totalData.map(v => v * 0.9), backgroundColor: createDiagonalPattern('rgba(203, 213, 225, 0.5)'), borderColor: '#cbd5e1', borderWidth: {top: 2, right: 2, bottom: 0, left: 2}, borderRadius: 4, borderDash: [5, 5], order: 101 });
                            itemList.forEach((item, idx) => {
                                datasets.push({ type: 'line', label: '前期-' + item, data: this.generateData(30*multi, 10*multi).map(v => v * 0.8), borderColor: hexToRgba(this.getDepositColor(idx), 0.4), backgroundColor: hexToRgba(this.getDepositColor(idx), 0.4), borderDash: [5, 5], borderWidth: 2, tension: 0.4, pointRadius: 0, order: 10 });
                            });
                        }
                    }

                    if (this.compare && this.type !== 'deposit') {
                        const prevDatasets = datasets.map(ds => ({
                            label: '前期 ' + ds.label,
                            data: ds.data.map(v => Math.max(0, Math.floor(v * (0.8 + Math.random()*0.2)))),
                            borderColor: hexToRgba(ds.borderColor, 0.5),
                            backgroundColor: hexToRgba(ds.backgroundColor, 0.5),
                            borderDash: [5, 5],
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.4,
                            order: 10
                        }));
                        datasets = datasets.concat(prevDatasets);
                    }

                    this.currentDatasets = datasets;
                    _chart.data.labels = this.getLabels(this.timeRange);
                    _chart.data.datasets = datasets;
                    _chart.options.scales.y.ticks.callback = (v) => { if (this.unit === '元') return '$' + v; if (this.unit === '筆') return v + '筆'; if (this.unit === '人') return v + '人'; return v; };
                    _chart.update('none');
                },
                initChart() {
                    const ctx = this.$refs.canvas.getContext('2d');
                    if(_chart) _chart.destroy();
                    _chart = new Chart(ctx, {
                        type: 'line',
                        data: { labels: this.getLabels(this.timeRange), datasets: [] },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: { legend: { display: false } },
                            scales: { x: { grid: { display: false } }, y: { grid: { borderDash: [2, 4], color: '#f0f0f0' }, beginAtZero: true } }
                        }
                    });
                    this.updateChartRandom();
                }
            }
        }
    </script>
</body>
</html>
