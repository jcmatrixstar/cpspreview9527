<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 金流商戶</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <!-- 刪除確認彈窗 -->
    <div x-data="{ confirmDelete: { open: false, targetName: '' } }"
         @trigger-delete-confirm.window="confirmDelete.targetName = $event.detail; confirmDelete.open = true">
        <div x-show="confirmDelete.open" class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-cloak x-transition @click.stop>
            <div class="bg-gray-100 rounded-xl shadow-xl w-[320px] overflow-hidden flex flex-col">
                <div class="px-5 py-4 flex items-baseline gap-2">
                    <span class="text-lg font-bold">提示</span>
                    <span class="text-xs text-gray-400 font-mono" x-text="confirmDelete.targetName"></span>
                </div>
                <div class="px-5 py-8 bg-white/50 border-y border-gray-200 text-center">
                    <p class="text-gray-800 font-bold">【 <span x-text="confirmDelete.targetName"></span> 】 確認刪除？</p>
                </div>
                <div class="p-4 bg-gray-100 flex justify-end gap-3">
                    <button @click="confirmDelete.open = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">取消</button>
                    <button @click="confirmDelete.open = false; $dispatch('notify', '已成功刪除')" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 shadow-sm text-sm font-medium">確認</button>
                </div>
            </div>
        </div>
    </div>

    <div id="layout-sidebar"></div>

    <!-- Modals Container -->
    <div x-data="modalData()"
         @open-merchant-detail.window="openDetail($event.detail)"
         @open-add-merchant.window="openAdd()">

        <!-- 金流商戶彈窗 (詳細/新增/編輯) -->
        <div x-show="detailOpen" style="display: none;" class="fixed inset-0 z-[250] flex items-center justify-center bg-black/30 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-[#f8fafc] rounded-lg shadow-2xl w-full max-w-5xl mx-4 overflow-hidden flex flex-col max-h-[92vh]" @click.outside="!isAddMode && !isEditMode && (detailOpen = false)">

                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-white flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                        <span>金流商戶</span>
                        <span class="text-gray-400 font-normal text-sm" x-text="isAddMode ? '新增' : (isEditMode ? '編輯' : editForm.name)"></span>
                    </h3>
                </div>

                <div class="overflow-y-auto custom-scroll flex-1 p-6 space-y-4 bg-gray-50">
                    <template x-if="!isAddMode">
                        <div class="bg-[#dfe3e8] border border-[#cbd5e1] rounded-lg p-5 grid grid-cols-2 gap-y-4 text-sm mb-4">
                            <div class="space-y-1"><p class="text-gray-500 font-medium">建立時間</p><div class="text-gray-700 font-medium" x-text="(editForm.createTime || '2025/06/24 11:46:10') + ' - 7 個月前'"></div></div>
                            <div class="space-y-1"><p class="text-gray-500 font-medium">最後異動時間</p><div class="text-gray-700 font-medium" x-text="(editForm.updateTime || '2026/02/06 13:52:27') + ' - 2 天前'"></div></div>
                            <div class="space-y-1"><p class="text-gray-500 font-medium">操作者</p><div class="text-gray-700 font-medium" x-text="editForm.user || 'cheng'"></div></div>
                        </div>
                    </template>

                    <!-- 基本區塊 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                        <div class="px-4 py-3 bg-white border-b border-gray-100 flex justify-between items-center font-bold text-gray-700">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-identification-card"></i> 基本</div>
                            <i class="ph ph-caret-down text-gray-400"></i>
                        </div>
                        <div class="p-6 grid grid-cols-2 gap-x-12 gap-y-6">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>排序</label>
                                <template x-if="isAddMode || isEditMode">
                                    <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none" x-model="editForm.order">
                                </template>
                                <template x-if="!isAddMode && !isEditMode">
                                    <div class="text-sm font-medium text-gray-700" x-text="editForm.order"></div>
                                </template>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>名稱</label>
                                <template x-if="isAddMode || isEditMode">
                                    <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none" x-model="editForm.name">
                                </template>
                                <template x-if="!isAddMode && !isEditMode">
                                    <div class="text-sm font-medium text-gray-700" x-text="editForm.name"></div>
                                </template>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>平台</label>
                                <template x-if="isAddMode || isEditMode">
                                    <select class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none">
                                        <option x-text="editForm.platform || '請選擇'"></option>
                                        <option>GASH 樂點</option>
                                        <option>藍新金流</option>
                                        <option>綠界科技</option>
                                    </select>
                                </template>
                                <template x-if="!isAddMode && !isEditMode">
                                    <div class="text-sm font-medium">
                                        <a href="#" class="text-primary hover:underline" x-text="editForm.platform"></a>
                                    </div>
                                </template>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>狀態</label>
                                <template x-if="isAddMode || isEditMode">
                                    <select class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none" x-model="editForm.status">
                                        <option value="啟用">啟用</option>
                                        <option value="停用">停用</option>
                                    </select>
                                </template>
                                <template x-if="!isAddMode && !isEditMode">
                                    <div class="flex items-center">
                                        <span :class="editForm.status === '啟用' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200'"
                                              class="px-2.5 py-0.5 rounded-full text-xs font-bold border"
                                              x-text="editForm.status"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 商戶區塊 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                        <div class="px-4 py-3 bg-white border-b border-gray-100 flex justify-between items-center font-bold text-gray-700">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-briefcase"></i> 商戶</div>
                            <i class="ph ph-caret-down text-gray-400"></i>
                        </div>
                        <div class="p-6 grid grid-cols-2 gap-x-12 gap-y-6">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>帳號</label>
                                <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none"
                                       :value="(isAddMode || isEditMode) ? editForm.account : '***ame'" :disabled="!isAddMode && !isEditMode">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>密碼</label>
                                <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none"
                                       :value="(isAddMode || isEditMode) ? editForm.password : '***6k'" :disabled="!isAddMode && !isEditMode">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>商家代號</label>
                                <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none"
                                       :value="(isAddMode || isEditMode) ? editForm.mId : '***405'" :disabled="!isAddMode && !isEditMode">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>商家服務代碼</label>
                                <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none"
                                       :value="(isAddMode || isEditMode) ? editForm.sId : '***288'" :disabled="!isAddMode && !isEditMode">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>交易密鑰 1</label>
                                <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none"
                                       :value="(isAddMode || isEditMode) ? editForm.key1 : '***Zu0'" :disabled="!isAddMode && !isEditMode">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span>交易密鑰 2</label>
                                <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none"
                                       :value="(isAddMode || isEditMode) ? editForm.key2 : '***lw='" :disabled="!isAddMode && !isEditMode">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500">商家商品名稱</label>
                                <input type="text" class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none"
                                       :value="editForm.productName || '點數 %s 點'" :disabled="!isAddMode && !isEditMode">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500">風控</label>
                                <template x-if="isAddMode || isEditMode">
                                    <select class="w-full border border-gray-200 rounded p-2.5 text-sm bg-gray-50/50 outline-none">
                                        <option>啟用</option><option>停用</option>
                                    </select>
                                </template>
                                <template x-if="!isAddMode && !isEditMode">
                                    <div><span class="px-2.5 py-0.5 rounded-full bg-green-100 text-green-700 text-xs font-bold border border-green-200">啟用</span></div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 通道區塊 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                        <div class="px-4 py-3 bg-white border-b border-gray-100 flex justify-between items-center font-bold text-gray-700">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-list-bullets"></i> <span class="header-dashed">通道</span></div>
                            <i class="ph ph-caret-down text-gray-400"></i>
                        </div>
                        <div class="p-0">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-50 text-gray-500 font-medium border-b border-gray-100">
                                    <tr>
                                        <th class="px-6 py-3 text-left">名稱</th>
                                        <th class="px-6 py-3 text-left">狀態</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-50">
                                    <template x-if="isAddMode">
                                        <tr><td colspan="2" class="px-6 py-8 text-center text-gray-400 font-medium">(無)</td></tr>
                                    </template>
                                    <template x-if="!isAddMode">
                                        <template x-for="ch in channels" :key="ch.name">
                                            <tr>
                                                <td class="px-6 py-3 text-gray-700" x-text="ch.name"></td>
                                                <td class="px-6 py-3">
                                                    <span :class="ch.status === '啟用' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200'"
                                                          class="px-2 py-0.5 rounded text-[10px] font-bold border" x-text="ch.status"></span>
                                                </td>
                                            </tr>
                                        </template>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 其他區塊 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                        <div class="px-4 py-3 bg-white border-b border-gray-100 flex justify-between items-center font-bold text-gray-700">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-dots-three-circle"></i> 其他</div>
                            <i class="ph ph-caret-down text-gray-400"></i>
                        </div>
                        <div class="p-6">
                            <label class="text-xs font-bold text-gray-500 block mb-2">備註</label>
                            <textarea class="w-full border border-gray-200 rounded p-4 text-sm min-h-[100px] outline-none focus:border-blue-500 transition-colors bg-gray-50/50"
                                      :placeholder="isAddMode ? '備註' : ''" :disabled="!isAddMode && !isEditMode" x-model="editForm.remark"></textarea>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 border-t border-gray-200 bg-[#e2e8f0] flex justify-end gap-3 flex-shrink-0">
                    <button @click="detailOpen = false; isEditMode = false; isAddMode = false;" class="px-8 py-2 bg-[#94a3b8] text-white rounded hover:bg-slate-500 shadow-sm text-sm font-bold transition-colors">關閉</button>

                    <template x-if="!isAddMode && !isEditMode">
                        <button @click="isEditMode = true" class="px-8 py-2 bg-[#f59e0b] text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold">編輯</button>
                    </template>

                    <template x-if="isAddMode">
                        <button @click="detailOpen = false; addToast('儲存成功')" class="px-8 py-2 bg-[#2088ea] text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">儲存</button>
                    </template>

                    <template x-if="isEditMode">
                        <div class="flex gap-3">
                            <button @click="$dispatch('trigger-delete-confirm', editForm.name)" class="px-8 py-2 bg-red-500 text-white rounded hover:bg-red-600 shadow-sm text-sm font-bold">刪除</button>
                            <button @click="isEditMode = false" class="px-8 py-2 bg-[#94a3b8] text-white rounded hover:bg-slate-500 shadow-sm text-sm font-bold">取消</button>
                            <button @click="isEditMode = false; addToast('儲存成功')" class="px-8 py-2 bg-[#2088ea] text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">儲存</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full bg-[#f3f4f6]" x-data="merchantPage()">

        <div id="layout-header"></div>

        <div class="flex-1 overflow-auto relative h-full flex flex-col p-4 md:p-6">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">儲值管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">金流商戶</span>
                    </nav>
                    <div class="flex items-center gap-2">
                        <div class="relative group"><button @click="$dispatch('open-add-merchant')" class="w-8 h-8 rounded-full bg-blue-500 text-white hover:bg-blue-600 flex items-center justify-center shadow-sm"><i class="ph-bold ph-plus text-lg"></i></button><span class="btn-tip">新增</span></div>
                    </div>
                </div>

                <div class="bg-white border border-gray-200 rounded-lg shadow-sm flex flex-col flex-1 min-h-0 relative">
                    <div class="bg-gray-100 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-end">
                        <div class="flex flex-col text-right px-4"><span class="text-xs text-gray-500 font-bold">筆數</span><span class="text-sm font-bold text-gray-800" x-text="list.length"></span></div>
                    </div>

                    <div class="flex-1 overflow-auto custom-scroll relative z-0 h-full">
                        <table class="w-full text-left border-collapse min-w-[1200px]">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-50 shadow-sm">
                                <tr>
                                    <th class="px-6 py-4">排序</th>
                                    <th class="px-6 py-4">名稱</th>
                                    <th class="px-6 py-4">平台</th>
                                    <th class="px-6 py-4 text-center">狀態</th>
                                    <th class="px-6 py-4"><span class="header-dashed">通道</span></th>
                                    <th class="px-6 py-4">備註</th>
                                    <th class="px-6 py-4 text-center sticky right-0 bg-gray-50 shadow-[-5px_0_10px_-5px_rgba(0,0,0,0.1)]">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="(row, index) in list" :key="row.id">
                                    <tr class="group transition-colors hover:bg-blue-50/50 hover:relative hover:z-20">
                                        <td class="px-6 py-4" x-text="row.order"></td>
                                        <td class="px-6 py-4 font-bold text-gray-700" x-text="row.name"></td>
                                        <td class="px-6 py-4">
                                            <a href="#" class="text-primary hover:underline font-medium" x-text="row.platform"></a>
                                        </td>
                                        <td class="px-6 py-4 text-center">
                                            <span :class="row.status === '啟用' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200'"
                                                  class="px-3 py-1 rounded-full text-xs font-bold border" x-text="row.status"></span>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="flex items-center gap-1.5">
                                                <span class="w-5 h-5 rounded-full bg-green-500 text-white text-xs flex items-center justify-center font-bold" x-text="row.chGreen"></span>
                                                <span class="w-5 h-5 rounded-full bg-red-400 text-white text-xs flex items-center justify-center font-bold" x-text="row.chRed"></span>
                                                <span class="w-5 h-5 rounded-full bg-amber-400 text-white text-xs flex items-center justify-center font-bold" x-text="row.chAmber"></span>
                                                <span class="w-5 h-5 rounded-full bg-gray-300 text-white text-xs flex items-center justify-center font-bold" x-text="row.chGray"></span>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-gray-400" x-text="row.remark"></td>
                                        <td class="px-6 py-4 text-center sticky right-0 bg-white group-hover:bg-blue-50/50 shadow-[-5px_0_10px_-5px_rgba(0,0,0,0.1)]" x-data="{ open: false }" :class="{'!z-[50]': open}">
                                            <div class="hidden lg:flex justify-center gap-4">
                                                <button @click="$dispatch('open-merchant-detail', row)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip tooltip-bottom mx-auto" data-tip="檢視"><i class="ph ph-caret-right text-lg"></i></button>
                                                <div class="relative group/tip">
                                                    <button @click="$dispatch('trigger-delete-confirm', row.name)" class="text-red-400 hover:text-red-600 transition-colors"><i class="ph ph-trash text-xl"></i></button>
                                                    <span class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover/tip:opacity-100 group-hover/tip:z-[100] pointer-events-none whitespace-nowrap">刪除</span>
                                                </div>
                                            </div>
                                            <div class="lg:hidden relative flex items-center justify-center">
                                                <button @click.stop="open = !open" class="w-8 h-8 rounded-full hover:bg-gray-100 text-gray-500 flex items-center justify-center"><i class="ph ph-list text-lg"></i></button>
                                                <div x-show="open" @click.outside="open = false" class="absolute right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl py-1 z-[200] min-w-[120px] text-left" x-cloak>
                                                    <button @click="$dispatch('open-merchant-detail', row); open = false" class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 text-gray-700 flex items-center gap-2"><i class="ph ph-caret-right"></i>檢視</button>
                                                    <button @click="$dispatch('trigger-delete-confirm', row.name); open = false" class="w-full text-left px-4 py-2 text-sm hover:bg-red-50 text-gray-700 flex items-center gap-2"><i class="ph ph-trash text-red-500"></i>刪除</button>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        window.PAGE_CONFIG = {
            title:  '金流商戶',
            parent: '儲值管理'
        };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>

    <script>
        function modalData() {
            return {
                detailOpen: false, isAddMode: false, isEditMode: false,
                editForm: {},
                channels: [
                    { name: '玉山銀行', status: '停用' }, { name: 'ATM 提款卡', status: '啟用' },
