<!-- Version: V4 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 站台設定</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <!-- ============================================================
         Modals scope
         ============================================================ -->
    <div x-data="sysModals()"
         @open-sys-detail.window="openDetail($event.detail)"
         @open-sys-add.window="openAdd()"
         @open-sys-history.window="historyOpen = true">

        <!-- ── 異動歷程 Modal ──────────────────────────────────── -->
        <div x-show="historyOpen" style="display:none;"
             class="fixed inset-0 z-[300] flex items-center justify-center bg-black/50 backdrop-blur-sm"
             x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[85vh]"
                 @click.outside="historyOpen = false">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between flex-shrink-0 rounded-t-lg">
                    <h3 class="text-base font-bold text-gray-800">站台設定－異動歷程</h3>
                    <div class="flex items-baseline gap-1">
                        <span class="text-xs text-gray-500">筆數</span>
                        <span class="text-sm font-bold text-gray-800 font-mono" x-text="allHistory.length"></span>
                    </div>
                </div>
                <div class="overflow-y-auto custom-scroll flex-1">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 shadow-sm">
                            <tr>
                                <th class="px-4 py-3 table-cell-nowrap">時間</th>
                                <th class="px-4 py-3 table-cell-nowrap">參數</th>
                                <th class="px-4 py-3">內容</th>
                                <th class="px-4 py-3 table-cell-nowrap">操作者</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-600 divide-y divide-gray-100 bg-white">
                            <template x-for="(h, i) in allHistory" :key="i">
                                <tr class="hover:bg-gray-50">
                                    <td class="px-4 py-3 table-cell-nowrap">
                                        <div class="font-mono text-xs text-gray-800" x-text="h.time"></div>
                                        <div class="text-xs text-gray-400 mt-0.5" x-text="h.timeRel"></div>
                                    </td>
                                    <td class="px-4 py-3 table-cell-nowrap">
                                        <div class="text-xs font-bold text-gray-700" x-text="h.paramName"></div>
                                        <div class="text-[11px] text-gray-400 font-mono" x-text="h.paramKey"></div>
                                    </td>
                                    <td class="px-4 py-3 text-xs text-gray-700" x-text="h.content"></td>
                                    <td class="px-4 py-3 table-cell-nowrap text-xs text-primary" x-text="h.operator"></td>
                                </tr>
                            </template>
                            <template x-if="!allHistory.length">
                                <tr><td colspan="4" class="px-4 py-8 text-center text-gray-400 text-sm">無異動歷程</td></tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 bg-white flex justify-end flex-shrink-0">
                    <button @click="historyOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium transition-colors">關閉</button>
                </div>
            </div>
        </div>

        <!-- ── 新增 Modal ──────────────────────────────────────── -->
        <div x-show="addOpen" style="display:none;"
             class="fixed inset-0 z-[250] flex items-center justify-center bg-black/50 backdrop-blur-sm"
             x-transition.opacity>
            <div class="bg-[#f8fafc] rounded-lg shadow-2xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[92vh]"
                 @click.outside="addOpen = false">

                <div class="px-6 py-4 border-b border-gray-200 bg-white flex items-center flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                        <span>站台設定</span>
                        <span class="text-gray-400 font-normal text-sm">新增</span>
                    </h3>
                </div>

                <div class="overflow-y-auto custom-scroll flex-1 p-6 space-y-4">

                    <!-- Card: 基本 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                        <div class="px-4 py-3 border-b border-gray-100 font-bold text-gray-700 text-sm flex items-center gap-2">
                            <i class="ph-fill ph-identification-card"></i> 基本
                        </div>
                        <div class="p-5 space-y-4">

                            <!-- Row 1: Key + 名稱 -->
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-xs font-bold text-gray-500 flex items-center gap-1">Key <span class="text-red-500">*</span></label>
                                    <input type="text" x-model="addForm.key" @input="validateAddKey()"
                                           placeholder="Ex. MaintainTime"
                                           class="w-full border rounded px-3 py-2 text-sm outline-none transition-colors"
                                           :class="addErrors.key ? 'border-red-400 focus:border-red-500' : 'border-gray-200 focus:border-primary'">
                                    <template x-if="addErrors.key">
                                        <p class="text-xs text-red-500" x-text="addErrors.key"></p>
                                    </template>
                                    <p class="text-[11px] text-gray-400 leading-tight">英文字母開頭，允許數字及底線</p>
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-xs font-bold text-gray-500 flex items-center gap-1">名稱 <span class="text-red-500">*</span></label>
                                    <input type="text" x-model="addForm.name" @input="validateAddName()"
                                           maxlength="25" placeholder="Ex. 維護時間"
                                           class="w-full border rounded px-3 py-2 text-sm outline-none transition-colors"
                                           :class="addErrors.name ? 'border-red-400 focus:border-red-500' : 'border-gray-200 focus:border-primary'">
                                    <div class="flex items-start justify-between gap-2">
                                        <template x-if="addErrors.name"><p class="text-xs text-red-500" x-text="addErrors.name"></p></template>
                                        <span class="text-[11px] text-gray-400 ml-auto" x-text="addForm.name.length + ' / 25'"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Row 2: 說明 (full width) -->
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-gray-500 flex items-center gap-1.5">
                                    <span class="border-b border-dashed border-gray-400 cursor-help relative group/deslabel">
                                        說明
                                        <div class="absolute bottom-full left-0 mb-1.5 w-36 bg-gray-800 text-white text-[11px] px-2.5 py-2 rounded shadow-xl z-[500] font-normal opacity-0 invisible group-hover/deslabel:opacity-100 group-hover/deslabel:visible transition-all whitespace-nowrap">
                                            「Tip 文案」顯示
                                        </div>
                                    </span>
                                </label>
                                <input type="text" x-model="addForm.desc" maxlength="100"
                                       placeholder="欄位說明文字，將作為 Tip 提示顯示"
                                       class="w-full border border-gray-200 focus:border-primary rounded px-3 py-2 text-sm outline-none">
                                <template x-if="addForm.desc">
                                    <div class="flex items-start gap-1.5 px-3 py-2 bg-amber-50 border border-amber-100 rounded text-xs text-amber-700">
                                        <i class="ph ph-info text-amber-500 flex-shrink-0 mt-0.5"></i>
                                        <span x-text="addForm.desc"></span>
                                    </div>
                                </template>
                            </div>

                            <!-- Row 3: 必填 + 類型 -->
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-xs font-bold text-gray-500 flex items-center gap-1">必填 <span class="text-red-500">*</span></label>
                                    <label class="flex items-center gap-3 cursor-pointer mt-1">
                                        <button @click="addForm.required = !addForm.required" type="button"
                                                class="relative w-11 h-6 rounded-full transition-colors focus:outline-none"
                                                :class="addForm.required ? 'bg-green-500' : 'bg-gray-300'">
                                            <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"
                                                  :class="addForm.required ? 'translate-x-5' : 'translate-x-0'"></span>
                                        </button>
                                        <span class="text-sm" :class="addForm.required ? 'text-green-600 font-medium' : 'text-gray-500'"
                                              x-text="addForm.required ? '啟用（必填）' : '停用（非必填）'"></span>
                                    </label>
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-xs font-bold text-gray-500 flex items-center gap-1">類型 <span class="text-red-500">*</span></label>
                                    <div class="relative">
                                        <select x-model="addForm.valueType" @change="resetAddValue()"
                                                class="w-full border border-gray-200 focus:border-primary rounded px-3 py-2 text-sm outline-none appearance-none bg-white">
                                            <option value="input-text">Input（Text）</option>
                                            <option value="textarea">Textarea（文本）</option>
                                            <option value="switch">Switch（開關）</option>
                                            <option value="select-single">Select（單選）</option>
                                            <option value="multi-select">Select（複選）</option>
                                            <option value="datetime-range">DateTime（區間）</option>
                                        </select>
                                        <i class="ph ph-caret-down absolute right-3 top-2.5 text-gray-400 text-sm pointer-events-none"></i>
                                    </div>
                                </div>
                            </div>

                            <!-- 選項清單（conditional, full width） -->
                            <template x-if="addForm.valueType === 'select-single' || addForm.valueType === 'multi-select'">
                                <div class="space-y-1.5">
                                    <label class="text-xs font-bold text-gray-400">選項清單 <span class="text-red-500">*</span></label>
                                    <textarea x-model="addForm.optionsText" rows="3"
                                              placeholder="每行輸入一個選項&#10;Ex.&#10;啟用&#10;停用&#10;維護中"
                                              class="w-full border border-gray-200 focus:border-primary rounded px-3 py-2 text-sm outline-none resize-none"></textarea>
                                </div>
                            </template>

                            <!-- 內容初始值（full width） -->
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-gray-400">內容（初始值）</label>
                                <template x-if="addForm.valueType === 'input-text'">
                                    <input type="text" x-model="addForm.value" placeholder="請輸入初始值"
                                           class="w-full border border-gray-200 focus:border-primary rounded px-3 py-2 text-sm outline-none">
                                </template>
                                <template x-if="addForm.valueType === 'textarea'">
                                    <textarea x-model="addForm.value" rows="3" placeholder="請輸入初始值（每行一筆）"
                                              class="w-full border border-gray-200 focus:border-primary rounded px-3 py-2 text-sm outline-none resize-none font-mono"></textarea>
                                </template>
                                <template x-if="addForm.valueType === 'switch'">
                                    <label class="flex items-center gap-3 cursor-pointer">
                                        <button @click="addForm.value = !addForm.value" type="button"
                                                class="relative w-11 h-6 rounded-full transition-colors focus:outline-none"
                                                :class="addForm.value ? 'bg-green-500' : 'bg-gray-300'">
                                            <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"
                                                  :class="addForm.value ? 'translate-x-5' : 'translate-x-0'"></span>
                                        </button>
                                        <span class="text-sm" :class="addForm.value ? 'text-green-600 font-medium' : 'text-gray-500'"
                                              x-text="addForm.value ? '啟用' : '停用'"></span>
                                    </label>
                                </template>
                                <template x-if="addForm.valueType === 'select-single'">
                                    <div class="relative">
                                        <select x-model="addForm.value"
                                                class="w-full border border-gray-200 focus:border-primary rounded px-3 py-2 text-sm outline-none appearance-none bg-white">
                                            <option value="">（請先填寫選項清單）</option>
                                            <template x-for="opt in addOptionsArray" :key="opt">
                                                <option :value="opt" x-text="opt"></option>
                                            </template>
                                        </select>
                                        <i class="ph ph-caret-down absolute right-3 top-2.5 text-gray-400 text-sm pointer-events-none"></i>
                                    </div>
                                </template>
                                <template x-if="addForm.valueType === 'multi-select'">
                                    <div class="border border-gray-200 rounded p-3 space-y-2 max-h-36 overflow-y-auto custom-scroll">
                                        <template x-if="addOptionsArray.length === 0">
                                            <p class="text-xs text-gray-400 text-center py-2">請先填寫選項清單</p>
                                        </template>
                                        <template x-for="opt in addOptionsArray" :key="opt">
                                            <label class="flex items-center gap-2 cursor-pointer">
                                                <input type="checkbox" :value="opt" x-model="addForm.value" class="w-3.5 h-3.5 rounded text-primary">
                                                <span class="text-sm text-gray-700" x-text="opt"></span>
                                            </label>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="addForm.valueType === 'datetime-range'">
                                    <div class="flex items-center gap-2">
                                        <input type="datetime-local" x-model="addForm.value.start"
                                               class="flex-1 border border-gray-200 focus:border-primary rounded px-2 py-1.5 text-xs outline-none">
                                        <span class="text-gray-400 text-xs flex-shrink-0">~</span>
                                        <input type="datetime-local" x-model="addForm.value.end"
                                               class="flex-1 border border-gray-200 focus:border-primary rounded px-2 py-1.5 text-xs outline-none">
                                    </div>
                                </template>
                            </div>

                        </div>
                    </div>

                    <!-- Card: 其他 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                        <div class="px-4 py-3 border-b border-gray-100 font-bold text-gray-700 text-sm flex items-center gap-2">
                            <i class="ph-fill ph-note-pencil"></i> 其他
                        </div>
                        <div class="p-5">
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-gray-500">備註</label>
                                <textarea x-model="addForm.remark" rows="3" placeholder="選填，內部備忘說明"
                                          class="w-full border border-gray-200 focus:border-primary rounded px-3 py-2 text-sm outline-none resize-none"></textarea>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="px-6 py-4 border-t border-gray-200 bg-white flex justify-end gap-3 flex-shrink-0">
                    <button @click="addOpen = false" class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium transition-colors">取消</button>
                    <button @click="submitAdd()" class="px-4 py-2 bg-primary hover:bg-primary-hover text-white rounded text-sm font-medium transition-colors">確定</button>
                </div>
            </div>
        </div>

        <!-- ── 詳細 / 編輯 Modal ────────────────────────────────── -->
        <div x-show="detailOpen" style="display:none;"
             class="fixed inset-0 z-[250] flex items-center justify-center bg-black/50 backdrop-blur-sm"
             x-transition.opacity>
            <div class="bg-[#f8fafc] rounded-lg shadow-2xl w-full max-w-lg mx-4 overflow-hidden flex flex-col max-h-[92vh]"
                 @click.outside="!historyOpen && (detailOpen = false)">

                <!-- Header -->
                <div class="px-6 py-4 border-b border-gray-200 bg-white flex items-center flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                        <span>站台設定</span>
                        <span class="text-gray-400 font-normal text-sm" x-text="detailItem ? detailItem.name : ''"></span>
                    </h3>
                </div>

                <!-- Body -->
                <div class="overflow-y-auto custom-scroll flex-1 p-6 space-y-4" x-show="detailItem">

                    <!-- Meta 資訊 -->
                    <div class="bg-[#dfe3e8] border border-[#cbd5e1] rounded-lg px-5 py-4 grid grid-cols-2 gap-y-4 text-sm">
                        <div class="space-y-1">
                            <p class="text-gray-500 text-xs font-medium">最後異動時間</p>
                            <div class="text-gray-700 font-mono text-xs" x-text="detailItem ? detailItem.updatedAt : ''"></div>
                        </div>
                        <div class="space-y-1">
                            <p class="text-gray-500 text-xs font-medium">操作者</p>
                            <div class="text-gray-700 font-medium text-sm" x-text="detailItem ? detailItem.operator : ''"></div>
                        </div>
                        <div class="space-y-1">
                            <p class="text-gray-500 text-xs font-medium">類型</p>
                            <div class="text-gray-600 text-xs" x-text="detailItem ? valueTypeLabel(detailItem.valueType) : ''"></div>
                        </div>
                        <div class="space-y-1">
                            <p class="text-gray-500 text-xs font-medium">必填</p>
                            <span class="px-2 py-0.5 rounded text-xs font-bold"
                                  :class="detailItem && detailItem.required ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'"
                                  x-text="detailItem && detailItem.required ? '必填' : '非必填'"></span>
                        </div>
                    </div>

                    <!-- 說明 Tip -->
                    <template x-if="detailItem && detailItem.tip">
                        <div class="flex items-start gap-1.5 px-3 py-2 bg-amber-50 border border-amber-100 rounded text-xs text-amber-700">
                            <i class="ph ph-info text-amber-500 flex-shrink-0 mt-0.5"></i>
                            <span x-text="detailItem.tip"></span>
                        </div>
                    </template>

                    <!-- Card: 基本 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm" x-data="{ cardOpen: true }">
                        <div @click="cardOpen = !cardOpen"
                             class="px-4 py-3 border-b border-gray-100 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors select-none">
                            <div class="flex items-center gap-2 font-bold text-gray-700 text-sm">
                                <i class="ph-fill ph-identification-card"></i> 基本
                            </div>
                            <i class="ph text-gray-400 text-sm transition-transform duration-200"
                               :class="cardOpen ? 'ph-caret-up' : 'ph-caret-down'"></i>
                        </div>
                        <div x-show="cardOpen" class="p-5 space-y-4">

                            <!-- 名稱 (always read-only) -->
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-gray-500">
                                    <span class="border-b border-dashed border-gray-400 cursor-help relative group/namelabel">
                                        名稱
                                        <div class="absolute bottom-full left-0 mb-1.5 w-28 bg-gray-800 text-white text-[11px] px-2.5 py-2 rounded shadow-xl z-[500] font-normal opacity-0 invisible group-hover/namelabel:opacity-100 group-hover/namelabel:visible transition-all whitespace-nowrap">
                                            名稱 / Key
                                        </div>
                                    </span>
                                </label>
                                <div class="flex flex-col gap-0.5 px-3 py-2 bg-gray-50 rounded border border-gray-100">
                                    <span class="text-sm text-gray-800 font-medium" x-text="detailItem ? detailItem.name : ''"></span>
                                    <span class="text-[11px] text-gray-400 font-mono" x-text="detailItem ? detailItem.key : ''"></span>
                                </div>
                            </div>

                            <!-- 內容 -->
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-gray-500">內容</label>

                                <!-- 讀取模式 -->
                                <div x-show="!isEditing" class="px-3 py-3 bg-gray-50 rounded border border-gray-100 min-h-[44px]">
                                    <template x-if="detailItem && detailItem.valueType === 'switch'">
                                        <span class="px-2 py-0.5 rounded text-xs font-bold"
                                              :class="detailItem.value ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'"
                                              x-text="detailItem.value ? '啟用' : '停用'"></span>
                                    </template>
                                    <template x-if="detailItem && detailItem.valueType === 'select-single'">
                                        <span class="px-2 py-0.5 rounded text-xs font-bold"
                                              :class="{
                                                  'bg-green-100 text-green-700': detailItem.value === '啟用',
                                                  'bg-gray-100 text-gray-500':   detailItem.value === '停用',
                                                  'bg-amber-100 text-amber-700': detailItem.value === '維護中',
                                                  'bg-blue-100 text-blue-700':   !['啟用','停用','維護中'].includes(detailItem.value)
                                              }"
                                              x-text="detailItem.value"></span>
                                    </template>
                                    <template x-if="detailItem && detailItem.valueType === 'datetime-range'">
                                        <span class="font-mono text-xs"
                                              :class="(detailItem.value.start || detailItem.value.end) ? 'text-gray-700' : 'text-gray-400'"
                                              x-text="(detailItem.value.start || '未設定') + ' ~ ' + (detailItem.value.end || '未設定')"></span>
                                    </template>
                                    <template x-if="detailItem && detailItem.valueType === 'textarea'">
                                        <pre class="text-xs text-gray-700 whitespace-pre-wrap font-mono" x-text="detailItem.value || '(空)'"></pre>
                                    </template>
                                    <template x-if="detailItem && detailItem.valueType === 'input-text'">
                                        <span class="text-sm text-gray-700" x-text="detailItem.value || '(空)'"></span>
                                    </template>
                                    <template x-if="detailItem && detailItem.valueType === 'multi-select'">
                                        <div class="flex flex-wrap gap-1.5">
                                            <template x-for="v in (detailItem.value || [])" :key="v">
                                                <span class="bg-blue-50 text-blue-700 border border-blue-100 px-2 py-0.5 rounded text-xs font-medium" x-text="v"></span>
                                            </template>
                                            <template x-if="!(detailItem.value && detailItem.value.length)">
                                                <span class="text-gray-400 text-xs">(未設定)</span>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- 編輯模式 -->
                                <div x-show="isEditing">
                                    <template x-if="detailItem && detailItem.valueType === 'switch'">
                                        <label class="flex items-center gap-3 cursor-pointer h-[44px]">
                                            <button @click="editValue = !editValue" type="button"

                options: ['台灣', '香港', '澳門', '日本', '韓國', '泰國', '越南', '馬來西亞', '新加坡', '印尼', '菲律賓', '美國', '英國', '加拿大', '澳洲', '德國', '法國'],
                value: ['台灣', '香港', '澳門'],
                updatedAt: '2025/03/20 11:00:00', operator: 'admin',
                changeHistory: [
                    { time: '2025/03/20 11:00:00', timeRel: '2 個月前', paramKey: 'AllowAccessCount', paramName: '開放國別', content: '「開放國別」更新：台灣、香港、澳門', operator: 'admin' }
                ]
            },
            {
                key: 'Currency', name: '幣別', desc: '', tip: '', remark: '',
                required: true, valueType: 'select-single',
                options: ['TWD', 'USD', 'EUR', 'JPY', 'KRW', 'HKD', 'CNY', 'SGD', 'AUD', 'GBP'],
                value: 'TWD', updatedAt: '2025/01/01 00:00:00', operator: 'system',
                changeHistory: [{ time: '2025/01/01 00:00:00', timeRel: '5 個月前', paramKey: 'Currency', paramName: '幣別', content: '初始設定：TWD', operator: 'system' }]
            },
            {
                key: 'WeekStart', name: '週起始', desc: '', tip: '', remark: '',
                required: true, valueType: 'select-single', options: ['日', '一'], value: '日',
                updatedAt: '2025/01/01 00:00:00', operator: 'system',
                changeHistory: [{ time: '2025/01/01 00:00:00', timeRel: '5 個月前', paramKey: 'WeekStart', paramName: '週起始', content: '初始設定：日', operator: 'system' }]
            }
        ];

        /* ── Modals ──────────────────────────────────────────── */
        function sysModals() {
            return {
                historyOpen: false,
                get allHistory() {
                    return window._sysParams.flatMap(p => p.changeHistory || []).sort((a, b) => b.time.localeCompare(a.time));
                },

                /* ── 詳細 / 編輯 ── */
                detailOpen: false,
                isEditing: false,
                detailItem: null,
                editValue: null,
                editRemark: '',
                openDetail(row) {
                    this.detailItem = row;
                    this.editValue = (typeof row.value === 'object' && row.value !== null)
                        ? JSON.parse(JSON.stringify(row.value)) : row.value;
                    this.editRemark = row.remark || '';
                    this.isEditing = false;
                    this.detailOpen = true;
                },
                startEdit() {
                    this.editValue = (typeof this.detailItem.value === 'object' && this.detailItem.value !== null)
                        ? JSON.parse(JSON.stringify(this.detailItem.value)) : this.detailItem.value;
                    this.editRemark = this.detailItem.remark || '';
                    this.isEditing = true;
                },
                cancelEdit() { this.isEditing = false; },
                saveEdit() {
                    const now = new Date().toLocaleString('zh-TW', {
                        timeZone: 'Asia/Taipei', hour12: false,
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit', second: '2-digit'
                    }).replace(',', '');
                    if (JSON.stringify(this.detailItem.value) !== JSON.stringify(this.editValue) || this.detailItem.remark !== this.editRemark) {
                        this.detailItem.changeHistory.unshift({
                            time: now, timeRel: '剛剛',
                            paramKey: this.detailItem.key, paramName: this.detailItem.name,
                            content: `「${this.detailItem.name}」異動`, operator: 'yvonne'
                        });
                    }
                    this.detailItem.value = this.editValue;
                    this.detailItem.remark = this.editRemark;
                    this.detailItem.updatedAt = now;
                    this.detailItem.operator = 'yvonne';
                    this.isEditing = false;
                    this.$dispatch('notify', { message: `【 ${this.detailItem.name} 】已儲存` });
                },
                valueTypeLabel(type) {
                    return { 'input-text': 'Input（Text）', 'textarea': 'Textarea（文本）', 'switch': 'Switch（開關）', 'select-single': 'Select（單選）', 'multi-select': 'Select（複選）', 'datetime-range': 'DateTime（區間）' }[type] || type;
                },

                /* ── 新增 ── */
                addOpen: false,
                addForm: { key: '', name: '', valueType: 'input-text', value: '', optionsText: '', desc: '', remark: '', required: false },
                addErrors: {},
                get addOptionsArray() {
                    return this.addForm.optionsText.split('\n').map(s => s.trim()).filter(Boolean);
                },
                openAdd() {
                    this.addForm = { key: '', name: '', valueType: 'input-text', value: '', optionsText: '', desc: '', remark: '', required: false };
                    this.addErrors = {};
                    this.addOpen = true;
                },
                resetAddValue() {
                    const t = this.addForm.valueType;
                    if (t === 'switch')              this.addForm.value = false;
                    else if (t === 'datetime-range') this.addForm.value = { start: '', end: '' };
                    else if (t === 'multi-select')   this.addForm.value = [];
                    else                             this.addForm.value = '';
                },
                validateAddKey() {
                    const v = this.addForm.key;
                    if (!v) { this.addErrors.key = '必填'; return false; }
                    if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(v)) { this.addErrors.key = '僅允許英文、數字及底線，且須以英文字母開頭'; return false; }
                    if (window._sysParams.some(p => p.key === v)) { this.addErrors.key = '此 Key 已存在'; return false; }
                    delete this.addErrors.key; return true;
                },
                validateAddName() {
                    const v = this.addForm.name;
                    if (!v) { this.addErrors.name = '必填'; return false; }
                    if (v.length > 25) { this.addErrors.name = '最多 25 個字元'; return false; }
                    if (/[!@#$%^&*()+\-=\[\]{};':"\\|,.<>\/?`~]/.test(v)) { this.addErrors.name = '禁止使用特殊符號'; return false; }
                    delete this.addErrors.name; return true;
                },
                submitAdd() {
                    if (!this.validateAddKey() | !this.validateAddName()) return;
                    const now = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(',', '');
                    window._sysParams.push({
                        key: this.addForm.key, name: this.addForm.name,
                        desc: this.addForm.desc, tip: this.addForm.desc, remark: this.addForm.remark,
                        required: this.addForm.required, valueType: this.addForm.valueType,
                        options: (this.addForm.valueType === 'select-single' || this.addForm.valueType === 'multi-select') ? this.addOptionsArray : [],
                        value: this.addForm.value, updatedAt: now, operator: 'yvonne',
                        changeHistory: [{ time: now, timeRel: '剛剛', paramKey: this.addForm.key, paramName: this.addForm.name, content: '新增參數', operator: 'yvonne' }]
                    });
                    const name = this.addForm.name;
                    this.addOpen = false;
                    this.$dispatch('notify', { message: `【 ${name} 】新增成功` });
                }
            };
        }

        /* ── Main Page ───────────────────────────────────────── */
        function systemPage() {
            return {
                get params() { return window._sysParams; },
                valueTypeLabel(type) {
                    return { 'input-text': 'Input（Text）', 'textarea': 'Textarea（文本）', 'switch': 'Switch（開關）', 'select-single': 'Select（單選）', 'multi-select': 'Select（複選）', 'datetime-range': 'DateTime（區間）' }[type] || type;
                },

                /* 欄位選取 */
                isColumnModalOpen: false,
                colStatus: { updatedAt: true, operator: true, content: true, type: true, required: true, remark: true },
                tempColStatus: {},
                columnGroups: {
                    info:  ['updatedAt', 'operator'],
                    basic: ['content', 'type', 'required'],
                    other: ['remark']
                },
                get totalColCount() { return 6; },
                get selectedCount()  { return Object.values(this.tempColStatus).filter(v => v).length; },
                isGroupChecked(g)       { return this.columnGroups[g].every(k => this.tempColStatus[k]); },
                isGroupIndeterminate(g) { const n = this.columnGroups[g].filter(k => this.tempColStatus[k]).length; return n > 0 && n < this.columnGroups[g].length; },
                toggleGroup(g) { const checked = this.isGroupChecked(g); this.columnGroups[g].forEach(k => this.tempColStatus[k] = !checked); },
                isAllChecked()       { return this.selectedCount === this.totalColCount; },
                isAllIndeterminate() { return this.selectedCount > 0 && this.selectedCount < this.totalColCount; },
                toggleAll() { const checked = this.isAllChecked(); Object.keys(this.columnGroups).forEach(g => this.columnGroups[g].forEach(k => this.tempColStatus[k] = !checked)); },
                openColumnModal()    { this.tempColStatus = { ...this.colStatus }; this.isColumnModalOpen = true; },
                confirmColumnModal() {
                    if (!Object.values(this.tempColStatus).some(v => v)) {
                        this.$dispatch('notify', { message: '至少選取 1 個項目' });
                        return;
                    }
                    this.colStatus = { ...this.tempColStatus };
                    this.isColumnModalOpen = false;
                }
            };
        }
    </script>
</body>
