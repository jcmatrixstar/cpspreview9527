<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 角色權限</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' },
                        amber: { DEFAULT: '#f59e0b', hover: '#d97706' } // 橘黃色
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="rolePermissionsPage()">

        <div id="layout-header"></div>

        <div class="flex-1 overflow-auto p-4 md:p-6 flex flex-col">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">用戶管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">角色權限</span>
                    </nav>

                    <div class="flex items-center gap-2">
                        <button @click="openLogModal()" class="w-8 h-8 rounded-full bg-white border border-gray-300 text-gray-500 hover:bg-gray-50 hover:text-primary shadow-sm active:scale-95 transition-all flex items-center justify-center tooltip" data-tip="異動紀錄">
                            <i class="ph ph-clock-counter-clockwise text-lg"></i>
                        </button>
                        <button x-show="currentTab === 'permission'" @click="openSettings()" class="w-8 h-8 rounded-full bg-white border border-gray-300 text-gray-500 hover:bg-gray-50 hover:text-primary shadow-sm active:scale-95 transition-all flex items-center justify-center tooltip" data-tip="設定">
                            <i class="ph ph-gear text-lg"></i>
                        </button>
                        <button class="w-8 h-8 rounded-full bg-primary text-white hover:bg-blue-600 shadow-md active:scale-95 transition-all flex items-center justify-center tooltip" @click="addRecord()" data-tip="新增">
                            <i class="ph ph-plus text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Tab 頁籤 -->
                <div class="flex gap-1 border-b border-gray-200 pt-2 sticky top-0 z-30 flex-shrink-0 bg-[#f3f4f6]/90 backdrop-blur-[1px]">
                    <button @click="currentTab = 'role'; refreshData()" class="px-8 py-2.5 text-sm font-bold border-b-2 transition-all flex items-center gap-2 whitespace-nowrap" :class="currentTab === 'role' ? 'border-primary text-primary bg-white rounded-t-md shadow-sm' : 'border-transparent text-gray-400 hover:text-gray-600'">
                        <i class="ph text-lg ph-users-three"></i><span :class="{'hidden sm:inline': currentTab !== 'role', 'inline': currentTab === 'role'}">角色</span>
                    </button>
                    <button @click="currentTab = 'permission'; refreshData()" class="px-8 py-2.5 text-sm font-bold border-b-2 transition-all flex items-center gap-2 whitespace-nowrap" :class="currentTab === 'permission' ? 'border-primary text-primary bg-white rounded-t-md shadow-sm' : 'border-transparent text-gray-400 hover:text-gray-600'">
                        <i class="ph text-lg ph-shield-check"></i><span :class="{'hidden sm:inline': currentTab !== 'permission', 'inline': currentTab === 'permission'}">權限</span>
                    </button>
                </div>

                <div class="lg:hidden flex-shrink-0">
                    <div @click="openSearchModal()" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <div class="bg-white rounded-lg p-4 border border-gray-200 shadow-sm flex-col flex-wrap gap-4 flex-shrink-0 hidden lg:flex">
                    <div class="flex flex-wrap items-end justify-between w-full gap-4">
                        <div class="flex flex-wrap items-end gap-4 mr-auto">
                            <div x-show="currentTab === 'role'" class="flex items-end gap-4">
                                <div class="floating-input-group w-44"><label class="floating-label">Key</label><input type="text" x-model="tempSearchKey" class="floating-input bg-input-base focus:bg-white"></div>
                                <div class="floating-input-group w-44"><label class="floating-label">名稱</label><input type="text" x-model="tempSearchName" class="floating-input bg-input-base focus:bg-white"></div>
                            </div>
                            <div x-show="currentTab === 'permission'" class="flex items-end gap-4">
                                <div class="floating-input-group w-44 z-20 relative" x-data="{ open: false }">
                                    <label class="floating-label">分類</label>
                                    <button @click="open = !open" @click.outside="open = false" class="floating-input bg-input-base focus:bg-white text-left flex items-center justify-between"><span class="truncate text-gray-700" x-text="tempSearchCategory || '全部'"></span><i class="ph ph-caret-down text-gray-400"></i></button>
                                    <div x-show="open" class="absolute top-full left-0 w-full mt-1 bg-white border border-gray-200 shadow-lg rounded max-h-48 overflow-y-auto z-50">
                                        <div @click="tempSearchCategory = ''; open = false" class="px-3 py-2 hover:bg-gray-50 cursor-pointer text-sm">全部</div>
                                        <template x-for="cat in settingsGroups" :key="cat"><div @click="tempSearchCategory = cat; open = false" class="px-3 py-2 hover:bg-gray-50 cursor-pointer text-sm" x-text="cat"></div></template>
                                    </div>
                                </div>
                                <div class="floating-input-group w-44"><label class="floating-label">功能</label><input type="text" x-model="tempSearchFeature" class="floating-input bg-input-base focus:bg-white"></div>
                                <div class="floating-input-group w-52"><label class="floating-label">名稱</label><input type="text" x-model="tempSearchPermission" class="floating-input bg-input-base focus:bg-white"></div>
                            </div>
                        </div>
                        <button @click="refreshData(false)" class="w-10 h-10 flex-shrink-0 flex items-center justify-center bg-primary text-white rounded-lg hover:bg-blue-600 shadow-md active:scale-95 transition-all"><i class="ph ph-magnifying-glass text-xl"></i></button>
                    </div>
                </div>

                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col flex-1 min-h-0 relative">
                    <div class="bg-gray-100 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-between text-gray-800">
                         <div class="flex gap-8 items-center px-4 whitespace-nowrap w-full justify-end">
                             <div class="flex flex-col text-right"><span class="text-xs text-gray-500">筆數</span><span class="text-sm font-bold text-gray-800" x-text="totalFilteredCount"></span></div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-auto custom-scroll relative z-0 h-full">
                        <table class="w-full text-left border-collapse min-w-[1200px]">
                            <thead x-show="currentTab === 'role'" class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">Key</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 sticky left-0 z-20 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]">名稱</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-right">人數</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 min-w-[300px]">權限</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">更新時間</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">操作者</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">備註</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center w-[120px] sticky right-0 z-20 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">操作</th>
                                </tr>
                            </thead>
                            <thead x-show="currentTab === 'permission'" class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 th-perm-sort">排序</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">分類</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 th-perm-feature">功能</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 th-perm-name">名稱</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 th-perm-desc">描述</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center">檢視</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center">異動</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center">進階</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center">關聯</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center">接口</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">更新時間</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">操作者</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50">備註</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center w-[120px] sticky right-0 z-20 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">操作</th>
                                </tr>
                            </thead>

                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="role in displayedRoles" :key="role.Key">
                                    <tr class="hover:bg-blue-50/50 transition-colors" x-show="currentTab === 'role'">
                                        <td class="px-4 py-3 font-mono text-gray-700 text-xs" x-text="role.Key"></td>
                                        <td class="px-4 py-3 sticky left-0 bg-white z-10 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]">
                                            <span class="px-2 py-1 rounded text-sm font-bold inline-flex items-center gap-1" :style="`background-color: ${role.Color || '#D1D5DB'}; color: ${getTextColor(role.Color || '#D1D5DB')};`">
                                                <i x-show="role.Key === 'ADMIN'" class="ph-fill ph-crown text-yellow-500"></i>
                                                <span x-text="role.名稱"></span>
                                            </span>
                                        </td>
                                        <td class="px-4 py-3 text-right">
                                            <a href="#" class="text-primary font-bold hover:underline" x-text="role.人數"></a>
                                        </td>
                                        <td class="px-4 py-3">
                                            <div x-show="role.Key !== 'ADMIN'" class="flex items-center gap-1.5"><span class="text-gray-700 font-mono text-xs" x-text="role.權限"></span><i class="ph ph-check-circle text-lg text-green-500" x-show="role.權限.split('/')[0] === role.權限.split('/')[1]"></i></div>
                                            <div x-show="role.Key === 'ADMIN'" class="text-green-600 font-bold flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> 全部權限</div>
                                        </td>
                                        <td class="px-4 py-3 table-cell-nowrap text-xs">
                                            <div class="font-mono text-gray-700" x-text="role.更新時間"></div>
                                            <div class="text-[11px] text-gray-400 mt-0.5" x-text="getRelativeTime(role.更新時間)"></div>
                                        </td>
                                        <td class="px-4 py-3 table-cell-nowrap text-sm">
                                            <div class="flex items-center gap-2">
                                                <img class="w-6 h-6 rounded-full" :src="getUserAvatar(role.操作者)">
                                                <a href="#" class="text-blue-600 hover:underline font-medium font-mono text-xs" x-text="getOperatorAccount(role.操作者)"></a>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-xs" :class="role.備註 ? 'text-gray-700' : 'text-gray-500'" x-text="role.備註 || '(無)'"></td>
                                        <td class="w-10 lg:w-28 px-1 py-3 text-center sticky right-0 bg-white z-10 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]" x-data="{ open: false }" :class="{'!z-[50]': open}">
                                            <div class="hidden lg:flex items-center justify-center gap-1">
                                                <button @click="openRoleDetail(role)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip" data-tip="檢視"><i class="ph ph-caret-right text-lg"></i></button>
                                                <button @click="openDeleteConfirm(role)" :disabled="role.Key.includes('ADMIN')" class="w-8 h-8 rounded-full hover:bg-red-50 flex items-center justify-center text-gray-500 hover:text-red-500 transition-colors tooltip" :class="{'opacity-50 cursor-not-allowed': role.Key.includes('ADMIN')}" data-tip="刪除"><i class="ph ph-trash text-lg"></i></button>
                                            </div>
                                            <div class="lg:hidden relative flex items-center justify-center">
                                                <button @click.stop="open = !open" class="w-8 h-8 rounded-full hover:bg-gray-100 text-gray-500 flex items-center justify-center"><i class="ph ph-list text-lg"></i></button>
                                                <div x-show="open" @click.outside="open = false" class="absolute right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl py-1 z-[200] min-w-[120px] text-left" x-cloak>
                                                    <button @click="openRoleDetail(role); open = false" class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 text-gray-700 flex items-center gap-2"><i class="ph ph-caret-right"></i>檢視</button>
                                                    <button @click="openDeleteConfirm(role); open = false" :disabled="role.Key.includes('ADMIN')" class="w-full text-left px-4 py-2 text-sm hover:bg-red-50 text-gray-700 flex items-center gap-2" :class="{'opacity-50 pointer-events-none': role.Key.includes('ADMIN')}"><i class="ph ph-trash text-red-500"></i>刪除</button>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                                <template x-for="(perm, index) in displayedPermissions" :key="perm.Permission">
                                    <tr class="hover:bg-blue-50/50 transition-colors" x-show="currentTab === 'permission'">
                                        <td class="px-4 py-3 font-mono text-gray-700 text-sm th-perm-sort" x-text="getPermissionIndex(index)"></td>
                                        <td class="px-4 py-3 text-xs text-gray-700 font-bold" x-text="perm.Group"></td>
                                        <td class="px-4 py-3 font-medium text-gray-500 td-perm-name" x-text="perm.Feature"></td>
                                        <td class="px-4 py-3 font-medium text-primary text-sm td-perm-name" x-text="perm.Name"></td>
                                        <td class="px-4 py-3 text-xs text-gray-500 td-perm-desc">
                                            <div class="mb-0.5 font-mono" x-text="perm.Permission"></div>
                                            <div x-html="perm.Note"></div>
                                        </td>
                                        <td class="px-4 py-3 text-center"><i class="ph ph-check text-lg text-green-500" x-show="perm.View && !perm.Modify && !perm.Advance"></i></td>
                                        <td class="px-4 py-3 text-center"><i class="ph ph-check text-lg text-green-500" x-show="perm.Modify && !perm.Advance"></i></td>
                                        <td class="px-4 py-3 text-center"><i class="ph ph-check text-lg text-green-500" x-show="perm.Advance"></i></td>

                                        <td class="px-4 py-3 text-center relative" x-data="{ open: false }">
                                            <button @click="open = !open" @click.outside="open = false" class="text-blue-600 hover:underline font-bold" x-text="perm.relations.length"></button>
                                            <div x-show="open" class="absolute top-0 mt-8 left-1/2 -translate-x-1/2 w-48 bg-white border border-gray-200 rounded shadow-xl z-50 text-left p-2" style="display: none;">
                                                <div class="text-xs text-gray-400 font-bold mb-1 border-b pb-1">關聯</div>
                                                <ul class="text-xs text-gray-700 space-y-1 max-h-32 overflow-y-auto custom-scroll">
                                                    <template x-for="r in perm.relations"><li x-text="r"></li></template>
                                                    <li x-show="perm.relations.length === 0" class="text-gray-400 italic">無</li>
                                                </ul>
                                            </div>
                                        </td>

                                        <td class="px-4 py-3 text-center relative" x-data="{ open: false }">
                                            <button @click="open = !open" @click.outside="open = false" class="text-blue-600 hover:underline font-bold" x-text="perm.apis.length"></button>
                                            <div x-show="open" class="absolute top-0 mt-8 left-1/2 -translate-x-1/2 w-64 bg-white border border-gray-200 rounded shadow-xl z-50 text-left p-2" style="display: none;">
                                                <div class="text-xs text-gray-400 font-bold mb-1 border-b pb-1">接口</div>
                                                <ul class="text-xs font-mono text-gray-600 space-y-1 max-h-32 overflow-y-auto custom-scroll">
                                                    <template x-for="api in perm.apis"><li x-text="api" class="break-all"></li></template>
                                                    <li x-show="perm.apis.length === 0" class="text-gray-400 italic">無</li>
                                                </ul>
                                            </div>
                                        </td>

                                        <td class="px-4 py-3 table-cell-nowrap text-xs">
                                            <div class="font-mono text-gray-700" x-text="perm.UpdateTime"></div>
                                            <div class="text-[11px] text-gray-400 mt-0.5" x-text="getRelativeTime(perm.UpdateTime)"></div>
                                        </td>
                                        <td class="px-4 py-3 table-cell-nowrap text-sm">
                                            <div class="flex items-center gap-2">
                                                <img class="w-6 h-6 rounded-full" :src="getUserAvatar(perm.Operator)">
                                                <a href="#" class="text-blue-600 hover:underline font-medium font-mono text-xs" x-text="getOperatorAccount(perm.Operator)"></a>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-xs" :class="perm.Remark ? 'text-gray-700' : 'text-gray-500'" x-text="perm.Remark || '(無)'"></td>

                                        <td class="w-20 px-1 py-3 text-center sticky right-0 bg-white z-10 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">
                                            <div class="flex items-center justify-center">
                                                <button @click="openPermissionDetail(perm)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip" data-tip="檢視"><i class="ph ph-caret-right text-lg"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <div x-show="totalFilteredCount === 0" class="p-10 text-center text-gray-400"><i class="ph ph-file-search text-4xl mb-2"></i><p>查無資料</p></div>
                    </div>

                    <div class="p-4 border-t border-gray-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2 bg-white flex-shrink-0 sticky bottom-0 z-20">
                        <div class="flex items-center gap-2 order-1 md:order-1">
                             <div class="flex items-center gap-2 text-gray-400 mr-2">
                                <button @click="changePage(1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                                <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                             </div>
                             <div class="flex items-center gap-1">
                                <template x-for="p in totalPages" :key="p">
                                    <button @click="changePage(p)" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors" :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                                </template>
                             </div>
                             <div class="flex items-center gap-2 text-gray-400 ml-2">
                                <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                                <button @click="changePage(totalPages)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                             </div>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2 md:mb-0 md:pl-4 md:border-l border-gray-200 order-2 md:order-2">
                            <span>每頁筆數：</span>
                            <div class="relative" x-data="{ open: false }">
                                <button @click="open = !open" @click.outside="open = false" class="border border-gray-300 rounded px-2 py-1 bg-white hover:border-gray-400 flex items-center gap-2 min-w-[60px] justify-between"><span x-text="pageSize"></span><i class="ph ph-caret-down text-gray-400"></i></button>
                                <div x-show="open" class="absolute bottom-full left-0 w-full mb-1 bg-white border border-gray-200 shadow rounded z-30">
                                    <div @click="pageSize = 10; currentPage = 1; open = false" class="px-2 py-1 hover:bg-gray-50 cursor-pointer">10</div>
                                    <div @click="pageSize = 20; currentPage = 1; open = false" class="px-2 py-1 hover:bg-gray-50 cursor-pointer">20</div>
                                    <div @click="pageSize = 50; currentPage = 1; open = false" class="px-2 py-1 hover:bg-gray-50 cursor-pointer">50</div>
                                </div>
                            </div>
                            <span class="ml-2" x-text="`${(currentPage-1)*pageSize + 1} - ${Math.min(currentPage*pageSize, totalFilteredCount)} 共 ${totalFilteredCount}`"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div x-show="searchOpen" style="display: none;" class="fixed inset-0 z-[120] bg-white lg:hidden flex flex-col" x-transition.opacity>
             <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center flex-shrink-0">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-lg text-gray-800" x-text="'角色權限 - ' + (currentTab === 'role' ? '角色' : '權限')"></span>
                    <span class="text-gray-400 font-normal text-sm">搜尋</span>
                </div>
                <button @click="searchOpen = false" class="text-gray-500"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 custom-scroll space-y-4">
                <template x-if="currentTab === 'role'">
                    <div class="space-y-4">

                init() {
                    // 初始化篩選條件

                    this.searchOpen = true;
                },

                refreshData(resetPage = true) {
                    // 點擊搜尋按鈕時，將暫存值賦予正式篩選值
                    this.searchKey = this.tempSearchKey;
                    this.searchName = this.tempSearchName;
                    this.searchCategory = this.tempSearchCategory;
                    this.searchFeature = this.tempSearchFeature;
                    this.searchPermission = this.tempSearchPermission;

                    if (resetPage) this.currentPage = 1;
                },

                get filteredRoleData() { return this.mockRoleData.filter(r => (!this.searchKey || r.Key.toLowerCase().includes(this.searchKey.toLowerCase())) && (!this.searchName || r.名稱.includes(this.searchName))); },

                get filteredPermissionData() {
                    let filtered = this.mockPermissionData.filter(p =>
                        (!this.searchCategory || p.Group.includes(this.searchCategory)) &&
                        (!this.searchFeature || p.Feature.includes(this.searchFeature)) &&
                        (!this.searchPermission || p.Name.includes(this.searchPermission))
                    );
                    // 根據 Sort 排序
                    return filtered.sort((a, b) => a.Sort - b.Sort);
                },
                get displayedPermissions() { const start = (this.currentPage - 1) * parseInt(this.pageSize); return this.filteredPermissionData.slice(start, start + parseInt(this.pageSize)); },

                get totalPages() { return Math.ceil(this.totalFilteredCount / this.pageSize) || 1; },
                changePage(page) { if (page >= 1 && page <= this.totalPages) this.currentPage = page; },

                get filteredLogs() {
                    return this.currentTab === 'role' ? this.mockRoleLogs : this.mockPermissionLogs;
                },
                openLogModal() {
                    this.isLogModalOpen = true;
                },

                getOperatorAccount(operatorString) {

                        return match[1]; // 提取括號內的內容 (帳號)
                    }
                    return operatorString; // 如果沒有括號，則直接返回原始字串
                },

                getTextColor(hex) { if(!hex) return '#374151'; const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16); return ((r * 299 + g * 587 + b * 114) / 1000) > 128 ? '#000000' : '#FFFFFF'; },
                getUserAvatar(operator) {
                    const account = this.getOperatorAccount(operator);
                    return account === 'System' ? 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🤖</text></svg>' : 'https://ui-avatars.com/api/?name=' + account + '&background=random';
                },
                getAllPermissionNames() { return this.mockPermissionData.map(p => p.Name); },

                getRelativeTime(dateTimeString) {
                    if (!dateTimeString) return 'N/A';
                    const diff = new Date().getTime() - new Date(dateTimeString).getTime();
                    const seconds = Math.floor(diff / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const hours = Math.floor(minutes / 60);
                    const days = Math.floor(minutes / 60);
                    const months = Math.floor(days / 30);
                    const years = Math.floor(days / 365);
                    if (years > 0) return `- ${years} 年前`;
                    if (months > 0) return `- ${months} 個月前`;
                    if (days > 0) return `- ${days} 天前`;
                    if (hours > 0) return `- ${hours} 小時前`;
                    if (minutes > 0) return `- ${minutes} 分鐘前`;
                    return '- 剛才';
                },

                // 權限列表：計算當前頁面資料序號
                getPermissionIndex(index) {
                    return (this.currentPage - 1) * parseInt(this.pageSize) + index + 1;
                },

                addRecord() {
                    const newDateTime = new Date().toLocaleDateString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('/') + ' ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    if (this.currentTab === 'role') {
                        this.currentEditRole = { Key: '', 名稱: '', Color: '#D1D5DB', 權限: '0 / 100', 備註: '', selectedPermissions: [], Users:[], 更新時間: newDateTime, 操作者: 'Yvonne', 人數: 0, selectedRoles:[] };
                        this.isRoleDetailOpen = false;
                        this.isRoleEditOpen = true;
                    } else {
                        const lastSort = this.mockPermissionData.length > 0 ? this.mockPermissionData.sort((a, b) => b.Sort - a.Sort)[0].Sort : 0;
                        this.currentEditPerm = { Sort: lastSort + 10, Group: '', Feature: '', Name: '', Permission: '', Note: '', typeMode: 'View', relations: [], apis:[], UpdateTime: newDateTime, Operator: 'Yvonne', Remark: '', View: true, Modify: false, Advance: false };
                        this.isPermissionDetailOpen = false;
                        this.isPermissionEditOpen = true;
                    }
                },

                // 角色操作
                openRoleDetail(role) {
                    this.currentDetailRole = { ...role };
                    this.isRoleEditOpen = false;
                    this.isRoleDetailOpen = true;
                },
                editRole(role) {
                    this.currentEditRole = { ...role, selectedPermissions: [...role.selectedPermissions], Users: [...role.Users], selectedRoles:[...role.selectedRoles || []] };
                    this.isRoleDetailOpen = false;
                    this.isRoleEditOpen = true;
                },
                saveRole() {
                    this.isRoleEditOpen = false;
                    this.isRoleDetailOpen = false; // 儲存後關閉所有彈窗 (可根據實際需求調整)
                    this.$dispatch('notify', `角色已儲存`);
                },
                openDeleteConfirm(role) {
                    if(role.Key.includes('ADMIN')) return;
                    this.deleteTarget = role;
                    this.isDeleteConfirmOpen = true;
                },
                confirmDeleteRole() {
                    if(!this.deleteTarget) return;
                    this.mockRoleData = this.mockRoleData.filter(r => r.Key !== this.deleteTarget.Key);
                    this.$dispatch('notify', `角色 ${this.deleteTarget.Key} 已刪除`);
                    this.isDeleteConfirmOpen = false;
                    this.deleteTarget = null;
                },
                closeRoleEditToDetail() {
                    // 如果是新增模式 (Key為空)，則直接關閉編輯
                    if(!this.currentEditRole.Key) {
                        this.isRoleEditOpen = false;
                        this.isRoleDetailOpen = false;
                    } else {
                        // 編輯模式，返回詳細畫面
                        this.isRoleEditOpen = false;
                        this.isRoleDetailOpen = true;
                    }
                },
                quickSelectRoles(selectedNames) {
                    if(!selectedNames) return;
                    this.currentEditRole.selectedRoles = selectedNames;
                    this.currentEditRole.selectedPermissions =[];
                    // 根據選中的角色名稱，合併他們的權限
                    selectedNames.forEach(name => {
                         const role = this.mockRoleData.find(r => r.名稱 === name);
                         if(role && role.selectedPermissions) {
                             this.currentEditRole.selectedPermissions =[...new Set([...this.currentEditRole.selectedPermissions, ...role.selectedPermissions])];
                         }
                    });
                },

                // 權限操作
                openPermissionDetail(perm) {
                    this.currentDetailPerm = { ...perm };
                    // 修正：詳細頁面顯示的是數據中的 Sort 欄位值 (10, 20, 30...)
                    // 如果需要顯示當前頁面的序號，需要調整邏輯，但為了與編輯畫面保持一致，這裡保持顯示數據中的 Sort
                    // 假設數據中的 Sort 為唯一排序依據
                    this.currentDetailPerm.Sort = perm.Sort;
                    this.isPermissionEditOpen = false;
                    this.isPermissionDetailOpen = true;
                },
                editPermission(perm) {
                    let typeMode = perm.Advance ? 'Advance' : (perm.Modify ? 'Modify' : 'View');
                    this.currentEditPerm = {
                        ...perm,
                        // 編輯時顯示 Sort 欄位的值 (10, 20, 30...)
                        Sort: perm.Sort,
                        typeMode,
                        relations: [...perm.relations],
                        apis: [...perm.apis]
                    };
                    this.isPermissionDetailOpen = false;
                    this.isPermissionEditOpen = true;
                },
                savePermission() {
                    // 根據 typeMode 更新 View/Modify/Advance 狀態
                    this.currentEditPerm.View = this.currentEditPerm.typeMode === 'View' || this.currentEditPerm.typeMode === 'Modify' || this.currentEditPerm.typeMode === 'Advance';
                    this.currentEditPerm.Modify = this.currentEditPerm.typeMode === 'Modify' || this.currentEditPerm.typeMode === 'Advance';
                    this.currentEditPerm.Advance = this.currentEditPerm.typeMode === 'Advance';

                    this.isPermissionEditOpen = false;
                    this.isPermissionDetailOpen = false; // 儲存後關閉所有彈窗
                    this.$dispatch('notify', `權限已儲存`);
                },
                closePermissionEditToDetail() {
                    if(!this.currentEditPerm.Permission) {
                        this.isPermissionEditOpen = false;
                        this.isPermissionDetailOpen = false;
                    } else {
                        this.isPermissionEditOpen = false;
                        this.isPermissionDetailOpen = true;
                    }
                },

                openSettings() { this.settingsTab = 'group'; this.switchSettingsTab('group'); this.isSettingsOpen = true; },
                switchSettingsTab(tab) { this.settingsTab = tab; this.settingsData = tab === 'group' ? [...this.settingsGroups] : [...this.settingsFeatures]; },
                addSettingsItem() { this.settingsData.push(''); },
                removeSettingsItem(index) { this.settingsData.splice(index, 1); },
                dragStart(index) { this.dragIndex = index; },
                drop(index) { if (this.dragIndex !== null && this.dragIndex !== index) { const item = this.settingsData.splice(this.dragIndex, 1)[0]; this.settingsData.splice(index, 0, item); } this.dragIndex = null; },
                saveSettings() {
                    if (this.settingsTab === 'group') this.settingsGroups =[...this.settingsData.filter(x => x.trim())];
                    else this.settingsFeatures =[...this.settingsData.filter(x => x.trim())];
                    this.isSettingsOpen = false;
                    this.$dispatch('notify', '設定已儲存');
                }
            }
        }
    </script>
</body>
</html>
