<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 用戶列表</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="adminListPage()">

        <div id="layout-header"></div>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-4 md:p-6 flex flex-col">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <!-- Breadcrumb & Actions -->
                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">用戶管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">用戶列表</span>
                    </nav>
                    <div class="flex items-center gap-2">
                        <div class="relative group">
                            <button @click="isAlertEditing = false; isAlertSettingOpen = true" class="w-8 h-8 rounded-full bg-gray-50 text-gray-500 hover:bg-gray-100 hover:text-primary transition-colors flex items-center justify-center border border-gray-200 shadow-sm">
                                <i class="ph-bold ph-gear-six text-lg"></i>
                            </button>
                            <span class="btn-tip">設定</span>
                        </div>
                        <button @click="openCreateModal" class="w-8 h-8 rounded-full bg-primary text-white hover:bg-blue-600 shadow-md active:scale-95 transition-all flex items-center justify-center tooltip" data-tip="新增">
                            <i class="ph ph-plus text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- 手機搜尋觸發 -->
                <div class="lg:hidden flex-shrink-0">
                    <div @click="searchOpen = true" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <!-- Search Container -->
                <div :class="{ 'fixed inset-0 z-[150] bg-white flex flex-col': isMobile && searchOpen, 'bg-white border border-gray-200 rounded-lg shadow-sm flex-shrink-0 lg:block': !isMobile || !searchOpen, 'hidden': isMobile && !searchOpen }">

                    <!-- 手機關閉按鈕 -->
                    <div class="lg:hidden px-4 py-3 border-b border-gray-100 flex justify-between items-center mb-4 flex-shrink-0" x-show="isMobile">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800">用戶列表</span>
                            <span class="text-gray-400 font-normal text-sm">搜尋</span>
                        </div>
                        <button @click="searchOpen = false" class="text-gray-500 hover:text-gray-700 p-1"><i class="ph ph-x text-2xl"></i></button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 items-start lg:items-end gap-5 px-4 lg:px-5 pt-4 lg:pt-5" :class="{'overflow-y-auto flex-1': isMobile}">
                        <div class="floating-input-group">
                            <label class="floating-label">帳號</label>
                            <input type="text" x-model="search.account" class="floating-input bg-input-base focus:bg-white">
                        </div>

                        <div class="floating-input-group">
                            <label class="floating-label">狀態</label>
                            <select x-model="search.status" class="floating-input bg-input-base focus:bg-white appearance-none">
                                <option value="">全部</option>
                                <option value="enabled">啟用</option>
                                <option value="disabled">停用</option>
                            </select>
                            <i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i>
                        </div>

                        <div class="floating-input-group">
                            <label class="floating-label">最後登入時間</label>
                            <div class="flex items-center"><input x-ref="dateStart" type="text" class="floating-input rounded-r-none border-r-0 text-center bg-input-base"><div class="px-1 border-y border-gray-200 bg-input-base h-[42px] flex items-center text-gray-400">~</div><input x-ref="dateEnd" type="text" class="floating-input rounded-l-none border-l-0 text-center bg-input-base"></div>
                        </div>
                    </div>

                    <div class="flex justify-end" :class="isMobile ? 'flex-shrink-0 p-4 border-t border-gray-100' : 'mt-4 px-4 lg:px-5 lg:pb-5'">
                        <button @click="searchData(); searchOpen = false" class="lg:w-11 lg:h-11 w-full h-11 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                            <span class="lg:hidden">搜尋</span><i class="ph ph-magnifying-glass text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col flex-1 min-h-0 relative">
                    <!-- 總計樣式調整 (同 DepositAdjustment.html) -->
                    <div class="bg-gray-100 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-end text-gray-800">
                         <div class="flex gap-8 items-center px-4 whitespace-nowrap">
                             <div class="flex flex-col text-right"><span class="text-xs text-gray-500">筆數</span><span class="text-sm font-bold text-gray-800" x-text="admins.length"></span></div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-auto custom-scroll">
                        <table class="w-full text-left border-collapse min-w-[1000px]">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="w-24 lg:w-40 px-4 py-3 sticky left-0 z-20 bg-gray-50 table-cell-nowrap shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]">帳號</th>
                                    <th class="px-4 py-3">暱稱</th>
                                    <th class="px-4 py-3">狀態</th>
                                    <th class="px-4 py-3">2FA 驗證</th>
                                    <th class="px-4 py-3">最後登入時間</th>
                                    <th class="px-4 py-3">角色</th>
                                    <th class="w-10 lg:w-36 px-1 py-3 text-center sticky right-0 z-20 bg-gray-50 table-cell-nowrap shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="admin in displayedAdmins" :key="admin.account">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="w-24 lg:w-40 px-4 py-3 font-medium text-gray-900 sticky left-0 bg-white z-10 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)] truncate" x-text="admin.account"></td>
                                        <td class="px-4 py-3" x-text="admin.nickname || '(無)'"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded-md text-xs font-bold"
                                                  :class="admin.status === '啟用' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'"
                                                  x-text="admin.status"></span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <div class="flex items-center gap-2">
                                                <span class="px-2 py-0.5 rounded-md text-xs font-bold bg-red-100 text-red-500" x-text="admin.tfaStatus"></span>
                                                <div class="tooltip" :data-tip="admin.tfaEnforced ? '強制' : '未強制'">
                                                    <i :class="admin.tfaEnforced ? 'ph-fill ph-lock-key text-blue-500' : 'ph ph-lock-key-open text-black'" class="text-lg"></i>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-xs">
                                            <div class="font-mono text-gray-700" x-text="admin.lastLoginTime"></div>
                                            <div class="text-[11px] text-gray-400 mt-0.5" x-text="admin.lastLoginRelative"></div>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2.5 py-1 rounded-md text-xs font-bold"
                                                  :class="admin.role === 'ADMIN' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'"
                                                  x-text="admin.role"></span>
                                        </td>
                                        <td class="w-10 lg:w-36 px-1 py-3 text-center sticky right-0 bg-white z-10 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]" x-data="{ open: false }" :class="{'!z-[50]': open}">
                                            <div class="hidden lg:flex items-center justify-center gap-0.5">
                                                <button @click="openDetailModal(admin)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip" data-tip="檢視">
                                                    <i class="ph ph-caret-right text-lg"></i>
                                                </button>
                                                <button @click="openResetPwdModal(admin)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip" data-tip="重置密碼">
                                                    <i class="ph ph-key text-xl"></i>
                                                </button>
                                                <button @click="openArchiveConfirm(admin)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-red-500 transition-colors tooltip" data-tip="封存">
                                                    <i class="ph ph-archive-box text-xl"></i>
                                                </button>
                                            </div>
                                            <div class="lg:hidden relative flex items-center justify-center">
                                                <button @click.stop="open = !open" class="w-8 h-8 rounded-full hover:bg-gray-100 text-gray-500 flex items-center justify-center"><i class="ph ph-list text-lg"></i></button>
                                                <div x-show="open" @click.outside="open = false" class="absolute right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl py-1 z-[200] min-w-[140px] text-left" x-cloak>
                                                    <button @click="openDetailModal(admin); open = false" class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 text-gray-700 flex items-center gap-2"><i class="ph ph-caret-right"></i>檢視</button>
                                                    <button @click="openResetPwdModal(admin); open = false" class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 text-gray-700 flex items-center gap-2"><i class="ph ph-key text-orange-500"></i>重置密碼</button>
                                                    <button @click="openArchiveConfirm(admin); open = false" class="w-full text-left px-4 py-2 text-sm hover:bg-red-50 text-gray-700 flex items-center gap-2"><i class="ph ph-archive-box text-red-500"></i>封存</button>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-4 border-t border-gray-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2 bg-white flex-shrink-0 sticky bottom-0 z-20">
                        <div class="flex items-center gap-2 order-1">
                             <div class="flex items-center gap-2 text-gray-400 mr-2">
                                <button @click="currentPage = 1" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                                <button @click="currentPage--" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                             </div>
                             <div class="flex items-center gap-1">
                                <template x-for="p in totalPages" :key="p">
                                    <button @click="currentPage = p" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors" :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                                </template>
                             </div>
                             <div class="flex items-center gap-2 text-gray-400 ml-2">
                                <button @click="currentPage++" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                                <button @click="currentPage = totalPages" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                             </div>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2 md:mb-0 md:pl-4 md:border-l border-gray-200 order-2">
                            <span>每頁筆數：</span>
                            <select x-model="pageSize" class="border border-gray-300 rounded px-2 py-1 outline-none text-gray-700 bg-white">
                                <option value="10">10</option>
                                <option value="20">20</option>
                            </select>
                            <span class="ml-2" x-text="`${(currentPage - 1) * pageSize + 1} - ${Math.min(currentPage * pageSize, admins.length)} 共 ${admins.length}`"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Admin Modal (新增) -->
        <div x-show="isCreateModalOpen" style="display: none;" class="fixed inset-0 z-[160] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4 overflow-hidden flex flex-col" @click.outside="isCreateModalOpen = false">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                    <h3 class="text-lg font-bold text-gray-800">用戶新增</h3>
                </div>
                <div class="p-6 bg-gray-50 flex-1 overflow-y-auto max-h-[80vh] space-y-4">
                    <!-- 一般 Section -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                        <div class="px-4 py-3 border-b border-gray-100 flex items-center gap-2 font-bold text-gray-700">
                            <i class="ph-fill ph-identification-card text-gray-400"></i> 一般
                        </div>
                        <div class="p-6 space-y-6">
                            <!-- 基本排版分群 -->
                            <div class="space-y-4">
                                <h4 class="text-sm font-bold border-l-4 border-gray-500 pl-2">基本</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-1">
                                        <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span> 帳號</label>
                                        <input type="text" class="w-full border border-gray-200 rounded-md p-2.5 bg-gray-50 outline-none focus:border-primary">
                                    </div>
                                    <div class="space-y-1">
                                        <label class="text-xs font-bold text-gray-500">暱稱</label>
                                        <input type="text" class="w-full border border-gray-200 rounded-md p-2.5 bg-gray-50 outline-none focus:border-primary">
                                    </div>
                                </div>
                            </div>
                            <!-- 設定排版分群 -->
                            <div class="space-y-4">
                                <h4 class="text-sm font-bold border-l-4 border-gray-500 pl-2">設定</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span> 狀態</label>
                                        <div class="flex items-center gap-2" x-data="{ enabled: true }">
                                            <button type="button" @click="enabled = !enabled"
                                                    class="w-9 h-5 rounded-full relative transition-colors duration-300 flex-shrink-0"
                                                    :class="enabled ? 'bg-primary' : 'bg-gray-300'">
                                                <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow-sm transition-all duration-300"
                                                      :class="enabled ? 'translate-x-4' : 'translate-x-0'"></span>
                                            </button>
                                            <span class="text-sm text-gray-700" x-text="enabled ? '啟用' : '停用'"></span>
                                        </div>
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-xs font-bold text-gray-500"><span class="text-red-500">*</span> 2FA 驗證</label>
                                        <div class="flex items-center gap-2">
                                            <span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-500">停用</span>
                                            <i class="ph-bold ph-lock-key text-blue-500"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 其他 Section -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 border-b border-gray-100 flex items-center justify-between font-bold text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-note text-gray-400"></i> 其他</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-6">
                            <label class="text-xs font-bold text-gray-500">備註</label>
                            <textarea rows="4" class="w-full mt-1 border border-gray-200 rounded-md p-3 bg-gray-50 outline-none focus:border-primary"></textarea>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                    <button @click="isCreateModalOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-bold transition-colors">關閉</button>
                    <button @click="isCreateModalOpen = false; addToast('用戶已新增')" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600 shadow-sm text-sm font-bold transition-colors">儲存</button>
                </div>
            </div>
        </div>

        <!-- Detail/Edit Modal (詳情、編輯) -->
        <div x-show="isDetailModalOpen" style="display: none;" class="fixed inset-0 z-[160] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4 overflow-hidden flex flex-col" @click.outside="!isArchiveModalOpen && !isPwdModalOpen && (isDetailModalOpen = false)">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                    <h3 class="text-lg font-bold text-gray-800 flex items-baseline gap-2">
                        <span x-text="isEditMode ? '用戶編輯' : '用戶詳細'"></span>
                        <span class="text-sm font-normal text-gray-400 font-mono" x-text="selectedAdmin?.account"></span>
                    </h3>
                </div>
                <div class="p-6 bg-gray-50 flex-1 overflow-y-auto max-h-[80vh] space-y-4">
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 border-b border-gray-100 flex items-center justify-between font-bold text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-identification-card text-gray-400"></i> 一般</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-6 space-y-6">
                            <!-- 基本 -->
                            <div class="space-y-4">
                                <h4 class="text-sm font-bold border-l-4 border-gray-500 pl-2">基本</h4>
                                <div class="grid grid-cols-2 gap-4">
                                    <div><label class="text-xs font-bold text-gray-500">帳號</label><div class="mt-1 text-sm font-bold" x-text="selectedAdmin?.account"></div></div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-500">暱稱</label>
                                        <div x-show="!isEditMode" class="mt-1 text-sm font-bold" x-text="selectedAdmin?.nickname || '(無)'"></div>
                                        <input x-show="isEditMode" type="text" x-model="selectedAdmin.nickname" class="w-full mt-1 border border-gray-200 rounded-md p-2 bg-gray-50 outline-none focus:border-primary">
                                    </div>
                                </div>
                            </div>
                            <!-- 最後登入 - 顯示相對時間 -->
                            <div class="space-y-4">
                                <h4 class="text-sm font-bold border-l-4 border-gray-500 pl-2">最後登入</h4>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-xs font-bold text-gray-500">時間</label>
                                        <div class="mt-1 text-sm font-bold">
                                            <span x-text="selectedAdmin?.lastLoginTime || '(無)'"></span>
                                            <span class="text-gray-400 font-normal ml-1" x-text="selectedAdmin?.lastLoginRelative"></span>
                                        </div>
                                    </div>
                                    <div><label class="text-xs font-bold text-gray-500">IP</label><div class="mt-1 text-sm font-bold" x-text="'34.84.57.242 [Tokyo, JP]'"></div></div>
                                </div>
                            </div>
                            <!-- 設定 -->
                            <div class="space-y-4">
                                <h4 class="text-sm font-bold border-l-4 border-gray-500 pl-2">設定</h4>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-xs font-bold text-gray-500"><span class="text-red-500" x-show="isEditMode">*</span> 狀態</label>
                                        <div x-show="!isEditMode" class="mt-1"><span class="px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-600" x-text="selectedAdmin?.status"></span></div>
                                        <div x-show="isEditMode" class="mt-1">
                                            <select class="w-full border border-gray-200 rounded-md p-2 bg-gray-50 outline-none">
                                                <option>啟用</option>
                                                <option>停用</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-500">2FA 驗證</label>
                                        <div class="mt-1 flex items-center gap-2">
                                            <span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-500" x-text="selectedAdmin?.tfaStatus"></span>
                                            <div class="tooltip" :data-tip="selectedAdmin?.tfaEnforced ? '強制' : '未強制'">
                                                <i :class="selectedAdmin?.tfaEnforced ? 'ph-fill ph-lock-key text-blue-500' : 'ph ph-lock-key-open text-black'" class="text-lg"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 角色 -->
                            <div class="space-y-4">
                                <h4 class="text-sm font-bold border-l-4 border-gray-500 pl-2">角色</h4>
                                <div class="mt-1">
                                    <span class="px-2.5 py-1 rounded-md text-xs font-bold"
                                          :class="selectedAdmin?.role === 'ADMIN' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'"
                                          x-text="selectedAdmin?.role"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 其他 Section -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 border-b border-gray-100 flex items-center justify-between font-bold text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-note text-gray-400"></i> 其他</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-6">
                            <label class="text-xs font-bold text-gray-500">備註</label>
                            <div x-show="!isEditMode" class="mt-2 text-sm text-gray-400" x-text="selectedAdmin?.remark || '(無)'"></div>
                            <textarea x-show="isEditMode" rows="4" class="w-full mt-2 border border-gray-200 rounded-md p-3 bg-gray-50 outline-none"></textarea>
                        </div>
                    </div>
                </div>
                <!-- Footer Buttons -->
                <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-between items-center">
                    <div class="flex gap-3" x-show="!isEditMode">
                         <button @click="openResetPwdModal(selectedAdmin)" class="px-4 py-2 border border-blue-500 text-blue-500 rounded hover:bg-blue-50 font-bold text-sm">重置密碼</button>
                    </div>
                    <div class="flex-1 flex justify-end gap-3">
                        <button @click="isDetailModalOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-bold transition-colors">關閉</button>
                        <button x-show="!isEditMode" @click="openArchiveConfirm(selectedAdmin)" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 shadow-sm text-sm font-bold transition-colors">封存</button>
                        <button x-show="!isEditMode" @click="isEditMode = true" class="px-4 py-2 bg-amber-500 text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold transition-colors">編輯</button>
                        <button x-show="isEditMode" @click="isEditMode = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-bold transition-colors">取消</button>
                        <button x-show="isEditMode" @click="isEditMode = false; addToast('資料已儲存')" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600 shadow-sm text-sm font-bold transition-colors">確認</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Archive Confirm Modal (封存確認) -->
        <div x-show="isArchiveModalOpen" style="display: none;" class="fixed inset-0 z-[170] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-gray-100 rounded-xl shadow-xl w-[320px] overflow-hidden flex flex-col" @click.outside="isArchiveModalOpen = false">
                <div class="px-5 py-4 flex items-baseline gap-2">
                    <span class="text-lg font-bold">提示</span>
                    <span class="text-xs text-gray-400 font-mono" x-text="archiveTarget?.account"></span>
                </div>
                <div class="px-5 py-8 bg-white/50 border-y border-gray-200 text-center">
                    <p class="text-gray-800 font-bold" x-text="'【 ' + archiveTarget?.account + ' 】 確認封存？'"></p>
                </div>
                <div class="p-4 bg-gray-100 flex justify-end gap-3">
                    <button @click="isArchiveModalOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-bold transition-colors">關閉</button>
                    <button @click="isArchiveModalOpen = false; addToast('已封存')" class="px-6 py-2 bg-red-500 text-white rounded text-sm font-bold">確認</button>
                </div>
            </div>
        </div>

        <!-- Reset Password Modal (隨機密碼) -->
        <div x-show="isPwdModalOpen" style="display: none;" class="fixed inset-0 z-[180] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-gray-100 rounded-xl shadow-xl w-[380px] overflow-hidden flex flex-col" @click.outside="isPwdModalOpen = false">
                <div class="px-5 py-4 flex items-baseline gap-2">
                    <span class="text-lg font-bold">隨機密碼</span>
                    <span class="text-xs text-gray-400 font-mono" x-text="pwdTarget?.account"></span>
                </div>
                <div class="px-5 py-8 bg-white/50 border-y border-gray-200 flex items-center justify-center">
                    <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-lg px-4 py-3 w-full">
                        <span class="flex-1 font-mono text-gray-700" x-text="randomPwd"></span>
                        <button @click="navigator.clipboard.writeText(randomPwd); addToast('已複製到剪貼簿')" class="text-gray-400 hover:text-primary transition-colors">
                            <i class="ph ph-copy text-2xl"></i>
                        </button>
                    </div>
                </div>
                <div class="p-4 bg-gray-100 flex justify-end">
                    <button @click="isPwdModalOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-bold transition-colors">關閉</button>
                </div>
            </div>
        </div>

        <!-- 警示設定 Modal -->
        <div x-show="isAlertSettingOpen" style="display: none;" class="fixed inset-0 z-[300] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden flex flex-col" @click.outside="!isAlertEditing && (isAlertSettingOpen = false)">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
                    <h3 class="text-lg font-bold text-gray-800 flex items-baseline gap-2">
                        用戶列表 <span class="text-xs text-gray-400 font-medium">警示設定</span>
                    </h3>
                </div>
                <div class="p-6 space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-sm font-bold text-gray-700 w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-right" data-tip="登入連續失敗次數超過時發送警示通知">登入異常</label>
                        <template x-if="!isAlertEditing">
                            <div class="text-sm text-gray-800 font-mono px-1 min-h-[38px] flex items-center" x-text="alertSetting.loginFailCount"></div>
                        </template>
                        <template x-if="isAlertEditing">
                            <input type="number" x-model="tempAlertSetting.loginFailCount" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary">
                        </template>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-bold text-gray-700 w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-right" data-tip="同 IP 嘗試同帳號登入，發生後踢前時發送警示通知">相同 IP</label>
                        <template x-if="!isAlertEditing">
                            <div class="flex items-center min-h-[26px]">
                                <span class="px-2 py-0.5 rounded text-xs font-bold" :class="alertSetting.sameIp ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'" x-text="alertSetting.sameIp ? '啟用' : '停用'"></span>
                            </div>
                        </template>
                        <template x-if="isAlertEditing">
                            <div class="flex items-center gap-2">
                                <button type="button" @click="tempAlertSetting.sameIp = !tempAlertSetting.sameIp"
                                        class="w-9 h-5 rounded-full relative transition-colors duration-300 flex-shrink-0"
                                        :class="tempAlertSetting.sameIp ? 'bg-primary' : 'bg-gray-300'">
                                    <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow-sm transition-all duration-300"
                                          :class="tempAlertSetting.sameIp ? 'translate-x-4' : 'translate-x-0'"></span>
                                </button>
                                <span class="text-sm text-gray-700" x-text="tempAlertSetting.sameIp ? '啟用' : '停用'"></span>
                            </div>
                        </template>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-bold text-gray-700 w-fit border-b border-dotted border-gray-400 cursor-help tooltip tooltip-right" data-tip="同帳號當前登入IP與前一次登入 IP 不同時發送警示通知">不同 IP</label>
                        <template x-if="!isAlertEditing">
                            <div class="flex items-center min-h-[26px]">
                                <span class="px-2 py-0.5 rounded text-xs font-bold" :class="alertSetting.diffIp ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'" x-text="alertSetting.diffIp ? '啟用' : '停用'"></span>
                            </div>
                        </template>
                        <template x-if="isAlertEditing">
                            <div class="flex items-center gap-2">
                                <button type="button" @click="tempAlertSetting.diffIp = !tempAlertSetting.diffIp"
                                        class="w-9 h-5 rounded-full relative transition-colors duration-300 flex-shrink-0"
                                        :class="tempAlertSetting.diffIp ? 'bg-primary' : 'bg-gray-300'">
                                    <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow-sm transition-all duration-300"
                                          :class="tempAlertSetting.diffIp ? 'translate-x-4' : 'translate-x-0'"></span>
                                </button>
                                <span class="text-sm text-gray-700" x-text="tempAlertSetting.diffIp ? '啟用' : '停用'"></span>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                    <template x-if="!isAlertEditing">
                        <div class="flex gap-3">
                            <button @click="isAlertSettingOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">關閉</button>
                            <button @click="isAlertEditing = true; tempAlertSetting = { ...alertSetting }" class="px-6 py-2 bg-amber-500 text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold">編輯</button>
                        </div>
                    </template>
                    <template x-if="isAlertEditing">
                        <div class="flex gap-3">
                            <button @click="isAlertEditing = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">取消</button>
                            <button @click="saveAlertSetting()" class="px-6 py-2 bg-primary text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">儲存</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>

    </main>

    <script>
        window.PAGE_CONFIG = {
            title:  '用戶列表',
            parent: '用戶管理'
        };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>
    <script>
        function adminListPage() {
            return {
                search: { account: '', status: '', date: '' },
                admins: [],
                currentPage: 1,
                pageSize: 10,
                searchOpen: false,
                isMobile: window.innerWidth < 1024,
                isCreateModalOpen: false,
                isDetailModalOpen: false,
                isArchiveModalOpen: false,
                isPwdModalOpen: false,
                isEditMode: false,
                selectedAdmin: null,
                archiveTarget: null,
                pwdTarget: null,
                randomPwd: '',
                isAlertSettingOpen: false,
                isAlertEditing: false,
                alertSetting: { loginFailCount: 5, sameIp: true, diffIp: true },
                tempAlertSetting: { loginFailCount: 5, sameIp: true, diffIp: true },

                init() {
                    window.addEventListener('resize', () => { this.isMobile = window.innerWidth < 1024; });
                    this.loadMockData();
                    flatpickr(this.$refs.dateStart, { locale: 'zh-tw', dateFormat: "Y/m/d" });
                    flatpickr(this.$refs.dateEnd, { locale: 'zh-tw', dateFormat: "Y/m/d" });
                },
                loadMockData() {
                    const data = [
                        { account: 'agnes015', nickname: 'agnes015', status: '啟用', tfaStatus: '停用', tfaEnforced: true, lastLoginTime: '(無)', lastLoginRelative: '', role: 'ADMIN' },
                        { account: 'agnes014', nickname: 'Agnes014', status: '啟用', tfaStatus: '停用', tfaEnforced: false, lastLoginTime: '(無)', lastLoginRelative: '', role: 'ADMIN' },
                        { account: 'paul2', nickname: '(無)', status: '啟用', tfaStatus: '停用', tfaEnforced: true, lastLoginTime: '2026/02/12 15:32:06', lastLoginRelative: '- 17 小時前', role: 'ADMIN' },
                        { account: 'paul1', nickname: 'paulCute', status: '啟用', tfaStatus: '停用', tfaEnforced: false, lastLoginTime: '2026/02/12 14:01:25', lastLoginRelative: '- 18 小時前', role: 'ADMIN' },
                        { account: 'agnes011', nickname: 'agnes011', status: '啟用', tfaStatus: '停用', tfaEnforced: true, lastLoginTime: '2026/02/12 14:20:49', lastLoginRelative: '- 18 小時前', role: 'ADMIN' },
                        { account: 'agnes010', nickname: 'agnes010', status: '啟用', tfaStatus: '停用', tfaEnforced: false, lastLoginTime: '2026/02/12 13:22:32', lastLoginRelative: '- 19 小時前', role: 'ADMIN' },
                        { account: 't26021105', nickname: 't26021105', status: '啟用', tfaStatus: '停用', tfaEnforced: false, lastLoginTime: '2026/02/11 14:38:09', lastLoginRelative: '- 1 天前', role: 'ADMIN' },
                        { account: 't26021104', nickname: 't26021104', status: '啟用', tfaStatus: '停用', tfaEnforced: false, lastLoginTime: '2026/02/11 14:12:34', lastLoginRelative: '- 1 天前', role: 'ADMIN' },
                        { account: 'test999', nickname: '測試員', status: '停用', tfaStatus: '停用', tfaEnforced: false, lastLoginTime: '2026/01/01 09:00:00', lastLoginRelative: '- 1 個月前', role: 'VIEWER' }
                    ];
                    // 擴充至 67 筆
                    for(let i=0; i<58; i++) { data.push({...data[0], account: 'user_' + i, tfaEnforced: i % 2 === 0}); }
                    this.admins = data;
                },
                get totalPages() { return Math.ceil(this.admins.length / this.pageSize); },
                get displayedAdmins() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.admins.slice(start, start + parseInt(this.pageSize));
                },
                searchData() { this.currentPage = 1; this.$dispatch('notify', '搜尋完成'); },
                openCreateModal() { this.isCreateModalOpen = true; },
                openDetailModal(admin) { this.selectedAdmin = { ...admin }; this.isEditMode = false; this.isDetailModalOpen = true; },
                openArchiveConfirm(admin) { this.archiveTarget = admin; this.isArchiveModalOpen = true; },
                openResetPwdModal(admin) {
                    this.pwdTarget = admin;
                    this.randomPwd = Math.random().toString(36).slice(-8) + Math.random().toString(36).slice(-8).toUpperCase();
                    this.isPwdModalOpen = true;
                },
                saveAlertSetting() {
                    this.alertSetting = { ...this.tempAlertSetting };
                    this.isAlertEditing = false;
                    this.$dispatch('notify', '更新成功');
                }
            }
        }
    </script>
</body>
</html>
