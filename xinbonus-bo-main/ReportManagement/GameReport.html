<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 遊戲報表</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' },
                        amber: { DEFAULT: '#f59e0b', hover: '#d97706' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="gameReportPage()">

        <div id="layout-header"></div>

        <div class="flex-1 overflow-auto relative h-full flex flex-col p-4 md:p-6">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <!-- Breadcrumb -->
                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">報表管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">遊戲報表</span>
                    </nav>
                    <div class="flex items-center gap-3">
                        <div class="relative" x-data="{ showTip: false }" @click.outside="showTip = false">
                            <button @click="showTip = !showTip" class="w-8 h-8 rounded-full bg-yellow-50 text-yellow-500 hover:bg-yellow-100 transition-colors flex items-center justify-center border border-yellow-200 shadow-sm tooltip tooltip-down" data-tip="說明"><i class="ph-fill ph-lightbulb text-lg"></i></button>
                            <div x-show="showTip" x-transition.opacity class="absolute right-0 top-full mt-2 w-80 p-4 bg-[#fffbeb] shadow-xl rounded-lg z-50 border border-[#fcd34d] text-gray-700"><div class="popover-arrow"></div><h4 class="font-bold text-amber-800 flex items-center gap-2 mb-2 border-b border-amber-200 pb-2"><i class="ph-fill ph-info"></i> 欄位說明</h4><ul class="text-xs space-y-2 list-disc pl-4 text-gray-600"><template x-for="note in currentNotes" :key="note"><li x-html="note"></li></template></ul></div>
                        </div>
                        <button @click="isAlertConfigOpen = true" class="w-8 h-8 rounded-full text-gray-500 hover:bg-gray-100 transition-colors flex items-center justify-center focus:outline-none tooltip tooltip-down" data-tip="設定">
                            <i class="ph ph-gear-six text-xl"></i>
                        </button>
                        <button @click="isAiSummaryOpen = true" class="w-8 h-8 rounded-full text-primary hover:bg-blue-50 transition-colors flex items-center justify-center focus:outline-none tooltip tooltip-down" data-tip="AI 摘要">
                            <i class="ph-fill ph-sparkle text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-1 border-b border-gray-200 px-4 pt-2 flex-shrink-0 overflow-x-auto no-scrollbar">
                    <template x-for="tab in tabs" :key="tab.id">
                        <button @click="switchTab(tab.id)"
                                class="px-8 py-2.5 text-sm font-bold border-b-2 transition-all flex items-center justify-center gap-2 whitespace-nowrap"
                                :class="currentTab === tab.id ? 'border-primary text-primary bg-white rounded-t-md shadow-sm' : 'border-transparent text-gray-400 hover:text-gray-600'">
                            <i :class="['ph text-lg', tab.icon]"></i>
                            <span x-text="tab.name"></span>
                        </button>
                    </template>
                </div>

                <!-- Search Mobile Trigger -->
                <div class="lg:hidden flex-shrink-0">
                    <div @click="searchOpen = true" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <!-- Search Container -->
                <div :class="{ 'fixed inset-0 z-[150] bg-white flex flex-col': isMobile && searchOpen, 'bg-white border border-gray-200 rounded-xl shadow-sm flex-shrink-0 lg:block p-5': !isMobile || !searchOpen, 'hidden': isMobile && !searchOpen }">

                    <div class="lg:hidden px-4 py-3 border-b border-gray-100 flex justify-between items-center mb-4 flex-shrink-0" x-show="isMobile">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800" x-text="'遊戲報表 - ' + (tabs.find(t => t.id === currentTab)?.name || '')"></span>
                            <span class="text-gray-400 font-normal text-sm">搜尋</span>
                        </div>
                        <button @click="searchOpen = false" class="text-gray-500 hover:text-gray-700 p-1"><i class="ph ph-x text-2xl"></i></button>
                    </div>

                    <!-- Basic Search Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 items-end px-4 lg:px-0 pt-6 lg:pt-0" :class="{'pb-24 overflow-y-auto h-[calc(100vh-140px)] block': isMobile}">
                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label">日期</label>
                            <div class="flex items-center">
                                <input x-ref="dateStart" type="text" class="floating-input rounded-r-none border-r-0 text-center bg-input-base focus:bg-white" placeholder="起">
                                <div class="px-1 border-y border-gray-200 bg-input-base h-[42px] flex items-center text-gray-400">~</div>
                                <input x-ref="dateEnd" type="text" class="floating-input rounded-l-none border-l-0 text-center bg-input-base focus:bg-white" placeholder="訖">
                            </div>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}" x-show="currentTab !== 'jackpot'">
                            <label class="floating-label">遊戲類型</label>
                            <select x-model="search.gameType" class="floating-input bg-input-base focus:bg-white">
                                <option value="">全部</option>
                                <option>電子</option>
                                <option>捕魚機</option>
                                <option>街機</option>
                                <option>棋牌</option>
                                <option>體育</option>
                                <option>視訊</option>
                                <option>彩票</option>
                            </select>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}" x-show="currentTab === 'overview' || currentTab === 'favorites'">
                            <label class="floating-label">遊戲名稱</label>
                            <input x-model="search.gameName" type="text" class="floating-input bg-input-base focus:bg-white" placeholder="輸入關鍵字">
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}" x-show="currentTab === 'overview'">
                            <label class="floating-label">遊戲商</label>
                            <select x-model="search.vendor" class="floating-input bg-input-base focus:bg-white">
                                <option value="">全部</option>
                                <option>PG Soft</option>
                                <option>Pragmatic Play</option>
                                <option>Evolution</option>
                                <option>Microgaming</option>
                                <option>NetEnt</option>
                            </select>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}" x-show="currentTab === 'ranking'">
                            <label class="floating-label">排行指標</label>
                            <select x-model="search.rankMetric" class="floating-input bg-input-base focus:bg-white">
                                <option value="betCount">押注量</option>
                                <option value="betAmount">押注額</option>
                                <option value="netWin">輸贏</option>
                                <option value="validBet">有效押注</option>
                            </select>
                        </div>

                        <!-- Advanced Search Items -->
                        <template x-if="(advancedSearch || isMobile) && currentTab === 'overview'">
                            <div class="contents">
                                <div class="floating-input-group" :class="{'mb-5': isMobile}">
                                    <label class="floating-label">押注額(最小)</label>
                                    <input x-model="search.betMin" type="number" class="floating-input bg-input-base focus:bg-white" placeholder="0">
                                </div>
                                <div class="floating-input-group" :class="{'mb-5': isMobile}">
                                    <label class="floating-label">押注額(最大)</label>
                                    <input x-model="search.betMax" type="number" class="floating-input bg-input-base focus:bg-white" placeholder="∞">
                                </div>
                                <div class="floating-input-group" :class="{'mb-5': isMobile}">
                                    <label class="floating-label">局數(最小)</label>
                                    <input x-model="search.roundsMin" type="number" class="floating-input bg-input-base focus:bg-white" placeholder="0">
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Bottom Action Row -->
                    <div class="flex items-center justify-end mt-4 px-4 lg:px-0 lg:flex-row flex-col-reverse gap-4 lg:gap-0" :class="{'fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100 z-[130]': isMobile}">
                        <button @click="advancedSearch = !advancedSearch" x-show="currentTab === 'overview'" class="text-sm text-gray-500 hover:text-primary items-center gap-1 hidden lg:flex font-medium transition-colors mr-auto">
                            <span x-text="advancedSearch ? '隱藏條件' : '進階'"></span>
                            <i class="ph" :class="advancedSearch ? 'ph-caret-up' : 'ph-caret-down'"></i>
                        </button>
                        <button @click="fetchData(); searchOpen = false" class="lg:w-10 lg:h-10 w-full h-11 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                            <span class="lg:hidden">搜尋</span>
                            <i class="ph ph-magnifying-glass text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-white border border-gray-200 shadow-sm rounded-xl overflow-hidden flex flex-col flex-1 min-h-0 relative">
                    <div x-show="isLoading" class="absolute inset-0 bg-white/80 z-50 flex items-center justify-center backdrop-blur-sm">
                        <div class="flex flex-col items-center gap-2"><i class="ph ph-spinner animate-spin text-3xl text-primary"></i><span class="text-sm font-medium text-gray-600">數據更新中...</span></div>
                    </div>

                    <!-- Summary Bar -->
                    <div class="bg-gray-50 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-between gap-5">
                        <div class="flex gap-8 items-center px-4 whitespace-nowrap overflow-x-auto no-scrollbar custom-scroll ml-auto">
                            <template x-for="metric in summaryMetrics" :key="metric.label">
                                <div class="flex flex-col text-right">
                                    <span class="text-xs text-gray-500" x-text="metric.label"></span>
                                    <span class="text-sm font-bold font-mono" :class="metric.color || 'text-gray-800'" x-text="metric.value"></span>
                                </div>
                            </template>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0 pr-2">
                            <button @click="openColumnModal()" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-bottom" data-tip="欄位顯示">
                                <i class="ph ph-columns text-lg"></i>
                            </button>
                            <button @click="notifyDownload()" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-down" data-tip="下載">
                                <i class="ph ph-download-simple text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="overflow-auto flex-1 relative custom-scroll">

                        <!-- Overview Tab Table -->
                        <table x-show="currentTab === 'overview'" class="w-full text-sm text-gray-600 whitespace-nowrap border-collapse min-w-max">
                            <thead class="bg-gray-50 text-xs text-gray-700 uppercase font-bold sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-left table-cell-nowrap sticky-left-0 bg-gray-50 min-w-[180px]">遊戲名稱</th>
                                    <th class="px-4 py-3 text-left table-cell-nowrap bg-gray-50" x-show="colStatus.gameType">遊戲類型</th>
                                    <th class="px-4 py-3 text-left table-cell-nowrap bg-gray-50" x-show="colStatus.vendor">遊戲商</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.rounds">局數</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.betCount">押注筆數</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.betAmount">押注總額</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.betMin">單筆最小</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.betMax">單筆最大</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.betAvg">單筆平均</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.validBet">有效押注</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.payout">派彩</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.netWin">輸贏</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.jpContri">JP 貢獻金</th>
                                    <th class="px-4 py-3 text-right table-cell-nowrap bg-gray-50" x-show="colStatus.jpPrize">JP 彩金</th>
                                    <th class="px-4 py-3 text-center table-cell-nowrap bg-gray-50" x-show="colStatus.buyFeature">購買特色</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="row in displayedData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 text-left sticky-left-0 bg-white font-medium text-blue-600 hover:underline cursor-pointer table-cell-nowrap min-w-[180px]" x-text="row.gameName"></td>
                                        <td class="px-4 py-3 text-left table-cell-nowrap" x-show="colStatus.gameType">
                                            <span class="px-2 py-0.5 rounded text-xs font-bold" :class="getTypeClass(row.gameType)" x-text="row.gameType"></span>
                                        </td>
                                        <td class="px-4 py-3 text-left table-cell-nowrap text-gray-700" x-text="row.vendor" x-show="colStatus.vendor"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono" x-text="row.rounds.toLocaleString()" x-show="colStatus.rounds"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono" x-text="row.betCount.toLocaleString()" x-show="colStatus.betCount"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono font-medium" x-text="'$' + row.betAmount.toLocaleString()" x-show="colStatus.betAmount"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono text-gray-500" x-text="'$' + row.betMin.toLocaleString()" x-show="colStatus.betMin"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono text-gray-500" x-text="'$' + row.betMax.toLocaleString()" x-show="colStatus.betMax"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono text-gray-500" x-text="'$' + row.betAvg.toLocaleString()" x-show="colStatus.betAvg"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono" x-text="'$' + row.validBet.toLocaleString()" x-show="colStatus.validBet"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono" x-text="'$' + row.payout.toLocaleString()" x-show="colStatus.payout"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono font-bold" :class="row.netWin >= 0 ? 'text-green-600' : 'text-red-500'" x-text="(row.netWin >= 0 ? '+$' : '-$') + Math.abs(row.netWin).toLocaleString()" x-show="colStatus.netWin"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono text-gray-500" x-text="'$' + row.jpContri.toLocaleString()" x-show="colStatus.jpContri"></td>
                                        <td class="px-4 py-3 text-right table-cell-nowrap font-mono text-amber-600 font-bold" x-text="row.jpPrize > 0 ? '$' + row.jpPrize.toLocaleString() : '—'" x-show="colStatus.jpPrize"></td>
                                        <td class="px-4 py-3 text-center table-cell-nowrap" x-show="colStatus.buyFeature">
                                            <span class="font-mono" x-text="row.buyFeature.toLocaleString()"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Ranking Tab Table -->
                        <table x-show="currentTab === 'ranking'" class="w-full text-sm text-gray-600 whitespace-nowrap border-collapse">
                            <thead class="bg-gray-50 text-xs text-gray-700 uppercase font-bold sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-center w-16 bg-gray-50">排名</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲名稱</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲類型</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲商</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-text="rankingMetricLabel"></th>
                                    <th class="px-4 py-3 text-right bg-gray-50">占比</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">趨勢</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="(row, idx) in rankingData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 text-center">
                                            <span class="w-7 h-7 rounded-full inline-flex items-center justify-center text-xs font-bold"
                                                  :class="idx === 0 ? 'bg-yellow-100 text-yellow-700' : idx === 1 ? 'bg-gray-200 text-gray-600' : idx === 2 ? 'bg-orange-100 text-orange-700' : 'text-gray-500 font-normal'"
                                                  x-text="idx + 1"></span>
                                        </td>
                                        <td class="px-4 py-3 text-left font-medium text-blue-600 hover:underline cursor-pointer" x-text="row.gameName"></td>
                                        <td class="px-4 py-3 text-left">
                                            <span class="px-2 py-0.5 rounded text-xs font-bold" :class="getTypeClass(row.gameType)" x-text="row.gameType"></span>
                                        </td>
                                        <td class="px-4 py-3 text-left text-gray-700" x-text="row.vendor"></td>
                                        <td class="px-4 py-3 text-right font-mono font-bold" x-text="formatMetric(row[search.rankMetric])"></td>
                                        <td class="px-4 py-3 text-right">
                                            <div class="flex items-center justify-end gap-2">
                                                <div class="h-2 rounded-full bg-primary/20 w-24 overflow-hidden">
                                                    <div class="h-full bg-primary rounded-full transition-all" :style="`width: ${row.pct}%`"></div>
                                                </div>
                                                <span class="text-xs text-gray-500 w-10 text-right" x-text="row.pct + '%'"></span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-right">
                                            <span class="text-xs font-bold flex items-center justify-end gap-1" :class="row.trend >= 0 ? 'text-green-600' : 'text-red-500'">
                                                <i class="ph text-base" :class="row.trend >= 0 ? 'ph-trend-up' : 'ph-trend-down'"></i>
                                                <span x-text="(row.trend >= 0 ? '+' : '') + row.trend + '%'"></span>
                                            </span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Favorites Tab Table -->
                        <table x-show="currentTab === 'favorites'" class="w-full text-sm text-gray-600 whitespace-nowrap border-collapse">
                            <thead class="bg-gray-50 text-xs text-gray-700 uppercase font-bold sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-center w-16 bg-gray-50">排名</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲名稱</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲類型</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲商</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">收藏玩家數</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">遊玩人次</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">局數</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">押注總額</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">平均押注</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="(row, idx) in favoritesData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 text-center">
                                            <span class="w-7 h-7 rounded-full inline-flex items-center justify-center text-xs font-bold"
                                                  :class="idx === 0 ? 'bg-yellow-100 text-yellow-700' : idx === 1 ? 'bg-gray-200 text-gray-600' : idx === 2 ? 'bg-orange-100 text-orange-700' : 'text-gray-500 font-normal'"
                                                  x-text="idx + 1"></span>
                                        </td>
                                        <td class="px-4 py-3 font-medium text-blue-600 hover:underline cursor-pointer" x-text="row.gameName"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-xs font-bold" :class="getTypeClass(row.gameType)" x-text="row.gameType"></span>
                                        </td>
                                        <td class="px-4 py-3 text-gray-700" x-text="row.vendor"></td>
                                        <td class="px-4 py-3 text-right font-mono font-bold text-rose-500" x-text="row.favCount.toLocaleString()">
                                            <i class="ph-fill ph-heart text-rose-400 ml-1 text-xs"></i>
                                        </td>
                                        <td class="px-4 py-3 text-right font-mono" x-text="row.playerCount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono" x-text="row.rounds.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono font-medium" x-text="'$' + row.betAmount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono text-gray-500" x-text="'$' + row.betAvg.toLocaleString()"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Jackpot Tab Table -->
                        <table x-show="currentTab === 'jackpot'" class="w-full text-sm text-gray-600 whitespace-nowrap border-collapse">
                            <thead class="bg-gray-50 text-xs text-gray-700 uppercase font-bold sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲名稱</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲類型</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">遊戲商</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">玩家暱稱</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">彩金類型</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">彩金金額</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">觸發押注</th>
                                    <th class="px-4 py-3 text-left bg-gray-50 min-w-[120px]">觸發時間</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="row in jackpotData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 font-medium text-blue-600 hover:underline cursor-pointer" x-text="row.gameName"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-xs font-bold" :class="getTypeClass(row.gameType)" x-text="row.gameType"></span>
                                        </td>
                                        <td class="px-4 py-3 text-gray-700" x-text="row.vendor"></td>
                                        <td class="px-4 py-3 text-blue-600 hover:underline cursor-pointer font-medium" x-text="row.player"></td>
                                        <td class="px-4 py-3">
                                            <span class="text-xs" :class="row.jpType === 'Grand' ? 'badge-grand' : row.jpType === 'Major' ? 'badge-major' : 'badge-mini'" x-text="row.jpType"></span>
                                        </td>
                                        <td class="px-4 py-3 text-right font-mono font-bold text-amber-600 text-base" x-text="'$' + row.amount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono text-gray-500" x-text="'$' + row.triggerBet.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-gray-500 font-mono text-xs min-w-[120px]">
                                            <span class="text-gray-700 font-medium" x-text="relativeTime(row.timestamp)"></span>
                                            <div x-text="row.time" class="text-[10px] text-gray-400 mt-0.5"></div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination (overview tab only) -->
                    <div x-show="currentTab === 'overview'" class="p-4 border-t border-gray-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2 bg-white flex-shrink-0 sticky bottom-0 z-20">
                        <div class="flex items-center gap-2 order-1">
                            <div class="flex items-center gap-2 text-gray-400 mr-2">
                                <button @click="changePage(1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                                <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                            </div>
                            <div class="flex items-center gap-1">
                                <template x-for="p in pagesArray" :key="p">
                                    <button @click="changePage(p)" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors"
                                            :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                                </template>
                            </div>
                            <div class="flex items-center gap-2 text-gray-400 ml-2">
                                <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                                <button @click="changePage(totalPages)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2 md:mb-0 md:pl-4 md:border-l border-gray-200 order-2">
                            <span>每頁筆數：</span>
                            <select x-model="pageSize" @change="currentPage = 1" class="border border-gray-300 rounded px-2 py-1 outline-none text-gray-700 bg-white hover:border-gray-400">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                            <span x-text="`${(currentPage - 1) * pageSize + 1} - ${Math.min(currentPage * pageSize, tableData.length)} 共 ${tableData.length}`"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column Selector Modal -->
        <div x-show="isColumnModalOpen" style="display: none;" class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="isColumnModalOpen = false">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
                    <h3 class="text-lg font-bold text-gray-800">選擇顯示欄位</h3>
                    <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" class="checkbox-item rounded" :checked="isAllChecked()" :indeterminate.prop="isAllIndeterminate()" @change="toggleAll()">
                        全選 (<span x-text="selectedColCount()"></span>/<span x-text="totalColCount"></span>)
                    </label>
                </div>
                <div class="p-6 overflow-y-auto custom-scroll space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <template x-for="(col, key) in tempColStatus" :key="key">
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 rounded p-2 transition-colors">
                                <input type="checkbox" class="checkbox-item rounded" x-model="tempColStatus[key]">
                                <span class="text-sm text-gray-700" x-text="colLabels[key]"></span>
                            </label>
                        </template>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end gap-3 rounded-b-lg">
                    <button @click="isColumnModalOpen = false" class="px-6 py-2 bg-[#f1f5f9] text-[#475569] rounded hover:bg-[#e2e8f0] shadow-sm text-sm font-bold transition-colors">取消</button>
                    <button @click="confirmColumnModal()" class="px-6 py-2 bg-[#3b82f6] text-white rounded hover:bg-[#2563eb] shadow-sm text-sm font-bold transition-colors">確定</button>
                </div>
            </div>
        </div>

        <!-- Alert Config Modal -->
        <div x-show="isAlertConfigOpen" x-cloak class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="isAlertConfigOpen = false">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="ph-fill ph-gear-six text-primary"></i> 告警設定</h3>
                </div>
                <div class="p-6 overflow-y-auto custom-scroll flex-1 space-y-6">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="text-sm font-bold text-gray-700">告警參數</h4>
                            <button @click="addAlertRule()" class="text-xs text-primary hover:underline flex items-center gap-1"><i class="ph ph-plus"></i> 新增條件</button>
                        </div>
                        <div class="space-y-3">
                            <template x-for="(rule, idx) in alertConfig.rules" :key="idx">
                                <div class="flex flex-wrap items-center gap-2 p-3 bg-gray-50 rounded-lg border border-gray-100">
                                    <select x-model="rule.metric" class="floating-input h-10 text-sm flex-1 min-w-[140px]">
                                        <template x-for="m in alertMetricOptions" :key="m"><option :value="m" x-text="m"></option></template>
                                    </select>
                                    <select x-model="rule.operator" class="floating-input h-10 text-sm w-20">
                                        <option value=">">&gt;</option>
                                        <option value="<">&lt;</option>
                                        <option value=">=">&ge;</option>
                                        <option value="<=">&le;</option>
                                    </select>
                                    <input type="number" x-model="rule.value" class="floating-input h-10 text-sm w-28" placeholder="閾值">
                                    <button @click="alertConfig.rules.splice(idx, 1)" class="w-8 h-8 rounded-full hover:bg-red-50 text-red-400 hover:text-red-500 flex items-center justify-center flex-shrink-0"><i class="ph ph-trash"></i></button>
                                </div>
                            </template>
                            <div x-show="alertConfig.rules.length === 0" class="text-center text-xs text-gray-400 py-4">尚未設定告警參數</div>
                        </div>
                    </div>
                    <div class="floating-input-group">
                        <label class="floating-label">通知頻率</label>
                        <select x-model="alertConfig.frequency" class="floating-input bg-white">
                            <option value="realtime">即時</option>
                            <option value="hourly">每小時彙整</option>
                            <option value="daily">每日彙整</option>
                            <option value="weekly">每週彙整</option>
                        </select>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-700 mb-2">通知對象</h4>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="target in alertTargetOptions" :key="target">
                                <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50 select-none" :class="alertConfig.targets.includes(target) ? 'border-primary bg-blue-50' : 'border-gray-200'">
                                    <input type="checkbox" :value="target" x-model="alertConfig.targets" class="checkbox-item rounded">
                                    <span class="text-sm text-gray-700" x-text="target"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end gap-3 flex-shrink-0">
                    <button @click="isAlertConfigOpen = false" class="px-4 py-2 text-sm font-bold text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition-colors">取消</button>
                    <button @click="saveAlertConfig()" class="px-4 py-2 text-sm font-bold text-white bg-primary rounded hover:bg-blue-600 shadow-sm transition-colors">儲存</button>
                </div>
            </div>
        </div>

        <!-- AI Summary Modal -->
        <div x-show="isAiSummaryOpen" x-cloak class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden flex flex-col h-[70vh] max-h-[640px]" @click.outside="isAiSummaryOpen = false">
                <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-blue-50 to-transparent flex-shrink-0">
                    <h3 class="text-base font-bold text-gray-800 flex items-center gap-2"><i class="ph-fill ph-sparkle text-primary"></i> AI 摘要助手</h3>
                    <button @click="isAiSummaryOpen = false" class="text-gray-400 hover:text-gray-600 p-1 rounded transition-colors"><i class="ph ph-x text-xl"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4 bg-gray-50" x-ref="aiChatBody">
                    <template x-for="(msg, idx) in aiChatMessages" :key="idx">
                        <div class="flex" :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
                            <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed"
                                 :class="msg.role === 'user' ? 'bg-primary text-white rounded-br-sm' : 'bg-white border border-gray-200 text-gray-700 rounded-bl-sm shadow-sm'">
                                <div class="flex items-center gap-1.5 mb-1" x-show="msg.role === 'ai'"><i class="ph-fill ph-sparkle text-primary text-xs"></i><span class="text-xs font-bold text-primary">AI 助手</span></div>
                                <div x-html="msg.content"></div>
                            </div>
                        </div>
                    </template>
                    <div x-show="aiThinking" class="flex justify-start">
                        <div class="bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce" style="animation-delay:0ms"></span>
                            <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce" style="animation-delay:150ms"></span>
                            <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce" style="animation-delay:300ms"></span>
                        </div>
                    </div>
                </div>
                <div class="px-4 py-2 flex flex-wrap gap-2 border-t border-gray-100 flex-shrink-0" x-show="aiChatMessages.length <= 1">
                    <template x-for="q in aiSuggestedQuestions" :key="q">
                        <button @click="askAi(q)" class="px-3 py-1.5 text-xs bg-blue-50 text-primary rounded-full hover:bg-blue-100 transition-colors" x-text="q"></button>
                    </template>
                </div>
                <div class="p-3 border-t border-gray-100 flex gap-2 flex-shrink-0 bg-white">
                    <input type="text" x-model="aiInput" @keydown.enter="askAi()" placeholder="輸入你的問題…" class="floating-input flex-1 bg-gray-50 focus:bg-white">
                    <button @click="askAi()" class="w-10 h-10 flex-shrink-0 flex items-center justify-center bg-primary text-white rounded-lg hover:bg-blue-600 shadow-md active:scale-95 transition-all">
                        <i class="ph ph-paper-plane-tilt text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        window.PAGE_CONFIG = { title: '遊戲報表', parent: '報表管理' };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>
    <script>
        function gameReportPage() {
            return {
                isLoading: false,
                isColumnModalOpen: false,
                isMobile: window.innerWidth < 1024,
                searchOpen: false,
                advancedSearch: false,
                currentTab: 'overview',
                currentPage: 1,
                pageSize: 10,
                search: { gameType: '', gameName: '', vendor: '', rankMetric: 'betAmount', betMin: '', betMax: '', roundsMin: '' },

                isAlertConfigOpen: false,
                isAiSummaryOpen: false,
                alertConfig: { rules: [], frequency: 'daily', targets: [] },
                alertMetricOptions: ['押注總額', '有效押注', '輸贏', 'JP 彩金', '局數'],
                alertTargetOptions: ['系統管理員', '營運主管', 'Line 群組', 'Email 群組'],
                aiChatMessages: [{ role: 'ai', content: '您好，我是 AI 摘要助手，可以協助您分析目前頁籤的數據，或執行操作（例如切換頁籤、匯出報表）。請問需要什麼協助？' }],
                aiInput: '',
                aiThinking: false,
                aiSuggestedQuestions: ['幫我摘要目前頁籤的重點數據', '哪個遊戲的輸贏波動最大？', '幫我切換到排行榜頁籤'],

                tabs: [
                    { id: 'overview',   name: '押注概覽', icon: 'ph-chart-bar' },
                    { id: 'ranking',    name: '排行榜',   icon: 'ph-trophy' },
                    { id: 'favorites',  name: '最愛遊戲', icon: 'ph-heart' },
                    { id: 'jackpot',    name: '大獎紀錄', icon: 'ph-crown-simple' }
                ],

                colStatus: {
                    gameType: true, vendor: true, rounds: true, betCount: true,
                    betAmount: true, betMin: false, betMax: false, betAvg: true,
                    validBet: true, payout: true, netWin: true,
                    jpContri: false, jpPrize: true, buyFeature: false
                },
                tempColStatus: {},
                colLabels: {
                    gameType: '遊戲類型', vendor: '遊戲商', rounds: '局數', betCount: '押注筆數',
                    betAmount: '押注總額', betMin: '單筆最小', betMax: '單筆最大', betAvg: '單筆平均',
                    validBet: '有效押注', payout: '派彩', netWin: '輸贏',
                    jpContri: 'JP 貢獻金', jpPrize: 'JP 彩金', buyFeature: '購買特色'
                },
                totalColCount: 14,

                tableData: [],
                rankingData: [],
                favoritesData: [],
                jackpotData: [],

                get displayedData() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.tableData.slice(start, start + parseInt(this.pageSize));
                },
                get totalPages() { return Math.max(1, Math.ceil(this.tableData.length / this.pageSize)); },
                get pagesArray() {
                    return Array.from({ length: Math.min(this.totalPages, 5) }, (_, i) => i + 1);
                },
                get summaryMetrics() {
                    const d = this.tableData;
                    if (this.currentTab === 'overview') {
                        return [
                            { label: '遊戲數', value: d.length.toLocaleString() },
                            { label: '局數', value: d.reduce((s, r) => s + r.rounds, 0).toLocaleString() },
                            { label: '押注額', value: '$' + d.reduce((s, r) => s + r.betAmount, 0).toLocaleString() },
                            { label: '有效押注', value: '$' + d.reduce((s, r) => s + r.validBet, 0).toLocaleString() },
                            { label: '輸贏', value: (() => { const v = d.reduce((s, r) => s + r.netWin, 0); return (v >= 0 ? '+$' : '-$') + Math.abs(v).toLocaleString(); })(), color: (() => { const v = d.reduce((s, r) => s + r.netWin, 0); return v >= 0 ? 'text-green-600' : 'text-red-500'; })() },
                            { label: 'JP 彩金', value: '$' + d.reduce((s, r) => s + r.jpPrize, 0).toLocaleString(), color: 'text-amber-600' }
                        ];
                    }
                    if (this.currentTab === 'ranking') {
                        return [
                            { label: '參與遊戲數', value: this.rankingData.length.toLocaleString() },
                            { label: '統計指標', value: this.rankingMetricLabel }
                        ];
                    }
                    if (this.currentTab === 'favorites') {
                        return [
                            { label: '遊戲數', value: this.favoritesData.length.toLocaleString() },
                            { label: '收藏數', value: this.favoritesData.reduce((s, r) => s + r.favCount, 0).toLocaleString() }
                        ];
                    }
                    if (this.currentTab === 'jackpot') {
                        return [
                            { label: '大獎次數', value: this.jackpotData.length.toLocaleString() },
                            { label: '最大彩金', value: '$' + Math.max(...this.jackpotData.map(r => r.amount)).toLocaleString(), color: 'text-amber-600' },
                            { label: '彩金', value: '$' + this.jackpotData.reduce((s, r) => s + r.amount, 0).toLocaleString() }
                        ];
                    }
                    return [];
                },
                get rankingMetricLabel() {
                    const map = { betCount: '押注量', betAmount: '押注額', netWin: '輸贏', validBet: '有效押注' };
                    return map[this.search.rankMetric] || '押注額';
                },
                get currentNotes() {
                    if (this.currentTab === 'overview') return [
                        '單筆平均：押注總額 ÷ 押注筆數',
                        '有效押注：依各遊戲有效倍率計算之押注金額',
                        '輸贏：有效押注 - 派彩（負值代表玩家獲利）',
                        'JP 貢獻金：有效押注 × JP 貢獻比例',
                        'JP 彩金：該遊戲觸發之累積彩金金額'
                    ];
                    if (this.currentTab === 'ranking') return [
                        '排行指標：可切換為押注量 / 押注額 / 輸贏 / 有效押注',
                        '占比：該遊戲指標數值 ÷ 全部遊戲指標加總 × 100%',
                        '趨勢：與前一統計週期相比之增減百分比'
                    ];
                    if (this.currentTab === 'favorites') return [
                        '收藏玩家數：將該遊戲加入最愛的玩家人數',
                        '平均押注：押注總額 ÷ 局數'
                    ];
                    if (this.currentTab === 'jackpot') return [
                        '彩金類型：Grand / Major / Mini 三種等級',
                        '彩金金額：該次 JP 實際派發金額',
                        '觸發押注：觸發 JP 當下之押注金額'
                    ];
                    return [];
                },

                addAlertRule() { this.alertConfig.rules.push({ metric: this.alertMetricOptions[0], operator: '>', value: '' }); },
                saveAlertConfig() { this.isAlertConfigOpen = false; this.$dispatch('notify', '告警設定已儲存'); },
                askAi(preset) {
                    const q = (preset || this.aiInput).trim();
                    if (!q) return;
                    this.aiChatMessages.push({ role: 'user', content: q });
                    this.aiInput = '';
                    this.aiThinking = true;
                    this.$nextTick(() => { this.$refs.aiChatBody.scrollTop = this.$refs.aiChatBody.scrollHeight; });
                    setTimeout(() => {
                        this.aiThinking = false;
                        const tabName = this.tabs.find(t => t.id === this.currentTab)?.name || '';
                        this.aiChatMessages.push({ role: 'ai', content: `這是模擬回覆：根據目前「${tabName}」頁籤的資料進行分析...（Demo 用途，實際功能開發中）` });
                        this.$nextTick(() => { this.$refs.aiChatBody.scrollTop = this.$refs.aiChatBody.scrollHeight; });
                    }, 900);
                },

                switchTab(id) {
                    this.currentTab = id;
                    this.currentPage = 1;
                    this.fetchData();
                },

                fetchData() {
                    this.isLoading = true;
                    setTimeout(() => { this.isLoading = false; }, 600);
                },

                changePage(p) { if (p >= 1 && p <= this.totalPages) this.currentPage = p; },

                openColumnModal() { this.tempColStatus = { ...this.colStatus }; this.isColumnModalOpen = true; },
                confirmColumnModal() {
                    if (!Object.values(this.tempColStatus).some(v => v)) {
                        this.$dispatch('notify', { message: '至少選取 1 個項目' });
                        return;
                    }
                    this.colStatus = { ...this.tempColStatus };
                    this.isColumnModalOpen = false;
                },
                selectedColCount() { return Object.values(this.tempColStatus).filter(v => v).length; },
                isAllChecked() { return this.selectedColCount() === this.totalColCount; },
                isAllIndeterminate() { const c = this.selectedColCount(); return c > 0 && c < this.totalColCount; },
                toggleAll() { const c = this.isAllChecked(); Object.keys(this.tempColStatus).forEach(k => this.tempColStatus[k] = !c); },

                getTypeClass(type) {
                    const map = { '電子': 'bg-purple-100 text-purple-700', '捕魚機': 'bg-cyan-100 text-cyan-700', '街機': 'bg-orange-100 text-orange-700', '棋牌': 'bg-red-100 text-red-700', '體育': 'bg-green-100 text-green-700', '視訊': 'bg-blue-100 text-blue-700', '彩票': 'bg-yellow-100 text-yellow-700' };
                    return map[type] || 'bg-gray-100 text-gray-600';
                },

                relativeTime(ts) {
                    const diff = Date.now() - ts;
                    const m = Math.floor(diff / 60000);
                    const h = Math.floor(diff / 3600000);
                    const d = Math.floor(diff / 86400000);
                    if (m < 1)  return '剛剛';
                    if (m < 60) return m + ' 分鐘前';
                    if (h < 24) return h + ' 小時前';
                    if (d < 7)  return d + ' 天前';
                    return new Date(ts).toLocaleDateString('zh-TW');
                },

                formatMetric(v) {
                    if (this.search.rankMetric === 'betAmount' || this.search.rankMetric === 'netWin' || this.search.rankMetric === 'validBet') return '$' + Math.abs(v).toLocaleString();
                    return v.toLocaleString();
                },

                init() {
                    window.addEventListener('resize', () => { this.isMobile = window.innerWidth < 1024; });

                    flatpickr(this.$refs.dateStart,  { locale: 'zh_tw', dateFormat: 'Y-m-d', allowInput: true });
                    flatpickr(this.$refs.dateEnd,    { locale: 'zh_tw', dateFormat: 'Y-m-d', allowInput: true });

                    /* Mock Data */
                    const games = [
                        { name: '幸運財神', type: '電子', vendor: 'PG Soft' },
                        { name: '真人百家樂', type: '視訊', vendor: 'Evolution' },
                        { name: '海王星', type: '電子', vendor: 'Pragmatic Play' },
                        { name: '黃金傳說', type: '電子', vendor: 'Microgaming' },
                        { name: '嫦娥奔月', type: '電子', vendor: 'PG Soft' },
                        { name: '龍虎鬥', type: '視訊', vendor: 'Evolution' },
                        { name: '豬來了', type: '電子', vendor: 'Pragmatic Play' },
                        { name: '搖錢樹', type: '電子', vendor: 'PG Soft' },
                        { name: '火龍果', type: '電子', vendor: 'Microgaming' },
                        { name: '海底世界', type: '捕魚機', vendor: 'PG Soft' },
                        { name: '深海獵手', type: '捕魚機', vendor: 'Pragmatic Play' },
                        { name: '大富翁', type: '街機', vendor: 'NetEnt' },
                        { name: '德州撲克', type: '棋牌', vendor: 'Evolution' },
                        { name: '三張牌', type: '棋牌', vendor: 'Evolution' },
                        { name: '鬥地主', type: '棋牌', vendor: 'Microgaming' },
                        { name: '足球大戰', type: '體育', vendor: 'Pragmatic Play' },
                        { name: '籃球競猜', type: '體育', vendor: 'NetEnt' },
                        { name: '超級中大獎', type: '電子', vendor: 'Pragmatic Play' },
                        { name: '夢幻仙境', type: '電子', vendor: 'PG Soft' },
                        { name: '六合彩', type: '彩票', vendor: 'NetEnt' }
                    ];

                    this.tableData = games.map((g, i) => {
                        const rounds = Math.floor(Math.random() * 50000) + 5000;
                        const betCount = Math.floor(rounds * (Math.random() * 0.8 + 0.5));
                        const betAmount = Math.floor(betCount * (Math.random() * 400 + 100));
                        const validBet = Math.floor(betAmount * (Math.random() * 0.1 + 0.88));
                        const payout = Math.floor(validBet * (Math.random() * 0.15 + 0.80));
                        const hasJp = Math.random() > 0.6;
                        return {
                            id: i + 1, gameName: g.name, gameType: g.type, vendor: g.vendor,
                            rounds, betCount, betAmount,
                            betMin: Math.floor(Math.random() * 10) + 1,
                            betMax: Math.floor(Math.random() * 5000) + 1000,
                            betAvg: Math.floor(betAmount / betCount),
                            validBet, payout, netWin: validBet - payout,
                            jpContri: Math.floor(validBet * 0.02),
                            jpPrize: hasJp ? Math.floor(Math.random() * 500000) + 50000 : 0,
                            buyFeature: Math.floor(Math.random() * 200)
                        };
                    }).sort((a, b) => b.betAmount - a.betAmount);

                    this.rankingData = [...this.tableData].sort((a, b) => b[this.search.rankMetric] - a[this.search.rankMetric]).map((r, i) => {
                        const total = this.tableData.reduce((s, x) => s + x[this.search.rankMetric || 'betAmount'], 0);
                        return { ...r, pct: Math.round(r[this.search.rankMetric || 'betAmount'] / total * 100), trend: Math.floor(Math.random() * 40) - 10 };
                    });

                    this.favoritesData = [...this.tableData].map(r => ({
                        ...r, favCount: Math.floor(Math.random() * 3000) + 100, playerCount: Math.floor(Math.random() * 8000) + 500
                    })).sort((a, b) => b.favCount - a.favCount);

                    const jpTypes = ['Grand', 'Major', 'Mini'];
                    const players = ['dragon88', 'lucky_star', 'goldfish99', 'master_bet', 'vip_king', 'jackpot_pro', 'night_owl', 'high_roller'];
                    this.jackpotData = Array.from({ length: 25 }, (_, i) => {
                        const g = games[Math.floor(Math.random() * games.length)];
                        const jpType = jpTypes[Math.floor(Math.random() * jpTypes.length)];
                        const amounts = { Grand: () => Math.floor(Math.random() * 2000000) + 500000, Major: () => Math.floor(Math.random() * 200000) + 50000, Mini: () => Math.floor(Math.random() * 5000) + 500 };
                        const ts = Date.now() - (i * Math.floor(Math.random() * 180 + 30) + Math.floor(Math.random() * 60)) * 60000;
                        const d = new Date(ts);
                        return {
                            id: i + 1, gameName: g.name, gameType: g.type, vendor: g.vendor,
                            player: players[Math.floor(Math.random() * players.length)],
                            jpType, amount: amounts[jpType](),
                            triggerBet: Math.floor(Math.random() * 500) + 10,
                            timestamp: ts,
                            time: d.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
                        };
                    }).sort((a, b) => b.amount - a.amount);
                }
            };
        }
    </script>
