<!-- CTADestination.html | Version: 1.5.0 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - CTA 客端路由</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <!-- Modals -->
    <div x-data="modalData()" @open-cta-modal.window="openModal($event.detail)" @trigger-delete.window="triggerDelete($event.detail)">
        <!-- 刪除確認 -->
        <div x-show="showDeleteConfirm" style="display: none;" class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50" x-transition.opacity>
            <div class="bg-gray-100 rounded-xl shadow-xl w-[320px] overflow-hidden flex flex-col">
                <div class="px-5 py-4 flex items-baseline gap-2">
                    <span class="text-lg font-bold">提示</span>
                    <span class="text-xs text-gray-400 font-mono" x-text="deleteTargetName"></span>
                </div>
                <div class="px-5 py-8 bg-white/50 border-y border-gray-200 text-center">
                    <p class="text-gray-800 font-bold">【 <span x-text="deleteTargetName"></span> 】 確認刪除？</p>
                </div>
                <div class="p-4 bg-gray-100 flex justify-end gap-3">
                    <button @click="showDeleteConfirm = false" class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium">取消</button>
                    <button @click="confirmDelete()" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 shadow-sm text-sm font-medium">確認</button>
                </div>
            </div>
        </div>

        <!-- 新增/詳細 彈窗 -->
        <div x-show="isOpen" style="display: none;" class="fixed inset-0 z-[250] flex items-center justify-center bg-black/30 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-2xl w-full max-w-3xl mx-4 overflow-hidden flex flex-col max-h-[92vh]" @click.outside="!showDeleteConfirm && (isOpen = false)">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-white flex-shrink-0">
                    <div class="flex items-center gap-3">
                        <h3 class="text-lg font-bold text-gray-800">CTA 客端路由</h3>
                        <span class="text-sm text-gray-400 font-bold" x-text="isAdd ? '新增' : form.name"></span>
                    </div>
                </div>

                <div class="overflow-y-auto custom-scroll flex-1 p-6 bg-gray-50 space-y-4">
                    <!-- 基本卡片 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white border-b border-gray-100 flex items-center justify-between font-bold text-gray-800 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-identification-card text-gray-500"></i> 基本</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-5 grid grid-cols-2 gap-5">
                            <div class="floating-input-group">
                                <label class="floating-label">排序</label>
                                <input type="number" class="floating-input" x-model="form.sort" :readonly="!isAdd && !isEditing">
                            </div>
                            <div class="floating-input-group">
                                <label class="floating-label">Key</label>
                                <input type="text" class="floating-input" x-model="form.key" :readonly="!isAdd && !isEditing">
                            </div>
                            <div class="floating-input-group col-span-2">
                                <label class="floating-label">名稱</label>
                                <input type="text" class="floating-input" x-model="form.name" :readonly="!isAdd && !isEditing">
                            </div>
                            <div class="floating-input-group">
                                <label class="floating-label">狀態</label>
                                <select class="floating-input bg-input-base" x-model="form.status" :disabled="!isAdd && !isEditing">
                                    <option value="啟用">啟用</option><option value="維護">維護</option><option value="下架">下架</option>
                                </select>
                            </div>
                            <div class="floating-input-group">
                                <label class="floating-label">對象</label>
                                <div class="flex flex-wrap gap-2 p-2 border border-gray-200 rounded bg-gray-50 min-h-[42px] items-center">
                                    <template x-for="t in (form.target || [])" :key="t">
                                        <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-bold" x-text="t"></span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 設定卡片 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white border-b border-gray-100 flex items-center justify-between font-bold text-gray-800 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-gear text-gray-500"></i> 設定</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-5 grid grid-cols-2 gap-5">
                            <div class="floating-input-group">
                                <label class="floating-label">功能</label>
                                <select class="floating-input bg-input-base" x-model="form.function" :disabled="!isAdd && !isEditing">
                                    <option>跑馬燈公告</option><option>優惠活動</option><option>儲值優惠</option>
                                </select>
                            </div>
                            <div class="floating-input-group">
                                <label class="floating-label">類型</label>
                                <select class="floating-input bg-input-base" x-model="form.type" :disabled="!isAdd && !isEditing">
                                    <option>未分類</option><option>遊戲</option><option>儲值活動</option>
                                </select>
                            </div>
                            <div class="floating-input-group col-span-2">
                                <label class="floating-label">路由</label>
                                <input type="text" class="floating-input" x-model="form.route" :readonly="!isAdd && !isEditing">
                            </div>
                            <div class="floating-input-group">
                                <label class="floating-label">跳轉</label>
                                <select class="floating-input bg-input-base" x-model="form.jump" :disabled="!isAdd && !isEditing">
                                    <option>內部</option><option>指定</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-4 pl-1">
                                <span class="text-sm font-bold text-gray-500">開啟</span>
                                <button @click="if(isAdd || isEditing) form.open = !form.open" class="text-2xl" :class="form.open ? 'text-primary' : 'text-gray-300'">
                                    <i class="ph-fill" :class="form.open ? 'ph-toggle-right' : 'ph-toggle-left'"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 其他卡片 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white border-b border-gray-100 flex items-center justify-between font-bold text-gray-800 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-chat-centered-text text-gray-500"></i> 其他</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-5">
                            <div class="floating-input-group">
                                <label class="floating-label">備註</label>
                                <textarea class="w-full border border-gray-200 rounded-lg p-3 text-sm outline-none bg-input-base" rows="3" x-model="form.remark" :readonly="!isAdd && !isEditing"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 border-t border-gray-200 bg-[#e2e8f0] flex justify-end gap-3 flex-shrink-0">
                    <button @click="isOpen = false" class="px-6 py-2 bg-[#94a3b8] text-white rounded hover:bg-slate-500 shadow-sm text-sm font-bold transition-colors">關閉</button>

                    <template x-if="!isAdd && !isEditing">
                        <div class="flex gap-3">
                            <button @click="triggerImport()" class="px-6 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 shadow-sm text-sm font-bold">匯入</button>
                            <button @click="notifyExport()" class="px-6 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 shadow-sm text-sm font-bold">匯出</button>
                            <button @click="triggerDelete(form)" class="px-6 py-2 bg-[#ef4444] text-white rounded hover:bg-red-600 shadow-sm text-sm font-bold">刪除</button>
                            <button @click="isEditing = true" class="px-6 py-2 bg-[#f59e0b] text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold">編輯</button>
                        </div>
                    </template>

                    <template x-if="isAdd">
                        <button @click="handleSave()" class="px-6 py-2 bg-[#2088ea] text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">儲存</button>
                    </template>

                    <template x-if="!isAdd && isEditing">
                        <button @click="handleSave()" class="px-6 py-2 bg-[#2088ea] text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">更新</button>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full bg-[#f3f4f6]" x-data="ctaPage()">

        <div id="layout-header"></div>

        <!-- 列表主內容 -->
        <div class="flex-1 overflow-auto relative h-full flex flex-col p-4 md:p-6">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">客端管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">CTA 客端路由</span>
                    </nav>
                    <div class="flex items-center gap-2">
                        <!-- 說明 -->
                        <div class="relative group" x-data="{ showHelp: false }">
                            <button @click="showHelp = !showHelp" class="w-8 h-8 rounded-full bg-yellow-400 text-white hover:bg-yellow-500 flex items-center justify-center shadow-sm transition-all active:scale-95"><i class="ph-fill ph-lightbulb text-lg"></i></button>
                            <span class="btn-tip">說明</span>
                            <div x-show="showHelp" @click.outside="showHelp = false" class="absolute right-0 top-full mt-2 w-80 p-4 bg-[#fff9db] shadow-xl rounded-lg z-[120] border border-yellow-200 text-xs text-yellow-900" x-cloak>
                                <ul class="list-disc pl-4 space-y-2">
                                    <li>[客端] CTA 按鈕：[後台] 設定需確認 [前台] 設定 Key 對應使用狀態</li>
                                </ul>
                            </div>
                        </div>
                        <!-- 預覽 -->
                        <div class="relative group">
                            <button @click="window.open('https://h5.xinbonus.com.tw/zh-TW', '_blank')" class="w-8 h-8 rounded-full bg-indigo-500 text-white hover:bg-indigo-600 flex items-center justify-center shadow-sm transition-colors active:scale-95"><i class="ph-bold ph-eye text-lg"></i></button>
                            <span class="btn-tip">預覽</span>
                        </div>
                        <!-- 資料交換 -->
                        <div class="relative group" x-data="{ syncDropdown: false }">
                            <button @click="syncDropdown = !syncDropdown" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center border border-gray-200 shadow-sm transition-colors active:scale-95"><i class="ph-bold ph-arrows-clockwise text-lg"></i></button>
                            <span class="btn-tip">資料交換</span>
                            <div x-show="syncDropdown" @click.outside="syncDropdown = false" class="absolute right-0 mt-2 w-32 bg-white rounded-lg shadow-xl border border-gray-100 py-1 z-[150]" x-cloak>
                                <button @click="triggerImport(); syncDropdown = false" class="w-full text-left px-4 py-2.5 text-sm hover:bg-blue-50 text-gray-700">匯入</button>
                                <button @click="notifyExport(selectedIds); syncDropdown = false" class="w-full text-left px-4 py-2.5 text-sm hover:bg-blue-50 text-gray-700">匯出</button>
                            </div>
                        </div>
                        <!-- 新增 -->
                        <div class="relative group">
                            <button @click="$dispatch('open-cta-modal', { isAdd: true })" class="w-8 h-8 rounded-full bg-blue-500 text-white hover:bg-blue-600 flex items-center justify-center shadow-sm transition-colors active:scale-95"><i class="ph-bold ph-plus text-lg"></i></button>
                            <span class="btn-tip">新增</span>
                        </div>
                    </div>
                </div>

                <!-- 搜尋行動端觸發 -->
                <div class="lg:hidden flex-shrink-0">
                    <div @click="searchOpen = true" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <!-- 查詢條件容器 -->
                <div :class="{ 'fixed inset-0 z-[150] bg-white flex flex-col': isMobile && searchOpen, 'bg-white border border-gray-200 rounded-lg shadow-sm flex-shrink-0 lg:block p-5': !isMobile || !searchOpen, 'hidden': isMobile && !searchOpen }">

                    <div class="lg:hidden px-4 py-3 border-b border-gray-100 flex justify-between items-center mb-4 flex-shrink-0" x-show="isMobile">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800">CTA 客端路由</span>
                            <span class="text-gray-400 font-normal text-sm">搜尋</span>
                        </div>
                        <button @click="searchOpen = false" class="text-gray-500 hover:text-gray-700 p-1"><i class="ph ph-x text-2xl"></i></button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 px-4 lg:px-0" :class="{'overflow-y-auto flex-1 pt-4': isMobile}">
                        <div class="floating-input-group"><label class="floating-label">名稱</label><input type="text" class="floating-input"></div>
                        <div class="floating-input-group"><label class="floating-label">狀態</label><select class="floating-input bg-input-base appearance-none"><option value="">全部</option><option>啟用</option><option>維護</option><option>下架</option></select><i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i></div>
                        <div class="floating-input-group"><label class="floating-label">功能</label><select class="floating-input bg-input-base appearance-none"><option value="">全部</option><option>跑馬燈公告</option><option>VIP 階級</option></select><i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i></div>
                        <div class="floating-input-group"><label class="floating-label">跳轉</label><select class="floating-input bg-input-base appearance-none"><option value="">全部</option><option>內部</option><option>外部</option></select><i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i></div>

                        <!-- 進階欄位 -->
                        <template x-if="advancedSearch || isMobile">
                            <div class="contents">
                                <div class="floating-input-group"><label class="floating-label">對象</label><select class="floating-input bg-input-base appearance-none"><option value="">全部</option><option>訪客</option><option>會員</option></select><i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i></div>
                                <div class="floating-input-group"><label class="floating-label">類型</label><select class="floating-input bg-input-base appearance-none"><option value="">全部</option><option>內部</option><option>外部</option></select><i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i></div>
                                <div class="floating-input-group"><label class="floating-label">路由</label><input type="text" class="floating-input"></div>
                                <div class="floating-input-group"><label class="floating-label">開啟</label><select class="floating-input bg-input-base appearance-none"><option value="">全部</option><option>啟用</option><option>停用</option></select><i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i></div>
                            </div>
                        </template>
                    </div>

                    <div class="flex items-center justify-between" :class="isMobile ? 'flex-shrink-0 p-4 border-t border-gray-100' : 'mt-4 px-4 lg:px-0'">
                        <button @click="advancedSearch = !advancedSearch" class="text-sm text-gray-500 hover:text-primary items-center gap-1 hidden lg:flex font-bold transition-colors">
                            <span x-text="advancedSearch ? '隱藏條件' : '進階'"></span><i class="ph" :class="advancedSearch ? 'ph-caret-up' : 'ph-caret-down'"></i>
                        </button>
                        <button @click="searchOpen = false" class="lg:w-10 lg:h-10 w-full h-11 bg-primary text-white rounded-lg shadow flex items-center justify-center hover:bg-primary-hover transition-colors active:scale-95">
                            <span class="lg:hidden font-bold mr-2">搜尋</span><i class="ph-bold ph-magnifying-glass text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- 列表 -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm flex flex-col flex-1 min-h-0 relative overflow-hidden">
                    <div class="bg-gray-100 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-between px-6">
                        <div><span x-show="selectedIds.length > 0" class="text-sm font-bold text-primary" x-cloak>共 <span x-text="selectedIds.length"></span> 筆</span></div>
                        <div class="text-right flex flex-col"><span class="text-xs text-gray-500 font-bold uppercase">筆數</span><span class="text-sm font-bold text-gray-800" x-text="dataList.length"></span></div>
                    </div>

                    <div class="flex-1 overflow-auto custom-scroll relative z-0">
                        <table class="w-full text-left border-collapse min-w-[1500px]">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3 w-12 text-center"><input type="checkbox" class="checkbox-custom" @change="toggleAll()" :checked="selectedIds.length === dataList.length && dataList.length > 0"></th>
                                    <th class="px-4 py-3">名稱</th>
                                    <th class="px-4 py-3">狀態</th>
                                    <th class="px-4 py-3">對象</th>
                                    <th class="px-4 py-3">功能</th>
                                    <th class="px-4 py-3">類型</th>
                                    <th class="px-4 py-3">路由</th>
                                    <th class="px-4 py-3">跳轉</th>
                                    <th class="px-4 py-3 text-center">開啟</th>
                                    <th class="px-4 py-3">最後異動時間</th>
                                    <th class="px-4 py-3">操作者</th>
                                    <th class="px-4 py-3">備註</th>
                                    <th class="px-4 py-3 table-cell-nowrap bg-gray-50 text-center sticky right-0 z-20 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="row in pagedData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-6 text-center"><input type="checkbox" class="checkbox-custom" :value="row.id" x-model="selectedIds"></td>
                                        <td class="px-4 py-6"><div class="font-bold text-gray-800" x-text="row.name"></div><div class="text-[11px] text-gray-400 mt-1 font-mono" x-text="row.key"></div></td>
                                        <td class="px-4 py-6"><span class="px-2.5 py-0.5 rounded text-[11px] font-bold border" :class="statusColor(row.status)" x-text="row.status"></span></td>
                                        <td class="px-4 py-6"><div class="flex flex-wrap gap-1"><template x-for="t in row.target" :key="t"><span class="bg-gray-100 px-1.5 py-0.5 rounded text-[11px] font-medium" x-text="t"></span></template></div></td>
                                        <td class="px-4 py-6 text-blue-500 font-bold" x-text="row.function"></td>
                                        <td class="px-4 py-6"><span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[11px] font-bold" x-text="row.type"></span></td>
                                        <td class="px-4 py-6 font-mono text-[11px] text-gray-500 max-w-[150px] truncate" x-text="row.route"></td>
                                        <td class="px-4 py-6 text-gray-500" x-text="row.jump"></td>
                                        <td class="px-4 py-6 text-center"><i class="ph-bold ph-arrow-square-out text-lg text-gray-700"></i></td>
                                        <td class="px-4 py-6 text-xs text-gray-400" x-text="row.lastModified"></td>
                                        <td class="px-4 py-6"><div class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-yellow-100 flex items-center justify-center text-[10px] font-bold text-yellow-600" x-text="row.operator.charAt(0)"></div><span x-text="row.operator"></span></div></td>
                                        <td class="px-4 py-6 text-gray-400" x-text="row.remark"></td>
