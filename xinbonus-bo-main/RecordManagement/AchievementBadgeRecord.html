<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 成就徽章紀錄</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="achievementBadgeRecordPage()">

        <div id="layout-header"></div>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-4 md:p-6 flex flex-col">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <!-- Breadcrumb -->
                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">紀錄管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">成就徽章紀錄</span>
                    </nav>
                    <div class="flex items-center gap-3">
                        <div class="relative" x-data="{ showTip: false }" @click.outside="showTip = false">
                            <button @click="showTip = !showTip" class="w-8 h-8 rounded-full bg-yellow-50 text-yellow-500 hover:bg-yellow-100 transition-colors flex items-center justify-center border border-yellow-200 shadow-sm tooltip tooltip-down" data-tip="說明"><i class="ph-fill ph-lightbulb text-lg"></i></button>
                            <div x-show="showTip" x-transition.opacity class="absolute right-0 top-full mt-2 w-80 p-4 bg-[#fffbeb] shadow-xl rounded-lg z-50 border border-[#fcd34d] text-gray-700"><div class="popover-arrow"></div><ul class="text-xs space-y-2 list-disc pl-4 text-gray-600"><li>註冊：每日 00:00 更新</li><li>押注：每 10 秒更新</li><li>彩池：每 10 秒更新</li></ul></div>
                        </div>
                    </div>
                </div>

                <!-- Search Mobile Trigger -->
                <div class="lg:hidden flex-shrink-0">
                    <div @click="searchOpen = true" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <!-- Search Container -->
                <div :class="{ 'fixed inset-0 z-[150] bg-white flex flex-col': isMobile && searchOpen, 'bg-white border border-gray-200 rounded-lg shadow-sm flex-shrink-0 lg:block p-5': !isMobile || !searchOpen, 'hidden': isMobile && !searchOpen }">

                    <div class="lg:hidden px-4 py-3 border-b border-gray-100 flex justify-between items-center mb-4 flex-shrink-0" x-show="isMobile">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800">成就徽章紀錄</span>
                            <span class="text-gray-400 font-normal text-sm">搜尋</span>
                        </div>
                        <button @click="searchOpen = false" class="text-gray-500 hover:text-gray-700 p-1"><i class="ph ph-x text-2xl"></i></button>
                    </div>

                    <!-- Search Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 items-end content-start px-4 lg:px-0 pt-6 lg:pt-0" :class="{'pb-24 overflow-y-auto h-[calc(100vh-140px)] block content-start': isMobile}">

                        <!-- 暱稱 / 錢包帳號 -->
                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label z-10" x-text="query.targetType === 'nickname' ? '暱稱' : '錢包帳號'"></label>
                            <div class="flex relative">
                                <button @click="query.targetType = query.targetType === 'nickname' ? 'wallet' : 'nickname'" class="flex items-center justify-center w-12 bg-gray-50 border border-r-0 border-gray-200 rounded-l-lg hover:bg-gray-100 transition-colors flex-shrink-0">
                                    <i class="ph text-xl text-gray-500" :class="query.targetType === 'nickname' ? 'ph-smiley' : 'ph-wallet'"></i>
                                </button>
                                <input type="text" x-model="query.targetValue" class="floating-input rounded-l-none bg-input-base focus:bg-white">
                            </div>
                        </div>

                        <!-- VIP 階級（複選） -->
                        <div class="floating-input-group relative" :class="{'mb-5': isMobile}" x-data="{ open: false }" @click.outside="open = false">
                            <label class="floating-label z-10">VIP 階級</label>
                            <button type="button" @click="open = !open" class="floating-input bg-input-base focus:bg-white text-left flex items-center justify-between w-full">
                                <span class="text-gray-700 text-sm truncate" x-text="query.vip.length === 0 ? '全部' : '已選 ' + query.vip.length + ' 項'"></span>
                                <i class="ph ph-caret-down text-gray-400 text-xs flex-shrink-0 ml-2"></i>
                            </button>
                            <div x-show="open" x-cloak x-transition.opacity.duration.150ms class="absolute left-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-[110] w-full min-w-[140px] max-h-48 overflow-y-auto">
                                <div class="p-2 space-y-0.5">
                                    <template x-for="level in vipLevels" :key="level">
                                        <label class="flex items-center gap-2 px-2 py-1.5 hover:bg-gray-50 cursor-pointer rounded">
                                            <input type="checkbox" class="checkbox-item" :value="level" x-model="query.vip">
                                            <span class="text-sm text-gray-700" x-text="level"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- 達成徽章（複選，依分類分組） -->
                        <div class="floating-input-group relative" :class="{'mb-5': isMobile}" x-data="{ open: false }" @click.outside="open = false">
                            <label class="floating-label z-10">達成徽章</label>
                            <button type="button" @click="open = !open" class="floating-input bg-input-base focus:bg-white text-left flex items-center justify-between w-full">
                                <span class="text-gray-700 text-sm truncate" x-text="query.badgeSelections.length === 0 ? '全部' : '已選 ' + query.badgeSelections.length + ' 項'"></span>
                                <i class="ph ph-caret-down text-gray-400 text-xs flex-shrink-0 ml-2"></i>
                            </button>
                            <div x-show="open" x-cloak x-transition.opacity.duration.150ms class="absolute left-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-[110] w-full min-w-[200px] max-h-60 overflow-y-auto">
                                <template x-for="cat in badgeCategories" :key="cat.key">
                                    <div class="border-b border-gray-100 last:border-b-0">
                                        <div class="px-3 py-1.5 text-xs font-bold text-gray-400 bg-gray-50" x-text="cat.name"></div>
                                        <div class="p-1">
                                            <template x-for="badge in cat.badges" :key="cat.key + '_' + badge.condition">
                                                <label class="flex items-center gap-2 px-2 py-1.5 hover:bg-gray-50 cursor-pointer rounded">
                                                    <input type="checkbox" class="checkbox-item" :value="cat.key + '_' + badge.condition" x-model="query.badgeSelections">
                                                    <span class="text-sm text-gray-700" x-text="badge.condition.toLocaleString()"></span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- 達成時間（起訖） -->
                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label">達成時間</label>
                            <div class="hidden md:flex items-center">
                                <input x-ref="achieveStart" type="text" class="floating-input rounded-r-none border-r-0 text-center bg-input-base focus:bg-white text-gray-700 text-xs px-1">
                                <div class="px-2 py-2.5 text-gray-400 text-xs">~</div>
                                <input x-ref="achieveEnd" type="text" class="floating-input rounded-l-none border-l-0 text-center bg-input-base focus:bg-white text-gray-700 text-xs px-1">
                            </div>
                            <div class="flex flex-col md:hidden w-full">
                                <input x-ref="achieveStartMobile" type="text" class="floating-input rounded-b-none border-b-0 text-center bg-input-base focus:bg-white w-full">
                                <input x-ref="achieveEndMobile" type="text" class="floating-input rounded-t-none text-center bg-input-base focus:bg-white w-full">
                            </div>
                        </div>

                        <!-- Advanced Search Items -->
                        <template x-if="advancedSearch || isMobile">
                            <div class="contents">
                                <!-- 完成度（起訖） -->
                                <div class="floating-input-group" :class="{'mb-5': isMobile}">
                                    <label class="floating-label">完成度 (%)</label>
                                    <div class="flex items-center">
                                        <input type="number" x-model="query.completionMin" min="0" max="100" class="floating-input rounded-r-none border-r-0 text-center bg-input-base focus:bg-white" placeholder="起">
                                        <div class="px-1 border-y border-gray-200 bg-input-base h-[42px] flex items-center text-gray-400">~</div>
                                        <input type="number" x-model="query.completionMax" min="0" max="100" class="floating-input rounded-l-none border-l-0 text-center bg-input-base focus:bg-white" placeholder="訖">
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Bottom Action Row -->
                    <div class="flex items-center justify-between mt-4 px-4 lg:px-0 lg:flex-row flex-col-reverse gap-4 lg:gap-0" :class="{'fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100 z-[130]': isMobile}">
                        <button @click="advancedSearch = !advancedSearch" class="text-sm text-gray-500 hover:text-primary items-center gap-1 hidden lg:flex font-medium transition-colors">
                            <span x-text="advancedSearch ? '隱藏條件' : '進階'"></span>
                            <i class="ph" :class="advancedSearch ? 'ph-caret-up' : 'ph-caret-down'"></i>
                        </button>
                        <button @click="searchData(); searchOpen = false" class="lg:w-10 lg:h-10 w-full h-11 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                            <span class="lg:hidden">搜尋</span>
                            <i class="ph ph-magnifying-glass text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Data Table Container -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col flex-1 min-h-0 relative">

                    <!-- Summary Top Bar -->
                    <div class="bg-gray-50 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-between gap-5 text-gray-800">
                        <div class="flex gap-8 items-center px-4 whitespace-nowrap overflow-x-auto no-scrollbar custom-scroll ml-auto">
                            <div class="flex flex-col text-right">
                                <span class="text-xs text-gray-500">筆數</span>
                                <span class="text-sm font-bold text-gray-800" x-text="filteredList.length.toLocaleString()"></span>
                            </div>
                            <div class="flex flex-col text-right">
                                <span class="text-xs text-gray-500">人數</span>
                                <span class="text-sm font-bold text-gray-800" x-text="uniqueUsers.toLocaleString()"></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 pr-2 flex-shrink-0 z-[60]">
                            <button @click="openColumnModal()" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-down" data-tip="欄位顯示">
                                <i class="ph ph-columns text-lg"></i>
                            </button>
                            <button @click="notifyDownload()" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-down" data-tip="下載">
                                <i class="ph ph-download-simple text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex-1 overflow-auto custom-scroll relative z-0 h-full p-0">
                        <table class="w-full text-left border-collapse min-w-max">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-30 shadow-sm">
                                <tr>
                                    <!-- 單號 -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap">單號</th>
                                    <!-- 暱稱 frozen -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap sticky left-0 z-[31] shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]">暱稱</th>
                                    <!-- VIP 階級 -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap" x-show="colStatus.vip">
                                        <span class="text-dashed-tip tooltip tooltip-bottom" data-tip="紀錄當時階級">VIP 階級</span>
                                    </th>
                                    <!-- 達成徽章 -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap" x-show="colStatus.badge">
                                        <span class="text-dashed-tip tooltip tooltip-bottom" data-tip="達成條件 / 分類">達成徽章</span>
                                    </th>
                                    <!-- 完成度 -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap text-right" x-show="colStatus.completion">
                                        <span class="text-dashed-tip tooltip tooltip-bottom" data-tip="達成徽章時，當時該分類完成率">完成度</span>
                                    </th>
                                    <!-- 達成時間 -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap" x-show="colStatus.achievedTime">達成時間</th>
                                    <!-- 其他 -->
                                    <th class="px-4 py-3 bg-gray-50 text-center table-cell-nowrap" x-show="colStatus.related">其他</th>
                                    <!-- 操作 frozen right -->
                                    <th class="px-4 py-3 bg-gray-50 text-center table-cell-nowrap sticky right-0 z-[31] shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="row in pagedList" :key="row.id">
                                    <tr class="hover:bg-blue-50/50">
                                        <!-- 單號 -->
                                        <td class="px-4 py-3 table-cell-nowrap">
                                            <div class="flex items-center gap-2" x-data="{ copied: false }">
                                                <span class="font-mono text-gray-700 text-xs" x-text="row.id" :title="row.id"></span>
                                                <div class="relative">
                                                    <button @click="navigator.clipboard.writeText(row.id); copied = true; setTimeout(() => copied = false, 2000)" class="text-gray-400 hover:text-primary transition-colors focus:outline-none">
                                                        <i class="ph-bold ph-copy text-xs"></i>
                                                    </button>
                                                    <div x-show="copied" x-transition.opacity.duration.300ms class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 px-2 py-1 bg-gray-800 text-white text-xs rounded shadow-lg whitespace-nowrap z-50 pointer-events-none">
                                                        已複製
                                                        <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-gray-800"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <!-- 暱稱 frozen -->
                                        <td class="px-4 py-3 table-cell-nowrap text-blue-600 hover:underline cursor-pointer font-medium sticky left-0 bg-white shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]" x-text="row.nickname"></td>
                                        <!-- VIP 階級 -->
                                        <td class="px-4 py-3 table-cell-nowrap" x-show="colStatus.vip">
                                            <span class="bg-[#dbeafe] text-[#1e40af] px-2 py-0.5 rounded text-xs font-bold font-mono" x-text="row.vip"></span>
                                        </td>
                                        <!-- 達成徽章：主標題(達成條件) 副標題(分類) -->
                                        <td class="px-4 py-3 table-cell-nowrap" x-show="colStatus.badge">
                                            <div class="flex flex-col gap-0.5">
                                                <span class="font-bold text-gray-700 font-mono" x-text="row.badgeCondition.toLocaleString()"></span>
                                                <span class="text-[11px] text-gray-400" x-text="row.badgeCategoryName"></span>
                                            </div>
                                        </td>
                                        <!-- 完成度 -->
                                        <td class="px-4 py-3 table-cell-nowrap text-right" x-show="colStatus.completion">
                                            <div class="flex flex-col gap-0.5 items-end">
                                                <span class="font-bold font-mono" :class="row.completionRate >= 100 ? 'text-green-600' : 'text-amber-600'" x-text="row.completionRate + '%'"></span>
                                                <span class="text-[11px] text-gray-400 font-mono" x-text="row.completionFraction"></span>
                                            </div>
                                        </td>
                                        <!-- 達成時間 -->
                                        <td class="px-4 py-3 table-cell-nowrap text-gray-700" x-show="colStatus.achievedTime">
                                            <div class="font-mono text-xs" x-text="row.achievedTime"></div>
                                            <div class="text-xs text-gray-400 mt-0.5" x-text="row.achievedTimeRel"></div>
                                        </td>
                                        <!-- 其他：相關資訊 -->
                                        <td class="px-4 py-3 text-center table-cell-nowrap" x-show="colStatus.related">
                                            <div class="flex items-center justify-center gap-2 text-gray-500 text-lg">
                                                <div class="tooltip" data-tip="相關資訊">
                                                    <i @click="openRelatedBetModal(row)" class="ph-fill ph-file-text cursor-pointer hover:text-primary transition-colors"></i>
                                                </div>
                                            </div>
                                        </td>
                                        <!-- 操作 frozen right（僅 1 項，直接單一 icon） -->
                                        <td class="px-4 py-3 text-center table-cell-nowrap sticky right-0 bg-white shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">
                                            <button @click="openDetailModal(row)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip mx-auto" data-tip="檢視">
                                                <i class="ph ph-caret-right text-lg"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                                <!-- 查無資料 -->
                                <tr x-show="pagedList.length === 0">
                                    <td colspan="8" class="p-10 text-center text-gray-400">
                                        <i class="ph ph-file-search text-4xl mb-2 block"></i>
                                        <p>查無資料</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-4 border-t border-gray-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2 bg-white flex-shrink-0 sticky bottom-0 z-20">
                        <div class="flex items-center gap-2 order-1 md:order-1">
                            <div class="flex items-center gap-2 text-gray-400 mr-2">
                                <button @click="changePage(1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                                <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                            </div>
                            <div class="flex items-center gap-1">
                                <template x-for="p in totalPages" :key="p">
                                    <button @click="changePage(p)" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors" :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                                </template>
                            </div>
                            <div class="flex items-center gap-2 text-gray-400 ml-2">
                                <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                                <button @click="changePage(totalPages)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2 md:mb-0 md:pl-4 md:border-l border-gray-200 order-2 md:order-2">
                            <span>每頁筆數：</span>
                            <select x-model="pageSize" @change="currentPage = 1" class="border border-gray-300 rounded px-2 py-1 outline-none text-gray-700 bg-white hover:border-gray-400">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                            <span class="ml-2" x-text="`${(currentPage - 1) * parseInt(pageSize) + 1} - ${Math.min(currentPage * parseInt(pageSize), filteredList.length)} 共 ${filteredList.length}`"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail Modal -->
        <div x-show="isDetailModalOpen" style="display: none;" class="fixed inset-0 z-[160] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="!isRelatedBetModalOpen && !isBadgeMasterModalOpen && (isDetailModalOpen = false)">
                <div class="px-6 py-4 border-b border-gray-200 flex items-center gap-3 bg-gray-50 justify-start">
                    <h3 class="text-lg font-bold text-gray-800">成就徽章紀錄詳細</h3>
                    <span class="text-sm text-gray-400 font-mono" x-text="currentDetail?.id"></span>
                </div>

                <div class="p-6 overflow-y-auto custom-scroll bg-gray-50 space-y-4 flex-1">

                    <!-- 基本 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100">

                        { condition: 730,  key: 'JOIN_2Y', name: '資深玩家', status: 'inactive', sortInCat: 2, achievers: 0,    updateTime: '2026/01/20 12:05:00', remark: '加入滿2年' },
                        { condition: 1095, key: 'JOIN_3Y', name: '鑽石玩家', status: 'active',   sortInCat: 3, achievers: 2341, updateTime: '2026/04/01 08:00:00', remark: '加入滿3年' },
                        { condition: 1825, key: 'JOIN_5Y', name: '傳奇玩家', status: 'active',   sortInCat: 4, achievers: 631,  updateTime: '2026/04/01 08:10:00', remark: '加入滿5年' }
                    ] }
                ],

                query: {
                    targetType: 'nickname',
                    targetValue: '',
                    vip: [],
                    badgeSelections: [],
                    completionMin: '',
                    completionMax: ''
                },

                colStatus: {
                    vip: true,
                    badge: true,
                    completion: true,
                    achievedTime: true,
                    related: true
                },
                tempColStatus: {},
                columnGroups: {
                    basic: ['vip'],
                    detail: ['badge', 'completion', 'achievedTime'],
                    other: ['related']
                },
                get totalColCount() { return 5; },
                get selectedColCount() { return Object.values(this.tempColStatus).filter(v => v).length; },

                currentPage: 1,
                pageSize: 10,
                records: [],

                get filteredList() {
                    const achieveStart = this.$refs.achieveStart ? this.$refs.achieveStart.value : '';
                    const achieveEnd   = this.$refs.achieveEnd   ? this.$refs.achieveEnd.value   : '';
                    return this.records.filter(row => {
                        if (this.query.targetValue) {
                            if (this.query.targetType === 'nickname' && !row.nickname.includes(this.query.targetValue)) return false;
                            if (this.query.targetType === 'wallet' && !row.wallet.includes(this.query.targetValue)) return false;
                        }
                        if (this.query.vip.length > 0 && !this.query.vip.includes(row.vip)) return false;
                        if (this.query.badgeSelections.length > 0 && !this.query.badgeSelections.includes(row.badgeCategory + '_' + row.badgeCondition)) return false;
                        if (this.query.completionMin !== '' && row.completionRate < Number(this.query.completionMin)) return false;
                        if (this.query.completionMax !== '' && row.completionRate > Number(this.query.completionMax)) return false;
                        if (achieveStart && row.achievedTime < achieveStart.replace('T', ' ')) return false;
                        if (achieveEnd && row.achievedTime > achieveEnd.replace('T', ' ')) return false;
                        return true;
                    });
                },
                get totalPages() {
                    return Math.max(1, Math.ceil(this.filteredList.length / parseInt(this.pageSize)));
                },
                get pagedList() {
                    const s = (this.currentPage - 1) * parseInt(this.pageSize);
                    return this.filteredList.slice(s, s + parseInt(this.pageSize));
                },
                get uniqueUsers() {
                    return new Set(this.filteredList.map(r => r.nickname)).size;
                },

                isColGroupChecked(group) {
                    return this.columnGroups[group].every(k => this.tempColStatus[k]);
                },
                isColGroupIndeterminate(group) {
                    const checkedCount = this.columnGroups[group].filter(k => this.tempColStatus[k]).length;
                    return checkedCount > 0 && checkedCount < this.columnGroups[group].length;
                },
                toggleColGroup(group) {
                    const isChecked = this.isColGroupChecked(group);
                    this.columnGroups[group].forEach(k => this.tempColStatus[k] = !isChecked);
                },
                isAllColsChecked() {
                    return this.selectedColCount === this.totalColCount;
                },
                isAllColsIndeterminate() {
                    return this.selectedColCount > 0 && this.selectedColCount < this.totalColCount;
                },
                toggleAllCols() {
                    const isChecked = this.isAllColsChecked();
                    Object.keys(this.columnGroups).forEach(g => {
                        this.columnGroups[g].forEach(k => this.tempColStatus[k] = !isChecked);
                    });
                },
                openColumnModal() {
                    this.tempColStatus = { ...this.colStatus };
                    this.isColumnModalOpen = true;
                },
                confirmColumnModal() {
                    if (!Object.values(this.tempColStatus).some(v => v)) {
                        this.$dispatch('notify', { message: '至少選取 1 個項目' });
                        return;
                    }
                    this.colStatus = { ...this.tempColStatus };
                    this.isColumnModalOpen = false;
                },

                changePage(p) {
                    if (p >= 1 && p <= this.totalPages) this.currentPage = p;
                },
                openDetailModal(r) {
                    this.currentDetail = r;
                    this.isDetailModalOpen = true;
                },
                openRelatedBetModal(r) {
                    this.currentRelatedBet = r.relatedBet;
                    this.isRelatedBetModalOpen = true;
                },
                openBadgeMasterModal(r) {
                    this.currentBadgeMaster = {
                        name: r.badgeName,
                        key: r.badgeKey,
                        status: r.badgeStatus,
                        categoryName: r.badgeCategoryName,
                        sortInCat: r.badgeSortInCat,
                        condition: r.badgeCondition,
                        achievers: r.badgeAchievers,
                        updateTime: r.badgeUpdateTime,
                        remark: r.badgeMasterRemark
                    };
                    this.isBadgeMasterModalOpen = true;
                },
                searchData() {
                    this.currentPage = 1;
                    this.$dispatch('notify', '搜尋完成');
                },

                init() {
                    window.addEventListener('resize', () => { this.isMobile = window.innerWidth < 1024; });

                    // ── Mock Data ──────────────────────────────────────────────
                    const nicknames = ['天才小寶', '最強小乖乖', '天才寶寶', '星星王子', '月光仙子', '勝利達人', '快樂玩家', '金幣獵手'];
                    const wallets   = ['0xA1B2C3D4E5F6', '0xB2C3D4E5F6A1', '0xC3D4E5F6A1B2', '0xD4E5F6A1B2C3', '0xE5F6A1B2C3D4', '0xF6A1B2C3D4E5', '0xA7B8C9D0E1F2', '0xB8C9D0E1F2A7'];
                    const vipLevels = this.vipLevels;
                    const gameNames = ['幸運水果盤', '黃金礦工', '龍鳳呈祥', '財神到', '金牛座', '西遊爭霸', '麻將胡了', '捕魚達人'];
                    const days = ['05/01','05/03','05/05','05/07','05/08','05/09','05/10','05/12','05/13','05/14','05/15','05/16','05/17'];
                    const categories = this.badgeCategories;

                    for (let i = 0; i < 30; i++) {
                        const cat   = categories[i % categories.length];
                        const badge = cat.badges[i % cat.badges.length];
                        const nick  = nicknames[i % nicknames.length];

                        const day = days[i % days.length];
                        const hr  = String(8 + (i % 14)).padStart(2, '0');
                        const min = String((i * 7) % 60).padStart(2, '0');
                        const achievedTime    = `2026/${day} ${hr}:${min}:00`;
                        const achievedTimeRel = i < 5 ? `${i + 1} 小時前` : `${Math.floor(i / 5) + 1} 天前`;

                        const completionRate     = Math.min(100, ((i * 13) % 90) + 10);
                        const completionFraction = `${badge.sortInCat}/${cat.badges.length}`;

                        this.records.push({
                            id:               `ABR${20260517 - i}${String(i + 1).padStart(3, '0')}`,
                            nickname:         nick,
                            wallet:           wallets[i % wallets.length],
                            vip:              vipLevels[i % vipLevels.length],
                            badgeCategory:      cat.key,
                            badgeCategoryName:  cat.name,
                            badgeCondition:     badge.condition,
                            badgeKey:           badge.key,
                            badgeName:          badge.name,
                            badgeStatus:        badge.status,
                            badgeSortInCat:     badge.sortInCat,
                            badgeAchievers:     badge.achievers,
                            badgeUpdateTime:    badge.updateTime,
                            badgeMasterRemark:  badge.remark,
                            completionRate:     completionRate,
                            completionFraction: completionFraction,
                            achievedTime:      achievedTime,
                            achievedTimeRel:   achievedTimeRel,
                            relatedBet: {
                                id:        `BET${20260517 - i}${String(i + 1).padStart(3, '0')}`,
                                roundId:   `${5250000000000 + i}`,
                                gameName:  gameNames[i % gameNames.length],
                                betTime:   achievedTime,
                                betAmount: (i + 1) * 100,
                                validBet:  (i + 1) * 90,
                                win:       badge.condition % 1000,
                                odds:      (1 + (i % 20)) + 'x'
                            }
                        });
                    }

                    // ── Flatpickr ──────────────────────────────────────────────
                    const fpOpts = { dateFormat: 'Y/m/d H:i', enableTime: true, time_24hr: true, locale: 'zh-tw' };
                    flatpickr(this.$refs.achieveStart,       fpOpts);
                    flatpickr(this.$refs.achieveEnd,         fpOpts);
                    flatpickr(this.$refs.achieveStartMobile, fpOpts);
                    flatpickr(this.$refs.achieveEndMobile,   fpOpts);
                }
            };
        }
    </script>
