<!-- Version: 1.4.1 - VIP 階級紀錄 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - VIP 階級紀錄</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="vipRecordPage()">

        <div id="layout-header"></div>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-4 md:p-6 flex flex-col">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <!-- Breadcrumb -->
                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">紀錄管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">VIP 階級紀錄</span>
                    </nav>
                </div>

                <!-- Search Mobile Trigger -->
                <div class="lg:hidden flex-shrink-0">
                    <div @click="searchOpen = true" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <!-- Search Container -->
                <div :class="{ 'fixed inset-0 z-[150] bg-white flex flex-col': isMobile && searchOpen, 'bg-white border border-gray-200 rounded-lg shadow-sm flex-shrink-0 lg:block p-5': !isMobile || !searchOpen, 'hidden': isMobile && !searchOpen }">

                    <div class="lg:hidden px-4 py-3 border-b border-gray-100 flex justify-between items-center mb-4 flex-shrink-0" x-show="isMobile">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800">VIP 階級紀錄</span>
                            <span class="text-gray-400 font-normal text-sm">搜尋</span>
                        </div>
                        <button @click="searchOpen = false" class="text-gray-500 hover:text-gray-700 p-1"><i class="ph ph-x text-2xl"></i></button>
                    </div>

                    <!-- Basic Search Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 items-end px-4 lg:px-0 pt-6 lg:pt-0" :class="{'pb-24 overflow-y-auto h-[calc(100vh-140px)] block': isMobile}">
                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label z-10" x-text="search.targetType === 'nickname' ? '暱稱' : '錢包帳號'"></label>
                            <div class="flex relative">
                                <button @click="search.targetType = search.targetType === 'nickname' ? 'wallet' : 'nickname'" class="flex items-center justify-center w-12 bg-gray-50 border border-r-0 border-gray-200 rounded-l-lg hover:bg-gray-100 transition-colors">
                                    <i class="ph text-xl text-gray-500" :class="search.targetType === 'nickname' ? 'ph-smiley' : 'ph-wallet'"></i>
                                </button>
                                <input type="text" x-model="search.targetValue" class="floating-input rounded-l-none bg-input-base focus:bg-white text-gray-700">
                            </div>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label z-10">最後級別</label>
                            <div class="relative">
                                <select x-model="search.finalLevel" class="floating-input bg-input-base focus:bg-white appearance-none pr-8 text-gray-700 cursor-pointer">
                                    <option value=""></option>
                                    <option value="VIP 1">VIP 1</option>
                                    <option value="VIP 2">VIP 2</option>
                                    <option value="VIP 3">VIP 3</option>
                                    <option value="VIP 4">VIP 4</option>
                                    <option value="VIP 5">VIP 5</option>
                                    <option value="VIP 6">VIP 6</option>
                                    <option value="VIP 7">VIP 7</option>
                                    <option value="VIP 8">VIP 8</option>
                                    <option value="VIP 9">VIP 9</option>
                                    <option value="VIP 10">VIP 10</option>
                                </select>
                                <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                            </div>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label z-10">類型</label>
                            <div class="relative">
                                <select x-model="search.type" class="floating-input bg-input-base focus:bg-white appearance-none pr-8 text-gray-700 cursor-pointer">
                                    <option value=""></option>
                                    <option value="↑升階">↑升階</option>
                                    <option value="—保階">—保階</option>
                                    <option value="↓降階">↓降階</option>
                                </select>
                                <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                            </div>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label">執行時間</label>
                            <div class="hidden md:flex items-center relative">
                                <input x-ref="execStart" type="text" class="floating-input rounded-r-none border-r-0 text-center bg-input-base focus:bg-white text-gray-700 text-xs px-1">
                                <div class="px-2 py-2.5 text-gray-400 text-xs">~</div>
                                <input x-ref="execEnd" type="text" class="floating-input rounded-l-none border-l-0 text-center bg-input-base focus:bg-white text-gray-700 text-xs px-1">
                            </div>
                            <div class="flex flex-col md:hidden w-full">
                                <input x-ref="execStartMobile" type="text" class="floating-input rounded-b-none border-b-0 text-center bg-input-base focus:bg-white w-full">
                                <input x-ref="execEndMobile" type="text" class="floating-input rounded-t-none text-center bg-input-base focus:bg-white w-full">
                            </div>
                        </div>

                        <!-- Advanced Search Items -->
                        <template x-if="advancedSearch || isMobile">
                            <div class="contents">
                                <div class="floating-input-group" :class="{'mb-5': isMobile}">
                                    <label class="floating-label z-10 pointer-events-auto" for="input-settleLevel">
                                        <span class="tooltip tooltip-down border-b border-dashed border-gray-400 cursor-help pb-px" data-tip="訂單紀錄「當時」">結算級別</span>
                                    </label>
                                    <div class="relative h-[42px]">
                                        <select id="input-settleLevel" x-model="search.settleLevel" class="floating-input bg-input-base focus:bg-white appearance-none pr-8 h-full text-gray-700 cursor-pointer">
                                            <option value=""></option>
                                            <option value="VIP 1">VIP 1</option>
                                            <option value="VIP 2">VIP 2</option>
                                            <option value="VIP 3">VIP 3</option>
                                            <option value="VIP 4">VIP 4</option>
                                            <option value="VIP 5">VIP 5</option>
                                            <option value="VIP 6">VIP 6</option>
                                            <option value="VIP 7">VIP 7</option>
                                            <option value="VIP 8">VIP 8</option>
                                            <option value="VIP 9">VIP 9</option>
                                            <option value="VIP 10">VIP 10</option>
                                        </select>
                                        <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                                    </div>
                                </div>
                                <div class="floating-input-group" :class="{'mb-5': isMobile}">
                                    <label class="floating-label">會員期限</label>
                                    <div class="hidden md:flex items-center relative">
                                        <input x-ref="memberExpStart" type="text" class="floating-input rounded-r-none border-r-0 text-center bg-input-base focus:bg-white text-gray-700 text-xs px-1">
                                        <div class="px-2 py-2.5 text-gray-400 text-xs">~</div>
                                        <input x-ref="memberExpEnd" type="text" class="floating-input rounded-l-none border-l-0 text-center bg-input-base focus:bg-white text-gray-700 text-xs px-1">
                                    </div>
                                    <div class="flex flex-col md:hidden w-full">
                                        <input x-ref="memberExpStartMobile" type="text" class="floating-input rounded-b-none border-b-0 text-center bg-input-base focus:bg-white w-full">
                                        <input x-ref="memberExpEndMobile" type="text" class="floating-input rounded-t-none text-center bg-input-base focus:bg-white w-full">
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Bottom Action Row -->
                    <div class="flex items-center justify-between mt-4 px-4 lg:px-0"
                         :class="{'fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100 z-[130]': isMobile}">
                        <button @click="advancedSearch = !advancedSearch" class="text-sm text-gray-500 hover:text-primary items-center gap-1 hidden lg:flex font-medium transition-colors">
                            <span x-text="advancedSearch ? '隱藏條件' : '進階'"></span>
                            <i class="ph" :class="advancedSearch ? 'ph-caret-up' : 'ph-caret-down'"></i>
                        </button>
                        <button @click="searchData(); searchOpen = false" class="lg:w-10 lg:h-10 w-full h-11 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                            <span class="lg:hidden">搜尋</span>
                            <i class="ph ph-magnifying-glass text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Data Table Container -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col flex-1 min-h-0 relative">

                    <!-- Summary Top Bar -->
                    <div class="bg-gray-50 px-3 py-2.5 border-b border-gray-200 flex-shrink-0 flex items-center justify-between text-gray-800 rounded-t-lg">

                        <!-- Left: Sort Mode Toggle -->
                        <div class="flex items-center gap-1">
                            <button @click="sortMode = 'level'"
                                    class="w-8 h-8 rounded-full flex items-center justify-center transition-colors tooltip tooltip-bottom"
                                    :class="sortMode === 'level' ? 'bg-primary/10 text-primary' : 'hover:bg-gray-200 text-gray-400'"
                                    data-tip="依階級降冪排序">
                                <i class="ph ph-trend-up text-base"></i>
                            </button>
                            <button @click="sortMode = 'time'"
                                    class="w-8 h-8 rounded-full flex items-center justify-center transition-colors tooltip tooltip-bottom"
                                    :class="sortMode === 'time' ? 'bg-primary/10 text-primary' : 'hover:bg-gray-200 text-gray-400'"
                                    data-tip="依執行時間降冪排序">
                                <i class="ph ph-clock text-base"></i>
                            </button>
                        </div>

                        <!-- Right: Stats + Column Selector -->
                        <div class="flex items-center gap-3">
                            <div class="flex flex-col text-right">
                                <span class="text-xs text-gray-500">筆數</span>
                                <span class="text-sm font-bold text-gray-800" x-text="records.length"></span>
                            </div>
                            <div class="flex flex-col text-right pl-3 border-l border-gray-200">
                                <span class="text-xs text-gray-500">人數</span>
                                <span class="text-sm font-bold text-gray-800" x-text="uniquePersonCount"></span>
                            </div>
                            <!-- Column Visibility Selector -->
                            <div class="pl-3 border-l border-gray-200">
                                <button @click="openColumnModal()"
                                        class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-bottom"
                                        data-tip="選取顯示欄位">
                                    <i class="ph ph-columns text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Table Scroll Area -->
                    <div class="flex-1 overflow-auto custom-scroll relative z-0 h-full p-0">
                        <table class="w-full text-left border-collapse min-w-max">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-20 shadow-sm">
                                <tr>
                                    <!-- 單號 -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap" style="min-width:220px;max-width:220px;">單號</th>
                                    <!-- 暱稱: frozen left -->
                                    <th class="px-4 py-3 bg-gray-50 table-cell-nowrap sticky left-0 z-20 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]">暱稱</th>
                                    <!-- Conditional columns -->
                                    <th x-show="colStatus.settleLevel" class="px-4 py-3 bg-gray-50 table-cell-nowrap">結算級別</th>
                                    <th x-show="colStatus.finalLevel" class="px-4 py-3 bg-gray-50 table-cell-nowrap">最後級別</th>
                                    <th x-show="colStatus.type" class="px-4 py-3 bg-gray-50 table-cell-nowrap">類型</th>
                                    <th x-show="colStatus.execTime" class="px-4 py-3 bg-gray-50 table-cell-nowrap">執行時間</th>
                                    <th x-show="colStatus.memberExp" class="px-4 py-3 bg-gray-50 table-cell-nowrap">會員期限</th>
                                    <th x-show="colStatus.remarks" class="px-4 py-3 bg-gray-50 table-cell-nowrap w-64">備註</th>
                                    <!-- 操作: frozen right -->
                                    <th class="w-10 lg:w-24 px-1 py-3 bg-gray-50 text-center table-cell-nowrap sticky right-0 z-20 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="record in displayedRecords" :key="record.id">
                                    <tr class="hover:bg-blue-50/30">
                                        <!-- 單號 -->
                                        <td class="px-4 py-3 table-cell-nowrap" style="min-width:220px;max-width:220px;">
                                            <div class="flex items-center gap-2" x-data="{ copied: false }">
                                                <span class="font-mono text-gray-700" x-text="record.id.substring(0, 16) + '...'" :title="record.id"></span>
                                                <div class="relative">
                                                    <button @click="navigator.clipboard.writeText(record.id); copied = true; setTimeout(() => copied = false, 2000)" class="text-gray-400 hover:text-primary transition-colors focus:outline-none">
                                                        <i class="ph-bold ph-copy"></i>
                                                    </button>
                                                    <div x-show="copied" x-transition.opacity.duration.300ms class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 px-2 py-1 bg-gray-800 text-white text-xs rounded shadow-lg whitespace-nowrap z-50 pointer-events-none">
                                                        已複製
                                                        <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-gray-800"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <!-- 暱稱: frozen left -->
                                        <td class="px-4 py-3 table-cell-nowrap text-blue-600 hover:underline cursor-pointer font-medium sticky left-0 z-10 bg-white shadow-[2px_0_4px_-2px_rgba(0,0,0,0.08)]" x-text="record.nickname"></td>
                                        <!-- 結算級別 -->
                                        <td x-show="colStatus.settleLevel" class="px-4 py-3 table-cell-nowrap">
                                            <div class="flex items-center gap-1 font-bold text-gray-800">
                                                <i class="ph-fill ph-star text-sm" :class="getVipColor(record.settleLevel)"></i> <span x-text="record.settleLevel"></span>
                                            </div>
                                        </td>
                                        <!-- 最後級別 -->
                                        <td x-show="colStatus.finalLevel" class="px-4 py-3 table-cell-nowrap">
                                            <div class="flex items-center gap-1 font-bold text-gray-800">
                                                <i class="ph-fill ph-star text-sm" :class="getVipColor(record.finalLevel)"></i> <span x-text="record.finalLevel"></span>
                                            </div>
                                        </td>
                                        <!-- 類型 -->
                                        <td x-show="colStatus.type" class="px-4 py-3 table-cell-nowrap">
                                            <template x-if="record.type === '↑升階'">
                                                <span class="bg-[#dcfce7] text-[#166534] px-1.5 py-0.5 rounded text-xs font-bold whitespace-nowrap inline-flex items-center gap-1"><i class="ph-bold ph-arrow-up"></i> 升階</span>
                                            </template>
                                            <template x-if="record.type === '↓降階'">
                                                <span class="bg-[#fce7f3] text-[#be185d] px-1.5 py-0.5 rounded text-xs font-bold whitespace-nowrap inline-flex items-center gap-1"><i class="ph-bold ph-arrow-down"></i> 降階</span>
                                            </template>
                                            <template x-if="record.type === '—保階'">
                                                <span class="bg-[#fef3c7] text-[#b45309] px-1.5 py-0.5 rounded text-xs font-bold whitespace-nowrap inline-flex items-center gap-1"><i class="ph-bold ph-minus"></i> 保階</span>
                                            </template>
                                        </td>
                                        <!-- 執行時間 -->
                                        <td x-show="colStatus.execTime" class="px-4 py-3 table-cell-nowrap text-gray-700">
                                            <div class="font-mono" x-text="record.execTimeStr.split(' - ')[0]"></div>
                                            <div class="text-xs text-gray-400" x-text="'- ' + record.execTimeStr.split(' - ')[1]"></div>
                                        </td>
                                        <!-- 會員期限 -->
                                        <td x-show="colStatus.memberExp" class="px-4 py-3 table-cell-nowrap text-gray-700">
                                            <div class="font-mono" x-text="record.memberExpStr.split(' - ')[0]"></div>
                                            <div class="text-xs text-gray-400" x-text="'- ' + record.memberExpStr.split(' - ')[1]"></div>
                                        </td>
                                        <!-- 備註 -->
                                        <td x-show="colStatus.remarks" class="px-4 py-3 text-gray-700">
                                            <template x-if="record.remarks && record.remarks.length > 0">
                                                <ul class="list-disc list-inside space-y-0.5 text-xs">
                                                    <template x-for="rm in record.remarks" :key="rm">
                                                        <li x-text="rm"></li>
                                                    </template>
                                                </ul>
                                            </template>
                                            <template x-if="!record.remarks || record.remarks.length === 0">
                                                <span class="text-gray-400">(無)</span>
                                            </template>
                                        </td>
                                        <!-- 操作: frozen right -->
                                        <td class="w-10 lg:w-28 px-1 py-3 text-center table-cell-nowrap sticky right-0 bg-white z-10 shadow-[-2px_0_4px_-2px_rgba(0,0,0,0.08)]">
                                            <button @click="openDetailModal(record)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip mx-auto" data-tip="檢視">
                                                <i class="ph ph-caret-right text-lg"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-4 border-t border-gray-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2 bg-white flex-shrink-0 sticky bottom-0 z-20 rounded-b-lg">
                        <div class="flex items-center gap-2 order-1 md:order-1">
                             <div class="flex items-center gap-2 text-gray-400 mr-2">
                                <button @click="changePage(1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                                <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                             </div>
                             <div class="flex items-center gap-1">
                                <template x-for="p in totalPages" :key="p">
                                    <button @click="changePage(p)" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors" :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                                </template>
                             </div>
                             <div class="flex items-center gap-2 text-gray-400 ml-2">
                                <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                                <button @click="changePage(totalPages)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                             </div>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2 md:mb-0 md:pl-4 md:border-l border-gray-200 order-2 md:order-2">
                            <span>每頁筆數：</span>
                            <select x-model="pageSize" class="border border-gray-300 rounded px-2 py-1 outline-none text-gray-700 bg-white hover:border-gray-400">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                            <span class="ml-2" x-text="`${(currentPage - 1) * pageSize + 1} - ${Math.min(currentPage * pageSize, records.length)} 共 ${records.length}`"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail Modal -->
        <div x-show="isDetailModalOpen" style="display: none;" class="fixed inset-0 z-[160] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="isDetailModalOpen = false">
                <div class="px-6 py-4 border-b border-gray-200 flex items-center gap-3 bg-gray-50 justify-start">
                    <h3 class="text-lg font-bold text-gray-800">VIP 階級紀錄詳細</h3>
                    <span class="text-sm text-gray-400 font-mono" x-text="currentDetail?.id.substring(0, 12) + '...'"></span>
                </div>

                <div class="p-6 overflow-y-auto custom-scroll bg-gray-50 space-y-4 flex-1">

                    <!-- 基本 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100">
                            <div class="flex items-center gap-2 font-bold text-gray-800"><i class="ph-fill ph-user text-gray-500"></i> 基本</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" x-collapse class="p-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div class="md:col-span-2"><span class="text-gray-500 block text-xs mb-1">單號</span><span class="font-mono text-gray-800 break-all" x-text="currentDetail?.id"></span></div>
                                <div><span class="text-gray-500 block text-xs mb-1">暱稱</span><span class="text-blue-600 hover:underline cursor-pointer font-medium" x-text="currentDetail?.nickname"></span></div>
                                <div><span class="text-gray-500 block text-xs mb-1">執行時間</span><span class="text-gray-800 font-mono" x-text="currentDetail?.execTimeStr"></span></div>
                                <div><span class="text-gray-500 block text-xs mb-1">會員期限</span><span class="text-gray-800 font-mono" x-text="currentDetail?.memberExpStr"></span></div>
                            </div>
                        </div>
                    </div>

                    <!-- 歷程 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100">
                            <div class="flex items-center gap-2 font-bold text-gray-800"><i class="ph-fill ph-clock-counter-clockwise text-gray-500"></i> 歷程</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" x-collapse class="p-4">
                            <div class="grid grid-cols-2 gap-4 text-sm">
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">
                                        <span class="tooltip tooltip-down border-b border-dashed border-gray-400 cursor-help pb-px" data-tip="訂單紀錄「當時」">結算級別</span>
                                    </span>
                                    <div class="flex items-center gap-1 font-bold text-gray-800 mt-1">
                                        <i class="ph-fill ph-star text-sm" :class="getVipColor(currentDetail?.settleLevel)"></i> <span x-text="currentDetail?.settleLevel"></span>
                                    </div>
                                </div>
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">最後級別</span>
                                    <div class="flex items-center gap-1 font-bold text-gray-800 mt-1">
                                        <i class="ph-fill ph-star text-sm" :class="getVipColor(currentDetail?.finalLevel)"></i> <span x-text="currentDetail?.finalLevel"></span>
                                    </div>
                                </div>
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">類型</span>
                                    <div class="mt-1">
                                        <template x-if="currentDetail?.type === '↑升階'">
                                            <span class="bg-[#dcfce7] text-[#166534] px-1.5 py-0.5 rounded text-xs font-bold whitespace-nowrap inline-flex items-center gap-1"><i class="ph-bold ph-arrow-up"></i> 升階</span>
                                        </template>
                                        <template x-if="currentDetail?.type === '↓降階'">
                                            <span class="bg-[#fce7f3] text-[#be185d] px-1.5 py-0.5 rounded text-xs font-bold whitespace-nowrap inline-flex items-center gap-1"><i class="ph-bold ph-arrow-down"></i> 降階</span>
                                        </template>
                                        <template x-if="currentDetail?.type === '—保階'">
                                            <span class="bg-[#fef3c7] text-[#b45309] px-1.5 py-0.5 rounded text-xs font-bold whitespace-nowrap inline-flex items-center gap-1"><i class="ph-bold ph-minus"></i> 保階</span>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 其他 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100">
                            <div class="flex items-center gap-2 font-bold text-gray-800"><i class="ph-fill ph-dots-three-circle text-gray-500"></i> 其他</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" x-collapse class="p-4">
                            <div class="text-sm">
                                <span class="text-gray-500 block text-xs mb-1">備註</span>
                                <div class="text-gray-800 mt-1">
                                    <template x-if="currentDetail?.remarks && currentDetail?.remarks.length > 0">
                                        <ul class="list-disc list-inside space-y-1">
                                            <template x-for="rm in currentDetail?.remarks" :key="rm">
                                                <li x-text="rm"></li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template x-if="!currentDetail?.remarks || currentDetail?.remarks.length === 0">
                                        <span class="text-gray-400">(無)</span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="px-6 py-4 border-t border-gray-200 bg-white flex justify-end items-center rounded-b-lg flex-shrink-0">
                    <button @click="isDetailModalOpen = false" class="px-6 py-2 bg-[#9ca3af] text-white rounded hover:bg-[#6b7280] shadow-sm text-sm font-medium transition-colors">關閉</button>
                </div>
            </div>
        </div>

        <!-- Column Selection Modal -->
        <div x-show="isColumnModalOpen" style="display:none;"
             class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm"
             x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4 overflow-hidden flex flex-col max-h-[90vh]"
                 @click.outside="isColumnModalOpen = false">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
                    <h3 class="text-lg font-bold text-gray-800">選擇顯示欄位</h3>
                    <div class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-bold font-mono">
                        <span x-text="selectedColCount"></span> / <span x-text="totalColCount"></span>
                    </div>
                </div>
                <div class="p-6 overflow-y-auto custom-scroll space-y-4 bg-gray-50 flex-1">
                    <!-- 全選 -->
                    <div class="flex items-center gap-3 cursor-pointer select-none mb-2 w-fit" @click="toggleAllCols()">
                        <div class="w-5 h-5 rounded flex items-center justify-center transition-colors shadow-sm"
                             :class="{'bg-primary': isAllColsChecked() || isAllColsIndeterminate(), 'bg-white border-2 border-gray-300': !isAllColsChecked() && !isAllColsIndeterminate()}">
                            <i class="ph-bold text-white text-sm"
                               :class="{'ph-check': isAllColsChecked(), 'ph-minus': isAllColsIndeterminate(), 'hidden': !isAllColsChecked() && !isAllColsIndeterminate()}"></i>
                        </div>
                        <span class="font-bold text-gray-800">全選</span>
                    </div>
                    <!-- 歷程 -->
                    <div class="border border-gray-100 rounded-lg p-5 space-y-4 shadow-sm bg-white">
                        <div class="flex items-center gap-3 cursor-pointer select-none border-b border-gray-100 pb-3" @click="toggleColGroup('history')">
                            <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                 :class="{'bg-primary': isColGroupChecked('history') || isColGroupIndeterminate('history'), 'bg-white border-2 border-gray-300': !isColGroupChecked('history') && !isColGroupIndeterminate('history')}">
                                <i class="ph-bold text-white text-sm" :class="{'ph-check': isColGroupChecked('history'), 'ph-minus': isColGroupIndeterminate('history'), 'hidden': !isColGroupChecked('history') && !isColGroupIndeterminate('history')}"></i>
                            </div>
                            <span class="font-bold text-gray-800">歷程</span>
                        </div>
                        <div class="pl-2 grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-2">
                            <template x-for="item in [{key:'settleLevel',label:'結算級別'},{key:'finalLevel',label:'最後級別'},{key:'type',label:'類型'}]" :key="item.key">
                                <label class="flex items-center gap-2 cursor-pointer select-none">
                                    <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                         :class="tempColStatus[item.key] ? 'bg-primary' : 'bg-white border-2 border-gray-300'">
                                        <i class="ph-bold ph-check text-white text-sm" x-show="tempColStatus[item.key]"></i>
                                    </div>
                                    <input type="checkbox" x-model="tempColStatus[item.key]" class="hidden">
                                    <span class="text-sm text-gray-700" x-text="item.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- 基本 -->
                    <div class="border border-gray-100 rounded-lg p-5 space-y-4 shadow-sm bg-white">
                        <div class="flex items-center gap-3 cursor-pointer select-none border-b border-gray-100 pb-3" @click="toggleColGroup('basic')">
                            <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                 :class="{'bg-primary': isColGroupChecked('basic') || isColGroupIndeterminate('basic'), 'bg-white border-2 border-gray-300': !isColGroupChecked('basic') && !isColGroupIndeterminate('basic')}">
                                <i class="ph-bold text-white text-sm" :class="{'ph-check': isColGroupChecked('basic'), 'ph-minus': isColGroupIndeterminate('basic'), 'hidden': !isColGroupChecked('basic') && !isColGroupIndeterminate('basic')}"></i>
                            </div>
                            <span class="font-bold text-gray-800">基本</span>
                        </div>
                        <div class="pl-2 grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-2">
                            <template x-for="item in [{key:'execTime',label:'執行時間'},{key:'memberExp',label:'會員期限'}]" :key="item.key">
                                <label class="flex items-center gap-2 cursor-pointer select-none">
                                    <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                         :class="tempColStatus[item.key] ? 'bg-primary' : 'bg-white border-2 border-gray-300'">
                                        <i class="ph-bold ph-check text-white text-sm" x-show="tempColStatus[item.key]"></i>
                                    </div>
                                    <input type="checkbox" x-model="tempColStatus[item.key]" class="hidden">
                                    <span class="text-sm text-gray-700" x-text="item.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <!-- 其他 -->
                    <div class="border border-gray-100 rounded-lg p-5 space-y-4 shadow-sm bg-white">
                        <div class="flex items-center gap-3 cursor-pointer select-none border-b border-gray-100 pb-3" @click="toggleColGroup('other')">
                            <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                 :class="{'bg-primary': isColGroupChecked('other') || isColGroupIndeterminate('other'), 'bg-white border-2 border-gray-300': !isColGroupChecked('other') && !isColGroupIndeterminate('other')}">
                                <i class="ph-bold text-white text-sm" :class="{'ph-check': isColGroupChecked('other'), 'ph-minus': isColGroupIndeterminate('other'), 'hidden': !isColGroupChecked('other') && !isColGroupIndeterminate('other')}"></i>
                            </div>
                            <span class="font-bold text-gray-800">其他</span>
                        </div>
                        <div class="pl-2 grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-2">
                            <template x-for="item in [{key:'remarks',label:'備註'}]" :key="item.key">
                                <label class="flex items-center gap-2 cursor-pointer select-none">
                                    <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                         :class="tempColStatus[item.key] ? 'bg-primary' : 'bg-white border-2 border-gray-300'">
                                        <i class="ph-bold ph-check text-white text-sm" x-show="tempColStatus[item.key]"></i>
                                    </div>
                                    <input type="checkbox" x-model="tempColStatus[item.key]" class="hidden">
                                    <span class="text-sm text-gray-700" x-text="item.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end gap-3 rounded-b-lg">
                    <button @click="isColumnModalOpen = false" class="px-6 py-2 bg-[#f1f5f9] text-[#475569] rounded hover:bg-[#e2e8f0] shadow-sm text-sm font-bold transition-colors">取消</button>
                    <button @click="confirmColumnModal()" class="px-6 py-2 bg-[#3b82f6] text-white rounded hover:bg-[#2563eb] shadow-sm text-sm font-bold transition-colors">確定</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        window.PAGE_CONFIG = {
            title:  'VIP 階級紀錄',
            parent: '紀錄管理'
        };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>

    <script>
        function vipRecordPage() {
            return {
                isDetailModalOpen: false,
                isColumnModalOpen: false,
                isMobile: window.innerWidth < 1024,
                searchOpen: false,
                advancedSearch: false,
                currentDetail: null,
                sortMode: 'time',

                colStatus: {
                    settleLevel: true,
                    finalLevel: true,
                    type: true,
                    execTime: true,
                    memberExp: true,
                    remarks: true,
                },
                tempColStatus: {},
                columnGroups: {
                    history: ['settleLevel', 'finalLevel', 'type'],
                    basic:   ['execTime', 'memberExp'],
                    other:   ['remarks'],
                },

                get totalColCount()    { return 6; },
                get selectedColCount() { return Object.values(this.tempColStatus).filter(v => v).length; },

                isColGroupChecked(g)       { return this.columnGroups[g].every(k => this.tempColStatus[k]); },
                isColGroupIndeterminate(g) {
                    const n = this.columnGroups[g].filter(k => this.tempColStatus[k]).length;
                    return n > 0 && n < this.columnGroups[g].length;
                },
                toggleColGroup(g) {
                    const checked = this.isColGroupChecked(g);
                    this.columnGroups[g].forEach(k => this.tempColStatus[k] = !checked);
                },
                isAllColsChecked()       { return this.selectedColCount === this.totalColCount; },
                isAllColsIndeterminate() { return this.selectedColCount > 0 && this.selectedColCount < this.totalColCount; },
                toggleAllCols() {
                    const checked = this.isAllColsChecked();
                    Object.keys(this.columnGroups).forEach(g =>
                        this.columnGroups[g].forEach(k => this.tempColStatus[k] = !checked)
                    );
                },
                openColumnModal() {
                    this.tempColStatus = { ...this.colStatus };
                    this.isColumnModalOpen = true;
                },
                confirmColumnModal() {
                    if (!Object.values(this.tempColStatus).some(v => v)) {
                        this.$dispatch('notify', { message: '至少選取 1 個項目' });
                        return;
                    }
                    this.colStatus = { ...this.tempColStatus };
                    this.isColumnModalOpen = false;
                },

                search: {
                    targetType: 'nickname', targetValue: '', finalLevel: '', type: '',
                    execStart: '', execEnd: '', settleLevel: '', memberExpStart: '', memberExpEnd: ''
                },

                currentPage: 1,
                pageSize: 10,
                records: [],

                get totalPages() { return Math.ceil(this.records.length / this.pageSize) || 1; },

                get uniquePersonCount() {
                    return new Set(this.records.map(r => r.nickname)).size;
                },

                get sortedRecords() {
                    const arr = [...this.records];
                    if (this.sortMode === 'level') {
                        arr.sort((a, b) => {
                            const num = l => parseInt((l || '').replace('VIP ', '')) || 0;
                            return num(b.finalLevel) - num(a.finalLevel);
                        });
                    } else {
                        arr.sort((a, b) => b.execTimestamp - a.execTimestamp);
                    }
                    return arr;
                },

                get displayedRecords() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.sortedRecords.slice(start, start + parseInt(this.pageSize));
                },

                getVipColor(level) {
                    if (level === 'VIP 2') return 'text-blue-500';
                    if (level === 'VIP 3') return 'text-green-500';
                    if (level === 'VIP 4') return 'text-lime-600';
                    if (level === 'VIP 5') return 'text-purple-500';
                    return 'text-gray-500';
                },

                init() {
                    window.addEventListener('resize', () => { this.isMobile = window.innerWidth < 1024; });

                    const names = ['最強小乖乖', '天才寶寶', '無敵幸運星', '財神爺降臨', '大四喜', '發發發'];
                    const types = ['↑升階', '↓降階', '—保階'];
                    const levels = ['VIP 1', 'VIP 2', 'VIP 3', 'VIP 4', 'VIP 5', 'VIP 6', 'VIP 7', 'VIP 8', 'VIP 9', 'VIP 10'];
                    const now = Date.now();

                    for (let i = 0; i < 35; i++) {
                        let t = types[i % 3];
                        let settleIdx = i % 10;
                        let finalIdx = settleIdx;
                        if (t === '↑升階' && settleIdx < 9) finalIdx++;
                        if (t === '↓降階' && settleIdx > 0) finalIdx--;

                        this.records.push({
                            id: '68f06921e9fad121eccc' + (9000 + i).toString(),
                            nickname: names[i % names.length],
                            settleLevel: levels[settleIdx],
                            finalLevel: levels[finalIdx],
                            type: t,
                            execTimeStr: `2025/5/${(20 - (i%10)).toString().padStart(2,'0')} 00:32:21 - ${i%5 + 1} 小時前`,
                            memberExpStr: `2025/6/30 23:59:59 - 40 天後`,
                            execTimestamp: now - i * 3600000,
                            remarks: i % 4 === 0 ? ['資格：2 個月內累積儲值 5k ↑', '獎勵：代幣100'] : []
                        });
                    }

                    flatpickr(this.$refs.execStart, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.execEnd, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.memberExpStart, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.memberExpEnd, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.execStartMobile, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.execEndMobile, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.memberExpStartMobile, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.memberExpEndMobile, { dateFormat: "Y/m/d H:i", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                },
                changePage(page) { if (page >= 1 && page <= this.totalPages) this.currentPage = page; },
                openDetailModal(record) { this.currentDetail = record; this.isDetailModalOpen = true; },
                searchData() { this.currentPage = 1; this.$dispatch('notify', '搜尋完成'); }
            }
        }
    </script>
</body>
</html>
