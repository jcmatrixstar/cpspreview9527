<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交中心 - 互動原型 (極簡優化版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <!-- 手機外框模擬 -->
    <div class="w-full max-w-md h-[850px] max-h-screen bg-[#F8F9FA] text-[#1A1C1E] relative overflow-hidden shadow-2xl sm:rounded-[40px] sm:border-[8px] sm:border-gray-900 flex flex-col font-sans">
        
        <!-- 頂部導航與標題 -->
        <div class="bg-white px-5 pt-12 pb-0 shadow-sm z-20">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black text-gray-900 tracking-tight">社交中心</h1>
                <button class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>

            <!-- Tab 切換器 -->
            <div class="flex relative border-b border-gray-100">
                <button id="tab-friends" onclick="switchTab('friends')" class="flex-1 py-4 text-base font-bold transition-all relative z-10 text-blue-600">
                    好友列表 (3)
                </button>
                <button id="tab-blacklist" onclick="switchTab('blacklist')" class="flex-1 py-4 text-base font-bold transition-all relative z-10 text-gray-400">
                    黑名單 (1)
                </button>
                <!-- 滑動底線 -->
                <div id="tab-indicator" class="absolute bottom-0 h-1 bg-blue-600 transition-all duration-300 ease-out rounded-t-full left-0 w-1/2"></div>
            </div>
        </div>

        <!-- 搜尋列 -->
        <div class="p-4 bg-white/60">
            <div class="relative group">
                <div class="absolute left-4 top-4 text-gray-400 w-4 h-4">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <input type="text" placeholder="搜尋玩家暱稱..." class="w-full bg-white border border-gray-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm shadow-sm outline-none focus:ring-2 focus:ring-blue-100 placeholder:text-gray-400">
            </div>
        </div>

        <!-- 列表內容區 -->
        <div class="flex-1 overflow-y-auto px-4 pb-24">
            
            <!-- 好友列表 -->
            <div id="list-friends" class="space-y-4 pt-2 block">
                <!-- 玩家卡片 1 -->
                <div onclick="openCard('全場我最旺', '10', 'bg-orange-500')" class="flex items-center p-5 bg-white rounded-[28px] shadow-sm active:scale-[0.97] transition-all cursor-pointer border border-transparent hover:border-blue-50">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-md mr-4 bg-orange-500 font-bold text-xl">全</div>
                    <div class="flex-1 flex items-center">
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-bold text-gray-800">全場我最旺</span>
                            <div class="bg-gradient-to-r from-amber-400 to-orange-500 text-white text-[10px] px-2 py-0.5 rounded-md font-black italic shadow-sm">VIP10</div>
                        </div>
                    </div>
                    <div class="text-gray-200"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
                </div>

                <!-- 玩家卡片 2 -->
                <div onclick="openCard('老虎機達人', '5', 'bg-blue-500')" class="flex items-center p-5 bg-white rounded-[28px] shadow-sm active:scale-[0.97] transition-all cursor-pointer">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-md mr-4 bg-blue-500 font-bold text-xl">老</div>
                    <div class="flex-1 flex items-center">
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-bold text-gray-800">老虎機達人</span>
                            <div class="bg-gradient-to-r from-amber-400 to-orange-500 text-white text-[10px] px-2 py-0.5 rounded-md font-black italic shadow-sm">VIP5</div>
                        </div>
                    </div>
                    <div class="text-gray-200"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
                </div>

                <!-- 玩家卡片 3 -->
                <div onclick="openCard('幸運草小萌', '2', 'bg-green-500')" class="flex items-center p-5 bg-white rounded-[28px] shadow-sm active:scale-[0.97] transition-all cursor-pointer">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-md mr-4 bg-green-500 font-bold text-xl">幸</div>
                    <div class="flex-1 flex items-center">
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-bold text-gray-800">幸運草小萌</span>
                            <div class="bg-gradient-to-r from-amber-400 to-orange-500 text-white text-[10px] px-2 py-0.5 rounded-md font-black italic shadow-sm">VIP2</div>
                        </div>
                    </div>
                    <div class="text-gray-200"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
                </div>
            </div>

            <!-- 黑名單列表 -->
            <div id="list-blacklist" class="space-y-4 pt-2 hidden">
                <div id="item-bl-1" class="flex items-center p-5 bg-white rounded-[28px] shadow-sm">
                    <div class="w-14 h-14 bg-gray-50 rounded-full flex items-center justify-center text-gray-300 mr-4 border border-gray-100">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </div>
                    <div class="flex-1 flex items-center">
                        <div class="text-lg font-bold text-gray-800 tracking-tight">惡意洗版魔人</div>
                    </div>
                    <button onclick="document.getElementById('item-bl-1').style.display='none'" class="px-5 py-2.5 bg-white border-2 border-red-500 text-red-500 rounded-xl text-xs font-black active:scale-95 transition-all hover:bg-red-50">
                        解除
                    </button>
                </div>
            </div>
        </div>

        <!-- 底部選單 -->
        <div class="bg-white/95 border-t border-gray-100 flex justify-around items-center py-6 absolute bottom-0 w-full px-6 z-10">
            <div class="flex flex-col items-center gap-1 opacity-20"><div class="w-6 h-6 bg-gray-500 rounded-md"></div><span class="text-[10px] font-bold">大廳</span></div>
            <div class="flex flex-col items-center gap-1 text-blue-600"><div class="w-8 h-8 bg-blue-600 rounded-xl shadow-lg flex items-center justify-center text-white italic font-black text-xs">FC</div><span class="text-[10px] font-black tracking-widest">社交</span></div>
            <div class="flex flex-col items-center gap-1 opacity-20"><div class="w-6 h-6 bg-gray-500 rounded-md"></div><span class="text-[10px] font-bold">設定</span></div>
        </div>

        <!-- 名片彈窗 -->
        <div id="modal-overlay" class="fixed inset-0 z-50 flex items-end justify-center hidden" style="position: absolute;">
            <div onclick="closeCard()" class="absolute inset-0 bg-gray-900/60 backdrop-blur-[3px] fade-in"></div>
            <div class="bg-white w-full rounded-t-[45px] overflow-hidden relative shadow-2xl slide-up z-10">
                <div class="h-32 bg-gradient-to-br from-blue-600 to-indigo-700 relative">
                    <button onclick="closeCard()" class="absolute right-8 top-8 bg-white/20 hover:bg-white/40 rounded-full p-2 text-white transition-colors">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="px-10 pb-14 text-center">
                    <div id="modal-avatar" class="w-32 h-32 mx-auto -mt-16 mb-6 border-[8px] border-white rounded-full shadow-2xl flex items-center justify-center text-white font-bold text-4xl"></div>
                    <div class="mb-10">
                        <div class="flex items-center justify-center gap-3 mb-2">
                            <h2 id="modal-name" class="text-3xl font-black text-gray-900 tracking-tight"></h2>
                            <div id="modal-vip" class="bg-amber-400 text-amber-900 text-xs px-2.5 py-1 rounded-md font-black italic shadow-sm"></div>
                        </div>
                        <p class="text-gray-400 font-bold text-xs tracking-widest uppercase italic opacity-60">SOCIAL CASINO ELITE MEMBER</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-5 mb-10">
                        <div class="relative opacity-40">
                            <div class="flex flex-col items-center py-6 bg-gray-50 rounded-[35px] border-2 border-gray-100">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-2 text-blue-500"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                <span class="text-[11px] font-black text-gray-400 uppercase tracking-tighter">傳送私訊</span>
                            </div>
                            <span class="absolute top-3 right-3 bg-gray-800 text-white text-[8px] px-2 py-0.5 rounded-full font-bold shadow-md">開發中</span>
                        </div>
                        <div class="relative opacity-40">
                            <div class="flex flex-col items-center py-6 bg-gray-50 rounded-[35px] border-2 border-gray-100">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mb-2 text-purple-500"><rect x="2" y="7" width="20" height="5"></rect><path d="M12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
                                <span class="text-[11px] font-black text-gray-400 uppercase tracking-tighter">贈送禮物</span>
                            </div>
                            <span class="absolute top-3 right-3 bg-gray-800 text-white text-[8px] px-2 py-0.5 rounded-full font-bold shadow-md">開發中</span>
                        </div>
                    </div>
                    
                    <button onclick="closeCard()" class="flex items-center justify-center gap-2 mx-auto py-2 px-8 text-gray-300 hover:text-red-500 font-bold text-sm transition-colors active:scale-95">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5c-1.1 0-2 .9-2 2v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="18" y1="8" x2="23" y2="13"></line><line x1="23" y1="8" x2="18" y2="13"></line></svg>
                        移除好友
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const fTab = document.getElementById('tab-friends');
            const bTab = document.getElementById('tab-blacklist');
            const fList = document.getElementById('list-friends');
            const bList = document.getElementById('list-blacklist');
            const ind = document.getElementById('tab-indicator');
            if (tab === 'friends') {
                fTab.classList.replace('text-gray-400', 'text-blue-600');
                bTab.classList.replace('text-blue-600', 'text-gray-400');
                ind.style.left = '0';
                fList.classList.replace('hidden', 'block');
                bList.classList.replace('block', 'hidden');
            } else {
                bTab.classList.replace('text-gray-400', 'text-blue-600');
                fTab.classList.replace('text-blue-600', 'text-gray-400');
                ind.style.left = '50%';
                bList.classList.replace('hidden', 'block');
                fList.classList.replace('block', 'hidden');
            }
        }
        function openCard(name, vip, color) {
            document.getElementById('modal-name').innerText = name;
            document.getElementById('modal-vip').innerText = 'VIP' + vip;
            const avatar = document.getElementById('modal-avatar');
            avatar.innerText = name.substring(0, 1);
            avatar.className = `w-32 h-32 mx-auto -mt-16 mb-6 border-[8px] border-white rounded-full shadow-2xl flex items-center justify-center text-white font-bold text-4xl ${color}`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        function closeCard() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }
    </script>
</body>
</html>
