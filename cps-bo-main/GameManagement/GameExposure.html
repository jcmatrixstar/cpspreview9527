<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 遊戲曝光</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <!-- Modals Container -->
    <div x-data="modalData()" @open-ge-detail.window="openDetail($event.detail)" @open-add-ge.window="openAdd()">

        <!-- 遊戲曝光彈窗 (詳細/新增/編輯) -->
        <div x-show="detailOpen" style="display: none;" class="fixed inset-0 z-[250] flex items-center justify-center bg-black/30 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-[#f8fafc] rounded-lg shadow-2xl w-full max-w-5xl mx-4 overflow-hidden flex flex-col max-h-[92vh]" @click.outside="!isAddMode && !isEditMode && (detailOpen = false)">

                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-white flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                        <span>遊戲曝光</span>
                        <span class="text-gray-400 font-normal text-sm" x-text="isAddMode ? '新增' : editForm.name"></span>
                    </h3>
                </div>

                <div class="overflow-y-auto custom-scroll flex-1 p-6 space-y-4">
                    <!-- 狀態資訊 -->
                    <template x-if="!isAddMode">
                        <div class="bg-[#dfe3e8] border border-[#cbd5e1] rounded-lg p-5 grid grid-cols-2 gap-y-4 text-sm">
                            <div class="space-y-1"><p class="text-gray-500 font-medium">狀態</p><span class="px-2.5 py-0.5 rounded-full bg-green-100 text-green-700 text-xs font-bold border border-green-200 whitespace-nowrap">進行中</span></div>
                            <div class="space-y-1"><p class="text-gray-500 font-medium">最後異動時間</p><div class="text-gray-700 font-medium" x-text="editForm.updateTime || '2026/02/05 16:36:24'"></div></div>
                            <div class="space-y-1"><p class="text-gray-500 font-medium">操作者</p><div class="text-gray-700 font-medium flex items-center gap-1"><i class="ph-fill ph-user-circle"></i> <span x-text="editForm.user || 'yvonne'"></span></div></div>
                        </div>
                    </template>

                    <!-- 基本區塊 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white border-b border-gray-100 flex justify-between items-center font-bold text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-article"></i> 基本</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-6 grid grid-cols-2 gap-x-12 gap-y-4">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500 mr-1" x-show="isAddMode || isEditMode">*</span>名稱</label>
                                <template x-if="isAddMode || isEditMode">
                                    <input type="text" class="w-full border border-gray-200 rounded p-2 text-sm bg-gray-50/50" x-model="editForm.name">
                                </template>
                                <template x-if="!isAddMode && !isEditMode">
                                    <div class="text-sm font-medium text-gray-700" x-text="editForm.name"></div>
                                </template>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500"><span class="text-red-500 mr-1" x-show="isAddMode || isEditMode">*</span>顯示時間</label>
                                <template x-if="isAddMode || isEditMode">
                                    <div class="flex items-center gap-0 border border-gray-200 rounded overflow-hidden">
                                        <div class="flex-1 relative">
                                            <span class="absolute top-0.5 left-2 text-[10px] text-gray-400">開始</span>
                                            <input type="text" class="w-full pt-4 pb-1 px-2 text-sm outline-none" value="2026/02/05 16:31:34">
                                        </div>
                                        <div class="w-px h-8 bg-gray-200"></div>
                                        <div class="flex-1 relative">
                                            <span class="absolute top-0.5 left-2 text-[10px] text-gray-400">結束</span>
                                            <input type="text" class="w-full pt-4 pb-1 px-2 text-sm outline-none" value="2026/02/05 23:59:59">
                                        </div>
                                    </div>
                                </template>
                                <template x-if="!isAddMode && !isEditMode">
                                    <div class="text-sm font-medium text-gray-700" x-text="editForm.displayTime"></div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 設定區塊 (穿梭框) -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white border-b border-gray-100 flex justify-between items-center font-bold text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-squares-four"></i> 設定</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-6">
                            <label class="text-xs font-bold text-gray-500 block mb-3"><span class="text-red-500 mr-1" x-show="isAddMode || isEditMode">*</span>清單</label>

                            <div class="flex gap-4 items-center">
                                <!-- 加入清單 -->
                                <div class="flex-1 border border-gray-200 rounded-lg flex flex-col h-[400px]">
                                    <div class="p-3 border-b border-gray-100" x-show="isAddMode || isEditMode">
                                        <div class="relative"><input type="text" placeholder="搜尋" class="w-full bg-gray-50 border border-gray-100 rounded py-1.5 pl-3 text-sm outline-none"></div>
                                    </div>
                                    <div class="p-3 flex items-center gap-2 border-b border-gray-50">
                                        <input type="checkbox" class="checkbox-custom" x-show="isAddMode || isEditMode">
                                        <span class="text-sm font-bold text-gray-600">加入</span>
                                        <span class="bg-slate-500 text-white text-[10px] px-2 py-0.5 rounded-full" x-text="editForm.count || 0"></span>
                                    </div>
                                    <div class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2">
                                        <template x-for="item in ['FC - 大過年路路發', 'FC - 阿波羅']">
                                            <div class="flex items-center justify-between group">
                                                <div class="flex items-center gap-3">
                                                    <input type="checkbox" class="checkbox-custom" x-show="isAddMode || isEditMode">
                                                    <span class="text-sm text-gray-700" x-text="item"></span>
                                                </div>
                                                <i class="ph ph-dots-six-vertical text-gray-300 group-hover:text-gray-500 cursor-move" x-show="isEditMode"></i>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <!-- 控制鈕 -->
                                <div class="flex flex-col gap-2" x-show="isAddMode || isEditMode">
                                    <button class="w-10 h-10 border border-gray-200 rounded flex items-center justify-center text-gray-400 hover:bg-gray-50"><i class="ph-bold ph-caret-double-right"></i></button>
                                    <button class="w-10 h-10 border border-gray-200 rounded flex items-center justify-center text-gray-400 hover:bg-gray-50"><i class="ph-bold ph-caret-right text-blue-500"></i></button>
                                    <button class="w-10 h-10 border border-gray-200 rounded flex items-center justify-center text-gray-400 hover:bg-gray-50"><i class="ph-bold ph-caret-left"></i></button>
                                    <button class="w-10 h-10 border border-gray-200 rounded flex items-center justify-center text-gray-400 hover:bg-gray-50"><i class="ph-bold ph-caret-double-left"></i></button>
                                </div>
                                <!-- 移除清單 -->
                                <div class="flex-1 border border-gray-200 rounded-lg flex flex-col h-[400px]">
                                    <div class="p-3 border-b border-gray-100" x-show="isAddMode || isEditMode">
                                        <div class="relative"><input type="text" placeholder="搜尋" class="w-full bg-gray-50 border border-gray-100 rounded py-1.5 pl-3 text-sm outline-none"></div>
                                    </div>
                                    <div class="p-3 flex items-center gap-2 border-b border-gray-50">
                                        <input type="checkbox" class="checkbox-custom" x-show="isAddMode || isEditMode">
                                        <span class="text-sm font-bold text-gray-600">移除</span>
                                        <span class="bg-slate-500 text-white text-[10px] px-2 py-0.5 rounded-full">14</span>
                                    </div>
                                    <div class="flex-1 overflow-y-auto custom-scroll p-3 space-y-3">
                                        <template x-for="item in ['FC - 大過年', 'FC - 大過年2', 'FC - 多牛多財', 'FC - 西部風雲', 'FC - 特斯喵提款機', 'FC - 淘金樂', 'FC - 黃金秘寶', 'FC - 奧丁之寶', 'FC - 蜜糖爆擊']">
                                            <div class="flex items-center gap-3">
                                                <input type="checkbox" class="checkbox-custom" x-show="isAddMode || isEditMode">
                                                <span class="text-sm text-gray-700" x-text="item"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 其他區塊 -->
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white border-b border-gray-100 flex justify-between items-center font-bold text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2"><i class="ph-fill ph-note"></i> 其他</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" class="p-6">
                            <label class="text-xs font-bold text-gray-500 block mb-2">備註</label>
                            <template x-if="isAddMode || isEditMode">
                                <textarea class="w-full border border-gray-200 rounded p-4 text-sm min-h-[100px] outline-none focus:border-blue-500 transition-colors bg-gray-50/50" placeholder="(無)"></textarea>
                            </template>
                            <template x-if="!isAddMode && !isEditMode">
                                <p class="text-sm text-gray-400" x-text="editForm.remark"></p>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 border-t border-gray-200 bg-[#e2e8f0] flex justify-end gap-3 flex-shrink-0">
                    <button @click="detailOpen = false; isEditMode = false;" class="px-8 py-2 bg-[#94a3b8] text-white rounded hover:bg-slate-500 shadow-sm text-sm font-bold transition-colors">關閉</button>

                    <template x-if="!isAddMode && !isEditMode">
                        <div class="flex gap-3">
                            <button @click="triggerImport()" class="px-6 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 shadow-sm text-sm font-bold">匯入</button>
                            <button @click="notifyExport()" class="px-6 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 shadow-sm text-sm font-bold">匯出</button>
                            <button @click="isEditMode = true" class="px-8 py-2 bg-[#f59e0b] text-white rounded hover:bg-amber-600 shadow-sm text-sm font-bold">編輯</button>
                        </div>
                    </template>
                    <template x-if="isAddMode || isEditMode">
                        <button class="px-8 py-2 bg-[#2088ea] text-white rounded hover:bg-primary-hover shadow-sm text-sm font-bold">儲存</button>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full bg-[#f3f4f6]" x-data="gePage()">

        <div id="layout-header"></div>

        <div class="flex-1 overflow-auto relative h-full flex flex-col p-4 md:p-6">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <!-- Breadcrumb & Top Actions -->
                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">遊戲管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">遊戲曝光</span>
                    </nav>
                    <div class="flex items-center gap-2">
                        <!-- Help -->
                        <div class="relative group" x-data="{ showHelp: false }">
                            <button @click="showHelp = !showHelp" class="w-8 h-8 rounded-full bg-yellow-400 text-white hover:bg-yellow-500 flex items-center justify-center shadow-sm"><i class="ph-fill ph-lightbulb text-lg"></i></button>
                            <span class="btn-tip">說明</span>
                            <div x-show="showHelp" @click.outside="showHelp = false" class="absolute right-0 top-full mt-2 w-80 p-5 bg-[#fff9db] shadow-xl rounded-lg z-[120] border border-yellow-200 text-xs text-yellow-900 leading-relaxed" x-cloak>
                                <p class="font-bold mb-2 flex items-center gap-1"><i class="ph-fill ph-lightbulb"></i> 說明：</p>
                                <ul class="list-disc pl-5 space-y-2">
                                    <li><span class="font-bold">排版佔比：</span>
                                        <ul class="list-circle pl-4 mt-1 opacity-80"><li>Mobile：1張(100%)、2張(2:1)、3張(1:1:1)</li></ul>
                                    </li>
                                    <li><span class="font-bold">顯示排序：</span>
                                        <ul class="list-circle pl-4 mt-1 opacity-80">
                                            <li>未設定：依據「熱門排行」每日統計數據顯示</li>
                                            <li>數量不足：先依據「遊戲曝光」顯示，不足再依據「熱門排行」每日統計數據顯示</li>
                                        </ul>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!-- Sync Button -->
                        <div class="relative group" x-data="{ syncDropdown: false }">
                            <button @click="syncDropdown = !syncDropdown" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center border border-gray-200 shadow-sm"><i class="ph-bold ph-arrows-clockwise text-lg"></i></button>
                            <span class="btn-tip">資料交換</span>
                            <div x-show="syncDropdown" @click.outside="syncDropdown = false" class="absolute right-0 mt-2 w-32 bg-white rounded-lg shadow-xl border border-gray-100 py-1 z-[150]" x-cloak>
                                <button @click="triggerImport(); syncDropdown = false" class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 text-gray-700">匯入</button>
                                <button @click="notifyExport(selectedIds); syncDropdown = false" class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 text-gray-700">匯出</button>
                            </div>
                        </div>

                        <!-- Add Button -->
                        <div class="relative group">
                            <button @click="$dispatch('open-add-ge')" class="w-8 h-8 rounded-full bg-blue-500 text-white hover:bg-blue-600 flex items-center justify-center shadow-sm"><i class="ph-bold ph-plus text-lg"></i></button>
                            <span class="btn-tip">新增</span>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-1 border-b border-gray-200 px-4 pt-2 rounded-t-lg overflow-x-auto">
                    <template x-for="tab in tabs">
                        <button class="px-6 py-2.5 text-sm font-bold transition-all border-b-2 whitespace-nowrap flex-shrink-0"
                                :class="currentTab === tab ? 'border-primary text-primary bg-white rounded-t-md shadow-sm' : 'border-transparent text-gray-400 hover:text-gray-600'"
                                @click="currentTab = tab" x-text="tab"></button>
                    </template>
                </div>

                <!-- Content Area -->
                <div class="bg-white border border-gray-200 rounded-b-lg shadow-sm flex flex-col flex-1 min-h-0 relative">
                    <div class="bg-gray-100 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-between">
                        <div class="px-4 text-sm font-bold text-blue-600" x-text="selectedIds.length > 0 ? '共 ' + selectedIds.length + ' 筆' : ''"></div>
                        <div class="flex flex-col text-right px-4">
                            <span class="text-xs text-gray-500 font-bold">筆數</span>
                            <span class="text-sm font-bold text-gray-800" x-text="filteredList.length"></span>
                        </div>
                    </div>

                    <div class="flex-1 overflow-auto custom-scroll relative z-0 h-full">
                        <table class="w-full text-left border-collapse min-w-[1200px]">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-6 py-4 w-12 text-center">
                                        <input type="checkbox" class="checkbox-custom" @change="toggleAll()" :checked="selectedIds.length === filteredList.length && filteredList.length > 0">
                                    </th>
                                    <th class="px-6 py-4">名稱</th>
                                    <th class="px-6 py-4">清單</th>
                                    <th class="px-6 py-4">狀態</th>
                                    <th class="px-6 py-4">顯示時間</th>
                                    <th class="px-6 py-4">最後異動時間</th>
                                    <th class="px-6 py-4">操作者</th>
                                    <th class="px-6 py-4">備註</th>
                                    <th class="px-6 py-4 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-if="filteredList.length === 0">
                                    <tr>
                                        <td colspan="9" class="px-6 py-20 text-center text-gray-400 italic">無資料</td>
                                    </tr>
                                </template>
                                <template x-for="row in pagedList" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-6 py-8 text-center"><input type="checkbox" class="checkbox-custom" :value="row.id" x-model="selectedIds"></td>
                                        <td class="px-6 py-8 font-bold text-gray-700" x-text="row.name"></td>
                                        <td class="px-6 py-8 text-gray-400" x-text="row.count"></td>
                                        <td class="px-6 py-8">
                                            <span class="px-2.5 py-0.5 rounded-full bg-green-100 text-green-700 text-xs font-bold border border-green-200 whitespace-nowrap">進行中</span>
                                        </td>
                                        <td class="px-6 py-8 text-xs text-gray-500 font-medium" x-text="row.displayTime"></td>
                                        <td class="px-6 py-8 text-xs text-gray-500 font-medium" x-text="row.updateTime"></td>
                                        <td class="px-6 py-8">
                                            <div class="flex items-center gap-2"><i class="ph-fill ph-user-circle text-gray-400 text-lg"></i><span x-text="row.user"></span></div>
                                        </td>
                                        <td class="px-6 py-8 text-gray-400 italic" x-text="row.remark"></td>
                                        <td class="px-6 py-8 text-center">
                                            <button @click="$dispatch('open-ge-detail', row)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip mx-auto" data-tip="檢視"><i class="ph ph-caret-right text-lg"></i></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="px-6 py-4 border-t border-gray-200 bg-white flex items-center justify-end gap-4 flex-shrink-0">
                        <div class="flex items-center gap-2 text-gray-400">
                            <button @click="currentPage = 1" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                            <button @click="currentPage > 1 && currentPage--" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                        </div>
                        <div class="flex items-center gap-1">
                            <template x-for="p in totalPages" :key="p">
                                <button @click="currentPage = p" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors" :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                            </template>
                        </div>
                        <div class="flex items-center gap-2 text-gray-400">
                            <button @click="currentPage < totalPages && currentPage++" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                            <button @click="currentPage = totalPages" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                        </div>
                        <div class="text-xs text-gray-400 font-medium" x-text="`${(currentPage-1)*pageSize+1} - ${Math.min(currentPage*pageSize, filteredList.length)} 共 ${filteredList.length}`"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        window.PAGE_CONFIG = {
            title:  '遊戲曝光',
            parent: '遊戲管理'
        };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>
    <script>
        function modalData() {
            return {
                detailOpen: false, isAddMode: false, isEditMode: false, editForm: {},
                openDetail(record) { this.isAddMode = false; this.isEditMode = false; this.editForm = { ...record }; this.detailOpen = true; },
                openAdd() { this.isAddMode = true; this.isEditMode = false; this.editForm = { name: '', count: 0, remark: '(無)' }; this.detailOpen = true; }
            }
        }

        function gePage() {
            return {
                selectedIds: [],
                currentPage: 1,
                pageSize: 10,
                currentTab: '電子',
                tabs: ['電子', '捕魚機', '街機', '棋牌', '體育', '視訊', '彩票'],
                electronicList: [
                    { id: 1, name: '0202上線第一版', count: 2, displayTime: '2026/02/01 00:00:00 ~ 2026/02/05 23:59:59', updateTime: '2026/02/05 16:36:24', user: 'yvonne', remark: '(無)' },
