<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta chaluset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 彩池紀錄</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden" 
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()" 
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="jackpotRecordPage()">
        <div id="layout-header"></div>

        <!-- Main Area -->
        <div class="flex-1 overflow-auto p-4 md:p-6 flex flex-col">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">
                
                <!-- Breadcrumb -->
                <div class="flex items-center justify-between mb-5 flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">紀錄管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">彩池紀錄</span>
                    </nav>
                </div>

                <!-- Search Mobile Trigger -->
                <div class="lg:hidden flex-shrink-0">
                    <div @click="searchOpen = true" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <!-- Search Filters -->
                <div :class="{ 'fixed inset-0 z-[150] bg-white flex flex-col': isMobile && searchOpen, 'bg-white border border-gray-200 rounded-lg shadow-sm p-5 flex-shrink-0 lg:block': !isMobile || !searchOpen, 'hidden': isMobile && !searchOpen }">
                    <div class="lg:hidden px-4 py-3 border-b border-gray-100 flex justify-between items-center mb-4 flex-shrink-0" x-show="isMobile">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800">彩池紀錄</span>
                            <span class="text-gray-400 font-normal text-sm">搜尋</span>
                        </div>
                        <button @click="searchOpen = false" class="text-gray-500 hover:text-gray-700 p-1"><i class="ph ph-x text-2xl"></i></button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 items-end px-4 lg:px-0 pt-4 lg:pt-0" :class="{'overflow-y-auto flex-1 pb-20': isMobile}">
                        <div class="floating-input-group" >
                            <label class="floating-label">獎項</label>
                            <select x-model="search.award" class="floating-input bg-input-base focus:bg-white appearance-none">
                                <option value="ALL">全部</option><option value="GRAND">GRAND</option><option value="MAJOR">MAJOR</option><option value="MINI">MINI</option>
                            </select>
                            <i class="ph ph-caret-down absolute right-3 top-3.5 text-gray-400 pointer-events-none"></i>
                        </div>
                        <div class="floating-input-group" >
                            <label class="floating-label">派獎時間</label>
                            <div class="hidden md:flex items-center">
                                <input x-ref="dateStart" type="text" class="floating-input rounded-r-none border-r-0 text-center bg-input-base focus:bg-white">
                                <div class="px-2 py-2.5 text-gray-400 text-xs">~</div>
                                <input x-ref="dateEnd" type="text" class="floating-input rounded-l-none border-l-0 text-center bg-input-base focus:bg-white">
                            </div>
                            <div class="flex flex-col md:hidden w-full">
                                <input x-ref="dateStartMobile" type="text" class="floating-input rounded-b-none border-b-0 text-center bg-input-base focus:bg-white w-full">
                                <input x-ref="dateEndMobile" type="text" class="floating-input rounded-t-none text-center bg-input-base focus:bg-white w-full">
                            </div>
                        </div>
                        <div class="floating-input-group" >
                            <label class="floating-label">彩池獎金</label>
                            <div class="flex items-center gap-1"><input type="number" x-model="search.jackpotMin" class="floating-input bg-input-base focus:bg-white"><span class="text-gray-400">~</span><input type="number" x-model="search.jackpotMax" class="floating-input bg-input-base focus:bg-white"></div>
                        </div>
                        <div class="floating-input-group relative" x-data="{ open: false }" >
                            <label class="floating-label">遊戲名稱</label>
                            <input type="text" x-model="search.gameName" @focus="open = true" @click.outside="open = false" class="floating-input bg-input-base focus:bg-white">
                            <div x-show="open && search.gameName" class="autocomplete-dropdown"><template x-for="g in filteredGames" :key="g"><div class="autocomplete-item" @click="search.gameName = g; open = false" x-text="g"></div></template></div>
                        </div>
                        <div class="floating-input-group" x-show="isMobile || advancedSearch" >
                            <label class="floating-label" x-text="search.targetType === 'nickname' ? '暱稱' : '錢包帳號'"></label>
                            <div class="flex relative">
                                <button @click="search.targetType = search.targetType === 'nickname' ? 'wallet' : 'nickname'" class="flex items-center justify-center w-12 bg-gray-50 border border-r-0 border-gray-200 rounded-l-lg hover:bg-gray-100 transition-colors"><i class="ph text-2xl text-gray-500" :class="search.targetType === 'nickname' ? 'ph-user' : 'ph-wallet'"></i></button>
                                <input type="text" x-model="search.targetValue" class="floating-input rounded-l-none bg-input-base focus:bg-white">
                            </div>
                        </div>
                        <div class="floating-input-group" x-show="isMobile || advancedSearch" >
                            <label class="floating-label">押注額</label>
                            <div class="flex items-center gap-1"><input type="number" x-model="search.betMin" class="floating-input bg-input-base focus:bg-white"><span class="text-gray-400">~</span><input type="number" x-model="search.betMax" class="floating-input bg-input-base focus:bg-white"></div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between" :class="isMobile ? 'fixed bottom-4 left-0 right-0 px-4 bg-white pt-2 border-t border-gray-100 z-50' : 'mt-4 px-4 lg:px-0'">
                        <button @click="advancedSearch = !advancedSearch" class="text-sm text-gray-500 hover:text-primary items-center gap-1 hidden lg:flex"><span x-text="advancedSearch ? '隱藏條件' : '進階'"></span><i class="ph" :class="advancedSearch ? 'ph-caret-up' : 'ph-caret-down'"></i></button>
                        <button @click="searchData(); searchOpen = false" class="lg:w-10 lg:h-10 w-full h-11 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow transition-colors flex items-center justify-center gap-2"><span class="lg:hidden">搜尋</span><i class="ph ph-magnifying-glass text-lg"></i></button>
                    </div>
                </div>

                <!-- Query Results -->
                <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col flex-1 min-h-0 relative">
                    
                    <!-- Summary Strip -->
                    <div class="bg-gray-100 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-end gap-2 text-gray-800">
                         <div class="overflow-x-auto custom-scroll min-w-0 flex-shrink">
                             <div class="flex gap-8 items-center px-4 whitespace-nowrap">
                                 <div class="flex flex-col text-right"><span class="text-xs text-gray-500 font-bold">筆數</span><span class="text-sm font-bold text-gray-800" x-text="records.length"></span></div>
                                 <div class="flex flex-col text-right"><span class="text-xs text-gray-500 font-bold">GRAND</span><span class="text-sm font-bold text-blue-600" x-text="'$' + formatNumber(summary.GRAND)"></span></div>
                                 <div class="flex flex-col text-right"><span class="text-xs text-gray-500 font-bold">MAJOR</span><span class="text-sm font-bold text-green-600" x-text="'$' + formatNumber(summary.MAJOR)"></span></div>
                                 <div class="flex flex-col text-right"><span class="text-xs text-gray-500 font-bold">MINI</span><span class="text-sm font-bold text-orange-600" x-text="'$' + formatNumber(summary.MINI)"></span></div>
                            </div>
                        </div>
                        <div class="flex items-center flex-shrink-0 gap-2 pl-2 border-l border-gray-300">
                            <button @click="openColumnModal()" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-down" data-tip="欄位顯示">
                                <i class="ph ph-columns text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Scrollable Content -->
                    <div class="flex-1 overflow-auto custom-scroll relative z-0">
                         <table class="w-full text-left border-collapse min-w-[1200px]">
                            <thead class="bg-gray-50 text-xs text-gray-700 font-bold border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3">單號</th>
                                    <th class="px-4 py-3">獎項</th>
                                    <th class="px-4 py-3 text-right" x-show="colStatus.jackpotAmount">彩池獎金</th>
                                    <th class="px-4 py-3" x-show="colStatus.payoutTime">派獎時間</th>
                                    <th class="px-4 py-3" x-show="colStatus.gameName">遊戲名稱</th>
                                    <th class="px-4 py-3" x-show="colStatus.betAmount">押注額</th>
                                    <th class="px-4 py-3" x-show="colStatus.betTime">押注時間</th>
                                    <th class="px-4 py-3" x-show="colStatus.nickname">暱稱</th>
                                    <th class="px-4 py-3 text-center" x-show="colStatus.other">其他</th>
                                    <th class="px-4 py-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-600 divide-y divide-gray-100 bg-white">
                                <template x-for="record in displayedRecords" :key="record.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 font-mono text-gray-500 text-xs" x-text="record.id"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold" :class="{'badge-grand': record.award === 'GRAND', 'badge-major': record.award === 'MAJOR', 'badge-mini': record.award === 'MINI'}" x-text="record.award"></span>
                                        </td>
                                        <td class="px-4 py-3 text-right font-bold text-gray-800" x-show="colStatus.jackpotAmount" x-text="'$' + formatNumber(record.jackpotAmount)"></td>
                                        <td class="px-4 py-3 text-xs" x-show="colStatus.payoutTime">
                                            <div class="font-mono text-gray-700" x-text="record.payoutTime"></div>
                                            <div class="text-[11px] text-gray-400 mt-0.5" x-text="record.payoutRelative"></div>
                                        </td>
                                        <td class="px-4 py-3 font-bold text-gray-700" x-show="colStatus.gameName" x-text="record.gameName"></td>
                                        <td class="px-4 py-3 font-mono" x-show="colStatus.betAmount" x-text="'$' + formatNumber(record.betAmount)"></td>
                                        <td class="px-4 py-3 text-xs" x-show="colStatus.betTime">
                                            <div class="font-mono text-gray-700" x-text="record.betTime"></div>
                                            <div class="text-[11px] text-gray-400 mt-0.5" x-text="record.betRelative"></div>
                                        </td>
                                        <td class="px-4 py-3" x-show="colStatus.nickname">
                                            <a href="#" class="text-blue-600 hover:underline font-medium" x-text="record.nickname"></a>
                                        </td>
                                        <td class="px-4 py-3 text-center" x-show="colStatus.other">
                                            <!-- Icons Restored -->
                                            <div class="flex justify-center items-center gap-4">
                                                <div class="rounded-full flex items-center justify-center text-gray-500 transition-colors tooltip" data-tip="相關資訊">
                                                    <i class="ph ph-arrow-square-out text-xl text-gray-400 cursor-pointer hover:text-primary"></i>
                                                </div>
                                                <div class="rounded-full flex items-center justify-center text-gray-500 transition-colors tooltip" data-tip="相關單號">
                                                    <i class="ph ph-file-text text-xl text-gray-400 cursor-pointer hover:text-primary"></i>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <button @click="openDetail(record)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors tooltip" data-tip="檢視">
                                                <i class="ph ph-caret-right text-lg"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-4 border-t border-gray-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2 bg-white flex-shrink-0 sticky bottom-0 z-20">
                        <div class="flex items-center gap-2 order-1 md:order-1">
                             <div class="flex items-center gap-2 text-gray-400 mr-2">
                                <button @click="currentPage = 1" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                                <button @click="currentPage--" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                             </div>
                             <div class="flex items-center gap-1">
                                <template x-for="p in totalPages" :key="p">
                                    <button @click="currentPage = p" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors" :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                                </template>
                             </div>
                             <div class="flex items-center gap-2 text-gray-400 ml-2">
                                <button @click="currentPage++" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                                <button @click="currentPage = totalPages" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                             </div>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2 md:mb-0 md:pl-4 md:border-l border-gray-200 order-2 md:order-2">
                            <span>每頁筆數：</span>
                            <select x-model="pageSize" class="border border-gray-300 rounded px-2 py-1 outline-none text-gray-700 bg-white"><option value="10">10</option><option value="20">20</option><option value="50">50</option></select>
                            <span class="ml-2" x-text="`${(currentPage - 1) * pageSize + 1} - ${Math.min(currentPage * pageSize, records.length)} 共 ${records.length}`"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail View Modal -->
        <div x-show="isDetailOpen" style="display: none;" class="fixed inset-0 z-[160] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="!isRelatedModalOpen && (isDetailOpen = false)">
                <div class="px-6 py-4 border-b border-gray-200 flex items-center gap-3 bg-gray-50 justify-start">
                    <h3 class="text-lg font-bold text-gray-800">彩池紀錄詳細</h3>
                    <span class="text-sm text-gray-400 font-mono" x-text="selectedRecord?.id"></span>
                </div>
                <div class="p-6 overflow-y-auto custom-scroll bg-gray-50 space-y-4 flex-1">

                    <!-- 基本 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100">
                            <div class="flex items-center gap-2 font-bold text-gray-800"><i class="ph-fill ph-trophy text-gray-500"></i> 基本</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" x-collapse class="p-4">
                            <div class="grid grid-cols-2 gap-4 text-sm">
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">獎項</span>
                                    <span class="px-2 py-0.5 rounded text-xs font-bold" :class="{'badge-grand': selectedRecord?.award === 'GRAND', 'badge-major': selectedRecord?.award === 'MAJOR', 'badge-mini': selectedRecord?.award === 'MINI'}" x-text="selectedRecord?.award"></span>
                                </div>
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">彩池獎金</span>
                                    <span class="text-gray-800 font-bold font-mono text-base" x-text="'$' + formatNumber(selectedRecord?.jackpotAmount)"></span>
                                </div>
                                <div class="col-span-2">
                                    <span class="text-gray-500 block text-xs mb-1">派獎時間</span>
                                    <div class="font-mono text-gray-700" x-text="selectedRecord?.payoutTime"></div>
                                    <div class="text-[11px] text-gray-400" x-text="selectedRecord?.payoutRelative"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 注單 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100">
                            <div class="flex items-center gap-2 font-bold text-gray-800"><i class="ph-fill ph-receipt text-gray-500"></i> 注單</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" x-collapse class="p-4">
                            <div class="grid grid-cols-2 gap-4 text-sm">
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">暱稱</span>
                                    <a href="#" class="text-blue-600 hover:underline font-bold" x-text="selectedRecord?.nickname"></a>
                                </div>
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">遊戲名稱</span>
                                    <span class="text-gray-800 font-bold" x-text="selectedRecord?.gameName"></span>
                                </div>
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">押注額</span>
                                    <span class="text-gray-800 font-bold font-mono" x-text="'$' + formatNumber(selectedRecord?.betAmount)"></span>
                                </div>
                                <div>
                                    <span class="text-gray-500 block text-xs mb-1">押注時間</span>
                                    <div class="font-mono text-gray-700" x-text="selectedRecord?.betTime"></div>
                                    <div class="text-[11px] text-gray-400" x-text="selectedRecord?.betRelative"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 其他 -->
                    <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden" x-data="{ open: true }">
                        <div @click="open = !open" class="px-4 py-3 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100">
                            <div class="flex items-center gap-2 font-bold text-gray-800"><i class="ph-fill ph-dots-three-circle text-gray-500"></i> 其他</div>
                            <i class="ph ph-caret-down text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                        </div>
                        <div x-show="open" x-collapse class="p-4">
                            <div class="flex items-center gap-6 text-2xl">
                                <div class="tooltip" data-tip="相關資訊">
                                    <i @click="openRelatedModal(selectedRecord)" class="ph ph-arrow-square-out text-xl text-gray-400 cursor-pointer hover:text-primary transition-colors"></i>
                                </div>
                                <div class="tooltip" data-tip="相關單號">
                                    <i class="ph ph-file-text text-xl text-gray-400 cursor-pointer hover:text-primary transition-colors"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 flex-shrink-0">
                    <button @click="isDetailOpen = false" class="px-6 py-2 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 text-sm font-medium transition-colors">關閉</button>
                </div>
            </div>
        </div>

        <!-- Related Info Modal -->
        <div x-show="isRelatedModalOpen" style="display: none;" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="isRelatedModalOpen = false">
                <div class="px-6 py-4 border-b border-gray-200 flex items-center gap-3 bg-[#f8fafc] justify-start">
                    <h3 class="text-lg font-bold text-gray-800">彩池紀錄 - 相關資訊</h3>
                    <span class="text-sm text-gray-400 font-mono break-all" x-text="currentRelatedRecord?.id"></span>
                </div>
                <div class="p-4 overflow-y-auto custom-scroll bg-[#f1f5f9]">
                    <div class="border border-gray-200 rounded-lg overflow-hidden bg-white shadow-sm">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-[#e2e8f0] text-gray-700 font-bold border-b border-gray-300">
                                <tr>
                                    <th class="px-4 py-3 w-1/3">名稱</th>
                                    <th class="px-4 py-3">內容</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="px-4 py-3 font-medium text-gray-600">交易單號</td>
                                    <td class="px-4 py-3 text-gray-800 break-all font-mono" x-text="currentRelatedRecord?.transactionId || '(無)'"></td>
                                </tr>
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="px-4 py-3 font-medium text-gray-600">押注單號</td>
                                    <td class="px-4 py-3 text-gray-800 break-all font-mono" x-text="currentRelatedRecord?.betOrderId || '(無)'"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 bg-[#f8fafc] flex justify-end gap-3 rounded-b-lg">
                    <button @click="isRelatedModalOpen = false" class="px-8 py-2 bg-[#9ca3af] text-white rounded hover:bg-[#6b7280] shadow-sm text-sm font-bold transition-colors">關閉</button>
                </div>
            </div>
        </div>

        <!-- Column Selection Modal -->
        <div x-show="isColumnModalOpen" style="display: none;" class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="isColumnModalOpen = false">
                <!-- Header -->
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
                    <h3 class="text-lg font-bold text-gray-800">選擇顯示欄位</h3>
                    <div class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-bold font-mono">
                        <span x-text="selectedCount"></span> / <span x-text="totalCount"></span>
                    </div>
                </div>

                <!-- Body -->
                <div class="p-6 overflow-y-auto custom-scroll space-y-4 bg-gray-50 flex-1">
                    <!-- 全選 -->
                    <div class="flex items-center gap-3 cursor-pointer select-none mb-2 w-fit" @click="toggleAll()">
                        <div class="w-5 h-5 rounded flex items-center justify-center transition-colors shadow-sm"
                             :class="{
                                 'bg-primary border-primary': isAllChecked() || isAllIndeterminate(),
                                 'bg-white border-2 border-gray-300': !isAllChecked() && !isAllIndeterminate()
                             }">
                             <i class="ph-bold text-white text-sm"
                                :class="{
                                    'ph-check': isAllChecked(),
                                    'ph-minus': isAllIndeterminate(),
                                    'hidden': !isAllChecked() && !isAllIndeterminate()
                                }"></i>
                        </div>
                        <span class="font-bold text-gray-800">全選</span>
                    </div>

                    <!-- 群組：基本 -->
                    <div class="border border-gray-100 rounded-lg p-5 space-y-4 shadow-sm bg-white">
                        <div class="flex items-center gap-3 cursor-pointer select-none border-b border-gray-100 pb-3" @click="toggleGroup('basic')">
                            <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                 :class="{
                                     'bg-primary border-primary': isGroupChecked('basic') || isGroupIndeterminate('basic'),
                                     'bg-white border-2 border-gray-300': !isGroupChecked('basic') && !isGroupIndeterminate('basic')
                                 }">
                                 <i class="ph-bold text-white text-sm"
                                    :class="{
                                        'ph-check': isGroupChecked('basic'),
                                        'ph-minus': isGroupIndeterminate('basic'),
                                        'hidden': !isGroupChecked('basic') && !isGroupIndeterminate('basic')
                                    }"></i>
                            </div>
                            <span class="font-bold text-gray-800">基本</span>
                        </div>
                        <div class="pl-2 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-y-4 gap-x-2">
                            <template x-for="item in [
                                {key: 'jackpotAmount', label: '彩池獎金'},
                                {key: 'payoutTime', label: '派獎時間'}
                            ]" :key="item.key">
                                <label class="flex items-center gap-2 cursor-pointer select-none">
                                    <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                         :class="tempColStatus[item.key] ? 'bg-primary border-primary' : 'bg-white border-2 border-gray-300'">
                                        <i class="ph-bold ph-check text-white text-sm" x-show="tempColStatus[item.key]"></i>
                                    </div>
                                    <input type="checkbox" x-model="tempColStatus[item.key]" class="hidden">
                                    <span class="text-sm text-gray-700" x-text="item.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>

                    <!-- 群組：注單 -->
                    <div class="border border-gray-100 rounded-lg p-5 space-y-4 shadow-sm bg-white">
                        <div class="flex items-center gap-3 cursor-pointer select-none border-b border-gray-100 pb-3" @click="toggleGroup('bet')">
                            <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                 :class="{
                                     'bg-primary border-primary': isGroupChecked('bet') || isGroupIndeterminate('bet'),
                                     'bg-white border-2 border-gray-300': !isGroupChecked('bet') && !isGroupIndeterminate('bet')
                                 }">
                                 <i class="ph-bold text-white text-sm"
                                    :class="{
                                        'ph-check': isGroupChecked('bet'),
                                        'ph-minus': isGroupIndeterminate('bet'),
                                        'hidden': !isGroupChecked('bet') && !isGroupIndeterminate('bet')
                                    }"></i>
                            </div>
                            <span class="font-bold text-gray-800">注單</span>
                        </div>
                        <div class="pl-2 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-y-4 gap-x-2">
                            <template x-for="item in [
                                {key: 'nickname', label: '暱稱'},
                                {key: 'gameName', label: '遊戲名稱'},
                                {key: 'betAmount', label: '押注額'},
                                {key: 'betTime', label: '押注時間'}
                            ]" :key="item.key">
                                <label class="flex items-center gap-2 cursor-pointer select-none">
                                    <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                         :class="tempColStatus[item.key] ? 'bg-primary border-primary' : 'bg-white border-2 border-gray-300'">
                                        <i class="ph-bold ph-check text-white text-sm" x-show="tempColStatus[item.key]"></i>
                                    </div>
                                    <input type="checkbox" x-model="tempColStatus[item.key]" class="hidden">
                                    <span class="text-sm text-gray-700" x-text="item.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>

                    <!-- 群組：其他 -->
                    <div class="border border-gray-100 rounded-lg p-5 space-y-4 shadow-sm bg-white">
                        <div class="flex items-center gap-3 cursor-pointer select-none border-b border-gray-100 pb-3" @click="toggleGroup('other')">
                            <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                 :class="{
                                     'bg-primary border-primary': isGroupChecked('other') || isGroupIndeterminate('other'),
                                     'bg-white border-2 border-gray-300': !isGroupChecked('other') && !isGroupIndeterminate('other')
                                 }">
                                 <i class="ph-bold text-white text-sm"
                                    :class="{
                                        'ph-check': isGroupChecked('other'),
                                        'ph-minus': isGroupIndeterminate('other'),
                                        'hidden': !isGroupChecked('other') && !isGroupIndeterminate('other')
                                    }"></i>
                            </div>
                            <span class="font-bold text-gray-800">其他</span>
                        </div>
                        <div class="pl-2 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-y-4 gap-x-2">
                            <template x-for="item in [
                                {key: 'other', label: '其他'}
                            ]" :key="item.key">
                                <label class="flex items-center gap-2 cursor-pointer select-none">
                                    <div class="w-5 h-5 rounded flex items-center justify-center transition-colors"
                                         :class="tempColStatus[item.key] ? 'bg-primary border-primary' : 'bg-white border-2 border-gray-300'">
                                        <i class="ph-bold ph-check text-white text-sm" x-show="tempColStatus[item.key]"></i>
                                    </div>
                                    <input type="checkbox" x-model="tempColStatus[item.key]" class="hidden">
                                    <span class="text-sm text-gray-700" x-text="item.label"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end gap-3 rounded-b-lg">
                    <button @click="isColumnModalOpen = false" class="px-6 py-2 bg-[#f1f5f9] text-[#475569] rounded hover:bg-[#e2e8f0] shadow-sm text-sm font-bold transition-colors">取消</button>
                    <button @click="confirmColumnModal()" class="px-6 py-2 bg-[#3b82f6] text-white rounded hover:bg-[#2563eb] shadow-sm text-sm font-bold transition-colors">確定</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        window.PAGE_CONFIG = {
            title:  '彩池紀錄',
            parent: '紀錄管理'
        };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>

    <script>
function jackpotRecordPage() {
            return {
                searchOpen: false, advancedSearch: false, isDetailOpen: false, selectedRecord: null,
                isColumnModalOpen: false,
                isRelatedModalOpen: false, currentRelatedRecord: null,
                isMobile: window.innerWidth < 1024,
                search: { award: 'ALL', gameName: '', jackpotMin: '', jackpotMax: '', targetType: 'nickname', targetValue: '', betMin: '', betMax: '' },
                gameOptions: ['【FC】大過年', '【FC】大過年2', '【FC】蜜糖爆擊', '【JILI】黃金帝國', '【JILI】龍意發'],
                currentPage: 1, pageSize: 10, records: [],
                summary: { GRAND: 123456, MAJOR: 34523, MINI: 6789 },

                colStatus: {
                    jackpotAmount: true, payoutTime: true,
                    nickname: true, gameName: true, betAmount: true, betTime: false,
                    other: true
                },
                tempColStatus: {},
                columnGroups: {
                    basic: ['jackpotAmount', 'payoutTime'],
                    bet: ['nickname', 'gameName', 'betAmount', 'betTime'],
                    other: ['other']
                },
                init() {
                    window.addEventListener('resize', () => { this.isMobile = window.innerWidth < 1024; });
                    flatpickr(this.$refs.dateStart, { dateFormat: "Y/m/d H:i:S", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.dateEnd, { dateFormat: "Y/m/d H:i:S", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.dateStartMobile, { dateFormat: "Y/m/d H:i:S", enableTime: true, time_24hr: true, locale: 'zh-tw' });
                    flatpickr(this.$refs.dateEndMobile, { dateFormat: "Y/m/d H:i:S", enableTime: true, time_24hr: true, locale: 'zh-tw' });

                    const awards = ['GRAND', 'MAJOR', 'MINI'];
                    const users = ['最強小乖乖', 'wayne9527', 'jacky888', 'lucky_star'];
                    for(let i=0; i<30; i++) {
                        this.records.push({
                            id: '685cec' + Math.random().toString(16).substr(2, 8),
                            award: awards[Math.floor(Math.random()*3)],
                            jackpotAmount: Math.floor(Math.random()*100000) + 1000,
                            payoutTime: '2025/11/30 14:00:00', payoutRelative: '- 1 小時前',
                            gameName: this.gameOptions[Math.floor(Math.random()*5)],
                            betAmount: [10, 50, 100, 200][Math.floor(Math.random()*4)],
                            betTime: '2025/11/30 13:59:32', betRelative: '- 1 小時前',
                            nickname: users[Math.floor(Math.random()*4)],
                            transactionId: '699bc025' + Math.random().toString(16).substr(2, 16),
                            betOrderId: '699bc025' + Math.random().toString(16).substr(2, 16)
                        });
                    }
                },
                get filteredGames() { return this.gameOptions.filter(g => g.includes(this.search.gameName)); },
                get totalPages() { return Math.ceil(this.records.length / this.pageSize); },
                get displayedRecords() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.records.slice(start, start + parseInt(this.pageSize));
                },
                formatNumber(val) { return val ? val.toLocaleString() : '0'; },
                searchData() { this.currentPage = 1; },
                openDetail(record) { this.selectedRecord = record; this.isDetailOpen = true; },
                openRelatedModal(record) { this.currentRelatedRecord = record; this.isRelatedModalOpen = true; },

                // Column Selection Logic
                get selectedCount() { return Object.values(this.tempColStatus).filter(v => v).length; },
                get totalCount() { return 7; },
                isGroupChecked(group) { return this.columnGroups[group].every(k => this.tempColStatus[k]); },
                isGroupIndeterminate(group) {
                    const checkedCount = this.columnGroups[group].filter(k => this.tempColStatus[k]).length;
                    return checkedCount > 0 && checkedCount < this.columnGroups[group].length;
                },
                toggleGroup(group) {
                    const isChecked = this.isGroupChecked(group);
                    this.columnGroups[group].forEach(k => this.tempColStatus[k] = !isChecked);
                },
                isAllChecked() { return this.selectedCount === this.totalCount; },
                isAllIndeterminate() { return this.selectedCount > 0 && this.selectedCount < this.totalCount; },
                toggleAll() {
                    const isChecked = this.isAllChecked();
                    Object.keys(this.columnGroups).forEach(g => {
                        this.columnGroups[g].forEach(k => this.tempColStatus[k] = !isChecked);
                    });
                },
                openColumnModal() { this.tempColStatus = { ...this.colStatus }; this.isColumnModalOpen = true; },
                confirmColumnModal() {
                    if (!Object.values(this.tempColStatus).some(v => v)) {
                        this.$dispatch('notify', { message: '至少選取 1 個項目' });
                        return;
                    }
                    this.colStatus = { ...this.tempColStatus };
                    this.isColumnModalOpen = false;
                }
            }
        }
    </script>
</body>
</html>
