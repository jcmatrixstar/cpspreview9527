<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合規後台 - 金流報表</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%9F</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2088ea', hover: '#1a7acb' },
                        dark: { bg: '#1a1c23', surface: '#24262d', text: '#e2e8f0' },
                        amber: { DEFAULT: '#f59e0b', hover: '#d97706' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../_shared/styles.css">
    <style>
        .ratio-bar { height: 8px; border-radius: 4px; transition: width .4s; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex overflow-hidden"
      :class="{ 'dark bg-gray-900 text-gray-100': isDark }"
      x-data="appData()"
      @notify.window="addToast($event.detail)">

    <div id="layout-sidebar"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full" x-data="paymentReportPage()">

        <div id="layout-header"></div>

        <div class="flex-1 overflow-auto relative h-full flex flex-col p-4 md:p-6">
            <div class="max-w-[1600px] w-full mx-auto flex flex-col h-full gap-4">

                <!-- Breadcrumb -->
                <div class="flex items-center justify-between flex-shrink-0">
                    <nav class="flex items-center gap-1.5 text-sm">
                        <span class="text-gray-500">報表管理</span>
                        <i class="ph ph-caret-right text-gray-300 text-xs"></i>
                        <span class="font-semibold text-primary">金流報表</span>
                    </nav>
                    <div class="flex items-center gap-3">
                        <div class="relative" x-data="{ showTip: false }" @click.outside="showTip = false">
                            <button @click="showTip = !showTip" class="w-8 h-8 rounded-full bg-yellow-50 text-yellow-500 hover:bg-yellow-100 transition-colors flex items-center justify-center border border-yellow-200 shadow-sm tooltip tooltip-down" data-tip="說明"><i class="ph-fill ph-lightbulb text-lg"></i></button>
                            <div x-show="showTip" x-transition.opacity class="absolute right-0 top-full mt-2 w-80 p-4 bg-[#fffbeb] shadow-xl rounded-lg z-50 border border-[#fcd34d] text-gray-700"><div class="popover-arrow"></div><h4 class="font-bold text-amber-800 flex items-center gap-2 mb-2 border-b border-amber-200 pb-2"><i class="ph-fill ph-info"></i> 欄位說明</h4><ul class="text-xs space-y-2 list-disc pl-4 text-gray-600"><template x-for="note in currentNotes" :key="note"><li x-html="note"></li></template></ul></div>
                        </div>
                        <button @click="isAlertConfigOpen = true" class="w-8 h-8 rounded-full text-gray-500 hover:bg-gray-100 transition-colors flex items-center justify-center focus:outline-none tooltip tooltip-down" data-tip="設定">
                            <i class="ph ph-gear-six text-xl"></i>
                        </button>
                        <button @click="isAiSummaryOpen = true" class="w-8 h-8 rounded-full text-primary hover:bg-blue-50 transition-colors flex items-center justify-center focus:outline-none tooltip tooltip-down" data-tip="AI 摘要">
                            <i class="ph-fill ph-sparkle text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-1 border-b border-gray-200 px-4 pt-2 flex-shrink-0 overflow-x-auto no-scrollbar">
                    <template x-for="tab in tabs" :key="tab.id">
                        <button @click="switchTab(tab.id)"
                                class="px-8 py-2.5 text-sm font-bold border-b-2 transition-all flex items-center justify-center gap-2 whitespace-nowrap"
                                :class="currentTab === tab.id ? 'border-primary text-primary bg-white rounded-t-md shadow-sm' : 'border-transparent text-gray-400 hover:text-gray-600'">
                            <i :class="['ph text-lg', tab.icon]"></i>
                            <span x-text="tab.name"></span>
                        </button>
                    </template>
                </div>

                <!-- Search Mobile Trigger -->
                <div class="lg:hidden flex-shrink-0">
                    <div @click="searchOpen = true" class="bg-white border border-gray-200 rounded-lg shadow-sm p-3 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-2 text-gray-600 font-bold"><i class="ph ph-magnifying-glass text-lg"></i> 搜尋</div>
                        <i class="ph ph-caret-right text-gray-400"></i>
                    </div>
                </div>

                <!-- Search Container -->
                <div :class="{ 'fixed inset-0 z-[150] bg-white flex flex-col': isMobile && searchOpen, 'bg-white border border-gray-200 rounded-xl shadow-sm flex-shrink-0 lg:block p-5': !isMobile || !searchOpen, 'hidden': isMobile && !searchOpen }">

                    <div class="lg:hidden px-4 py-3 border-b border-gray-100 flex justify-between items-center mb-4 flex-shrink-0" x-show="isMobile">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg text-gray-800" x-text="'金流報表 - ' + (tabs.find(t => t.id === currentTab)?.name || '')"></span>
                            <span class="text-gray-400 font-normal text-sm">搜尋</span>
                        </div>
                        <button @click="searchOpen = false" class="text-gray-500 hover:text-gray-700 p-1"><i class="ph ph-x text-2xl"></i></button>
                    </div>

                    <!-- Basic Search Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 items-start lg:items-end px-4 lg:px-0 pt-6 lg:pt-0" :class="{'pb-24 overflow-y-auto h-[calc(100vh-140px)] block': isMobile}">
                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label">日期</label>
                            <div class="flex items-center">
                                <input x-ref="dateStart" type="text" class="floating-input rounded-r-none border-r-0 text-center bg-input-base focus:bg-white" placeholder="起">
                                <div class="px-1 border-y border-gray-200 bg-input-base h-[42px] flex items-center text-gray-400">~</div>
                                <input x-ref="dateEnd" type="text" class="floating-input rounded-l-none border-l-0 text-center bg-input-base focus:bg-white" placeholder="訖">
                            </div>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label">商戶</label>
                            <select x-model="search.merchant" class="floating-input bg-input-base focus:bg-white">
                                <option value="">全部</option>
                                <option>USDT Pay</option>
                                <option>EcoPay</option>
                                <option>QuickPay</option>
                                <option>FastTransfer</option>
                                <option>UniPay</option>
                            </select>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label">通道</label>
                            <select x-model="search.channel" class="floating-input bg-input-base focus:bg-white">
                                <option value="">全部</option>
                                <option>ATM</option>
                                <option>超商</option>
                                <option>信用卡</option>
                                <option>GASH 樂點</option>
                                <option>街口支付</option>
                                <option>LINE Pay</option>
                            </select>
                        </div>

                        <div class="floating-input-group" :class="{'mb-5': isMobile}">
                            <label class="floating-label">交易類型</label>
                            <select x-model="search.txType" class="floating-input bg-input-base focus:bg-white">
                                <option value="">全部</option>
                                <option value="deposit">存款</option>
                                <option value="withdraw">退款</option>
                            </select>
                        </div>
                    </div>

                    <!-- Bottom Action Row -->
                    <div class="flex items-center justify-end mt-4 px-4 lg:px-0 lg:flex-row flex-col-reverse gap-4 lg:gap-0" :class="{'fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100 z-[130]': isMobile}">
                        <button @click="fetchData(); searchOpen = false" class="lg:w-10 lg:h-10 w-full h-11 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                            <span class="lg:hidden">搜尋</span>
                            <i class="ph ph-magnifying-glass text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-white border border-gray-200 shadow-sm rounded-xl overflow-hidden flex flex-col flex-1 min-h-0 relative">
                    <div x-show="isLoading" class="absolute inset-0 bg-white/80 z-50 flex items-center justify-center backdrop-blur-sm">
                        <div class="flex flex-col items-center gap-2"><i class="ph ph-spinner animate-spin text-3xl text-primary"></i><span class="text-sm font-medium text-gray-600">數據更新中...</span></div>
                    </div>

                    <!-- Summary Bar -->
                    <div class="bg-gray-50 p-3 border-b border-gray-200 flex-shrink-0 flex items-center justify-between gap-5">
                        <div class="flex gap-8 items-center px-4 whitespace-nowrap overflow-x-auto no-scrollbar custom-scroll ml-auto">
                            <template x-for="metric in summaryMetrics" :key="metric.label">
                                <div class="flex flex-col text-right">
                                    <span class="text-xs text-gray-500" x-text="metric.label"></span>
                                    <span class="text-sm font-bold font-mono" :class="metric.color || 'text-gray-800'" x-text="metric.value"></span>
                                </div>
                            </template>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0 pr-2">
                            <button x-show="currentTab === 'merchant'" @click="openColumnModal()" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-bottom" data-tip="欄位顯示">
                                <i class="ph ph-columns text-lg"></i>
                            </button>
                            <button @click="notifyDownload()" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center justify-center shadow-sm tooltip tooltip-down" data-tip="下載">
                                <i class="ph ph-download-simple text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="overflow-auto flex-1 relative custom-scroll">

                        <!-- Merchant Overview Tab -->
                        <table x-show="currentTab === 'merchant'" class="w-full text-sm text-gray-600 whitespace-nowrap border-collapse min-w-max">
                            <thead class="bg-gray-50 text-xs text-gray-700 uppercase font-bold sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-left sticky-left-0 bg-gray-50 min-w-[160px]">商戶</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.depositCount">存款筆數</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.depositAmount">存款金額</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.withdrawCount">退款筆數</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.withdrawAmount">退款金額</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.totalTx">總交易量</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.successRate">上分率</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.repurchaseRate">回購率</th>
                                    <th class="px-4 py-3 text-right bg-gray-50" x-show="colStatus.netFlow">淨流量</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="row in merchantData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 text-left sticky-left-0 bg-white font-medium text-gray-800 min-w-[160px]">
                                            <div class="flex items-center gap-2">
                                                <div class="w-7 h-7 rounded bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold flex-shrink-0" x-text="row.name[0]"></div>
                                                <span x-text="row.name"></span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-right font-mono" x-text="row.depositCount.toLocaleString()" x-show="colStatus.depositCount"></td>
                                        <td class="px-4 py-3 text-right font-mono font-medium text-green-600" x-text="'$' + row.depositAmount.toLocaleString()" x-show="colStatus.depositAmount"></td>
                                        <td class="px-4 py-3 text-right font-mono" x-text="row.withdrawCount.toLocaleString()" x-show="colStatus.withdrawCount"></td>
                                        <td class="px-4 py-3 text-right font-mono font-medium text-red-500" x-text="'$' + row.withdrawAmount.toLocaleString()" x-show="colStatus.withdrawAmount"></td>
                                        <td class="px-4 py-3 text-right font-mono font-bold" x-text="(row.depositCount + row.withdrawCount).toLocaleString()" x-show="colStatus.totalTx"></td>
                                        <td class="px-4 py-3 text-right" x-show="colStatus.successRate">
                                            <span class="font-mono font-bold" :class="row.successRate >= 95 ? 'text-green-600' : row.successRate >= 85 ? 'text-yellow-500' : 'text-red-500'" x-text="row.successRate + '%'"></span>
                                        </td>
                                        <td class="px-4 py-3 text-right" x-show="colStatus.repurchaseRate">
                                            <span class="font-mono font-bold" :class="row.repurchaseRate >= 60 ? 'text-green-600' : row.repurchaseRate >= 40 ? 'text-yellow-500' : 'text-red-500'" x-text="row.repurchaseRate + '%'"></span>
                                        </td>
                                        <td class="px-4 py-3 text-right font-mono font-bold" :class="(row.depositAmount - row.withdrawAmount) >= 0 ? 'text-green-600' : 'text-red-500'" x-text="(row.depositAmount - row.withdrawAmount >= 0 ? '+$' : '-$') + Math.abs(row.depositAmount - row.withdrawAmount).toLocaleString()" x-show="colStatus.netFlow"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Channel Analysis Tab -->
                        <table x-show="currentTab === 'channel'" class="w-full text-sm text-gray-600 whitespace-nowrap border-collapse min-w-max">
                            <thead class="bg-gray-50 text-xs text-gray-700 uppercase font-bold sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-left sticky-left-0 bg-gray-50 min-w-[160px]">通道</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">商戶</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">交易類型</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">交易量</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">交易金額</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">成功筆數</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">失敗筆數</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">上分率</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">平均金額</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">平均處理(秒)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="row in channelData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 text-left sticky-left-0 bg-white min-w-[160px]">
                                            <div class="flex items-center gap-2">
                                                <i class="ph text-lg" :class="getChannelIcon(row.channel)"></i>
                                                <span class="font-medium" x-text="row.channel"></span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-gray-700" x-text="row.merchant"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-xs font-bold" :class="row.txType === '存款' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'" x-text="row.txType"></span>
                                        </td>
                                        <td class="px-4 py-3 text-right font-mono font-bold" x-text="row.txCount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono font-medium" x-text="'$' + row.txAmount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono text-green-600" x-text="row.successCount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono text-red-500" x-text="row.failCount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right">
                                            <span class="font-mono font-bold" :class="row.successRate >= 95 ? 'text-green-600' : row.successRate >= 85 ? 'text-yellow-500' : 'text-red-500'" x-text="row.successRate + '%'"></span>
                                        </td>
                                        <td class="px-4 py-3 text-right font-mono text-gray-500" x-text="'$' + row.avgAmount.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono" x-text="row.avgSeconds + 's'"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Success Rate Analysis Tab -->
                        <table x-show="currentTab === 'successRate'" class="w-full text-sm text-gray-600 whitespace-nowrap border-collapse min-w-max">
                            <thead class="bg-gray-50 text-xs text-gray-700 uppercase font-bold sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-3 text-left sticky-left-0 bg-gray-50 min-w-[120px]">日期</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">通道</th>
                                    <th class="px-4 py-3 text-left bg-gray-50">商戶</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">總筆數</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">成功</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">失敗</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">待處理</th>
                                    <th class="px-4 py-3 text-right bg-gray-50 min-w-[160px]">上分率</th>
                                    <th class="px-4 py-3 text-right bg-gray-50">較前日</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="row in successRateData" :key="row.id">
                                    <tr class="hover:bg-blue-50/50 transition-colors">
                                        <td class="px-4 py-3 text-left sticky-left-0 bg-white font-mono text-gray-700 min-w-[120px]" x-text="row.date"></td>
                                        <td class="px-4 py-3 text-gray-700" x-text="row.channel"></td>
                                        <td class="px-4 py-3 text-gray-700" x-text="row.merchant"></td>
                                        <td class="px-4 py-3 text-right font-mono font-bold" x-text="row.total.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono text-green-600" x-text="row.success.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono text-red-500" x-text="row.fail.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right font-mono text-yellow-500" x-text="row.pending.toLocaleString()"></td>
                                        <td class="px-4 py-3 text-right min-w-[160px]">
                                            <div class="flex items-center justify-end gap-2">
                                                <div class="h-2 rounded-full bg-gray-200 w-20 overflow-hidden">
                                                    <div class="h-full rounded-full transition-all" :style="`width: ${row.rate}%`" :class="row.rate >= 95 ? 'bg-green-500' : row.rate >= 85 ? 'bg-yellow-400' : 'bg-red-500'"></div>
                                                </div>
                                                <span class="font-mono font-bold w-12 text-right" :class="row.rate >= 95 ? 'text-green-600' : row.rate >= 85 ? 'text-yellow-500' : 'text-red-500'" x-text="row.rate + '%'"></span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-right">
                                            <span class="text-xs font-bold flex items-center justify-end gap-1" :class="row.delta >= 0 ? 'text-green-600' : 'text-red-500'">
                                                <i class="ph text-sm" :class="row.delta >= 0 ? 'ph-caret-up' : 'ph-caret-down'"></i>
                                                <span x-text="(row.delta >= 0 ? '+' : '') + row.delta + '%'"></span>
                                            </span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Amount Ratio Tab -->
                        <div x-show="currentTab === 'amountRatio'" class="p-6 space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <!-- By Channel -->
                                <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                                    <h4 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="ph-fill ph-chart-pie text-primary"></i> 通道金額占比</h4>
                                    <div class="space-y-3">
                                        <template x-for="row in amountRatioData.channels" :key="row.channel">
                                            <div>
                                                <div class="flex justify-between text-sm mb-1">
                                                    <span class="font-medium text-gray-700" x-text="row.channel"></span>
                                                    <div class="flex gap-3 text-right">
                                                        <span class="font-mono text-gray-500" x-text="'$' + row.amount.toLocaleString()"></span>
                                                        <span class="font-bold w-12 text-right" :class="row.pct >= 30 ? 'text-primary' : 'text-gray-600'" x-text="row.pct + '%'"></span>
                                                    </div>
                                                </div>
                                                <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                                                    <div class="h-full rounded-full transition-all duration-500"
                                                         :style="`width: ${row.pct}%`"
                                                         :class="row.pct >= 30 ? 'bg-primary' : row.pct >= 15 ? 'bg-blue-300' : 'bg-gray-300'"></div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <!-- By Merchant -->
                                <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                                    <h4 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="ph-fill ph-buildings text-green-500"></i> 商戶金額占比</h4>
                                    <div class="space-y-3">
                                        <template x-for="row in amountRatioData.merchants" :key="row.merchant">
                                            <div>
                                                <div class="flex justify-between text-sm mb-1">
                                                    <span class="font-medium text-gray-700" x-text="row.merchant"></span>
                                                    <div class="flex gap-3 text-right">
                                                        <span class="font-mono text-gray-500" x-text="'$' + row.amount.toLocaleString()"></span>
                                                        <span class="font-bold w-12 text-right" :class="row.pct >= 30 ? 'text-green-600' : 'text-gray-600'" x-text="row.pct + '%'"></span>
                                                    </div>
                                                </div>
                                                <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                                                    <div class="h-full rounded-full transition-all duration-500"
                                                         :style="`width: ${row.pct}%`"
                                                         :class="row.pct >= 30 ? 'bg-green-500' : row.pct >= 15 ? 'bg-green-300' : 'bg-gray-300'"></div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- Detail Table -->
                            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                <div class="px-5 py-3 border-b border-gray-100 font-bold text-gray-700 text-sm flex items-center gap-2">
                                    <i class="ph ph-table text-primary"></i> 明細
                                </div>
                                <table class="w-full text-sm text-gray-600">
                                    <thead class="bg-gray-50 text-xs text-gray-700 font-bold">
                                        <tr>
                                            <th class="px-4 py-3 text-left">商戶</th>
                                            <th class="px-4 py-3 text-left">通道</th>
                                            <th class="px-4 py-3 text-right">交易金額</th>
                                            <th class="px-4 py-3 text-right">占比(全量)</th>
                                            <th class="px-4 py-3 text-right">占比(同商戶)</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        <template x-for="row in amountRatioData.detail" :key="row.id">
                                            <tr class="hover:bg-blue-50/50 transition-colors">
                                                <td class="px-4 py-3 font-medium" x-text="row.merchant"></td>
                                                <td class="px-4 py-3 text-gray-700" x-text="row.channel"></td>
                                                <td class="px-4 py-3 text-right font-mono font-bold" x-text="'$' + row.amount.toLocaleString()"></td>
                                                <td class="px-4 py-3 text-right">
                                                    <span class="font-mono font-medium" x-text="row.globalPct + '%'"></span>
                                                </td>
                                                <td class="px-4 py-3 text-right">
                                                    <span class="font-mono font-medium text-primary" x-text="row.merchantPct + '%'"></span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>

                    <!-- Pagination (merchant & channel tabs) -->
                    <div x-show="currentTab === 'merchant' || currentTab === 'channel' || currentTab === 'successRate'" class="p-4 border-t border-gray-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2 bg-white flex-shrink-0 sticky bottom-0 z-20">
                        <div class="flex items-center gap-2 order-1">
                            <div class="flex items-center gap-2 text-gray-400 mr-2">
                                <button @click="changePage(1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-back text-sm"></i></button>
                                <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-left text-sm"></i></button>
                            </div>
                            <div class="flex items-center gap-1">
                                <template x-for="p in pagesArray" :key="p">
                                    <button @click="changePage(p)" class="w-8 h-8 rounded-full text-sm font-medium flex items-center justify-center transition-colors"
                                            :class="currentPage === p ? 'bg-primary text-white shadow-sm' : 'hover:bg-gray-100 text-gray-600'" x-text="p"></button>
                                </template>
                            </div>
                            <div class="flex items-center gap-2 text-gray-400 ml-2">
                                <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-caret-right text-sm"></i></button>
                                <button @click="changePage(totalPages)" :disabled="currentPage === totalPages" class="hover:text-primary disabled:opacity-50"><i class="ph ph-skip-forward text-sm"></i></button>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2 md:mb-0 md:pl-4 md:border-l border-gray-200 order-2">
                            <span>每頁筆數：</span>
                            <select x-model="pageSize" @change="currentPage = 1" class="border border-gray-300 rounded px-2 py-1 outline-none text-gray-700 bg-white hover:border-gray-400">
                                <option value="10">10</option><option value="20">20</option><option value="50">50</option>
                            </select>
                            <span x-text="`共 ${currentTabDataLength} 筆`"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column Selector Modal -->
        <div x-show="isColumnModalOpen" style="display: none;" class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="isColumnModalOpen = false">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
                    <h3 class="text-lg font-bold text-gray-800">選擇顯示欄位</h3>
                    <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" class="checkbox-item rounded" :checked="isAllChecked()" :indeterminate.prop="isAllIndeterminate()" @change="toggleAll()">
                        全選 (<span x-text="selectedColCount()"></span>/9)
                    </label>
                </div>
                <div class="p-6 overflow-y-auto custom-scroll">
                    <div class="grid grid-cols-2 gap-3">
                        <template x-for="(label, key) in colLabels" :key="key">
                            <label class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 rounded p-2 transition-colors">
                                <input type="checkbox" class="checkbox-item rounded" x-model="tempColStatus[key]">
                                <span class="text-sm text-gray-700" x-text="label"></span>
                            </label>
                        </template>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end gap-3">
                    <button @click="isColumnModalOpen = false" class="px-6 py-2 bg-[#f1f5f9] text-[#475569] rounded hover:bg-[#e2e8f0] shadow-sm text-sm font-bold transition-colors">取消</button>
                    <button @click="confirmColumnModal()" class="px-6 py-2 bg-[#3b82f6] text-white rounded hover:bg-[#2563eb] shadow-sm text-sm font-bold transition-colors">確定</button>
                </div>
            </div>
        </div>

        <!-- Alert Config Modal -->
        <div x-show="isAlertConfigOpen" x-cloak class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[90vh]" @click.outside="isAlertConfigOpen = false">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="ph-fill ph-gear-six text-primary"></i> 告警設定</h3>
                </div>
                <div class="p-6 overflow-y-auto custom-scroll flex-1 space-y-6">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="text-sm font-bold text-gray-700">告警參數</h4>
                            <button @click="addAlertRule()" class="text-xs text-primary hover:underline flex items-center gap-1"><i class="ph ph-plus"></i> 新增條件</button>
                        </div>
                        <div class="space-y-3">
                            <template x-for="(rule, idx) in alertConfig.rules" :key="idx">
                                <div class="flex flex-wrap items-center gap-2 p-3 bg-gray-50 rounded-lg border border-gray-100">
                                    <select x-model="rule.metric" class="floating-input h-10 text-sm flex-1 min-w-[140px]">
                                        <template x-for="m in alertMetricOptions" :key="m"><option :value="m" x-text="m"></option></template>
                                    </select>
                                    <select x-model="rule.operator" class="floating-input h-10 text-sm w-20">
                                        <option value=">">&gt;</option>
                                        <option value="<">&lt;</option>
                                        <option value=">=">&ge;</option>
                                        <option value="<=">&le;</option>
                                    </select>
                                    <input type="number" x-model="rule.value" class="floating-input h-10 text-sm w-28" placeholder="閾值">
                                    <button @click="alertConfig.rules.splice(idx, 1)" class="w-8 h-8 rounded-full hover:bg-red-50 text-red-400 hover:text-red-500 flex items-center justify-center flex-shrink-0"><i class="ph ph-trash"></i></button>
                                </div>
                            </template>
                            <div x-show="alertConfig.rules.length === 0" class="text-center text-xs text-gray-400 py-4">尚未設定告警參數</div>
                        </div>
                    </div>
                    <div class="floating-input-group">
                        <label class="floating-label">通知頻率</label>
                        <select x-model="alertConfig.frequency" class="floating-input bg-white">
                            <option value="realtime">即時</option>
                            <option value="hourly">每小時彙整</option>
                            <option value="daily">每日彙整</option>
                            <option value="weekly">每週彙整</option>
                        </select>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-700 mb-2">通知對象</h4>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="target in alertTargetOptions" :key="target">
                                <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50 select-none" :class="alertConfig.targets.includes(target) ? 'border-primary bg-blue-50' : 'border-gray-200'">
                                    <input type="checkbox" :value="target" x-model="alertConfig.targets" class="checkbox-item rounded">
                                    <span class="text-sm text-gray-700" x-text="target"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end gap-3 flex-shrink-0">
                    <button @click="isAlertConfigOpen = false" class="px-4 py-2 text-sm font-bold text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition-colors">取消</button>
                    <button @click="saveAlertConfig()" class="px-4 py-2 text-sm font-bold text-white bg-primary rounded hover:bg-blue-600 shadow-sm transition-colors">儲存</button>
                </div>
            </div>
        </div>

        <!-- AI Summary Modal -->
        <div x-show="isAiSummaryOpen" x-cloak class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-transition.opacity>
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden flex flex-col h-[70vh] max-h-[640px]" @click.outside="isAiSummaryOpen = false">
                <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-blue-50 to-transparent flex-shrink-0">
                    <h3 class="text-base font-bold text-gray-800 flex items-center gap-2"><i class="ph-fill ph-sparkle text-primary"></i> AI 摘要助手</h3>
                    <button @click="isAiSummaryOpen = false" class="text-gray-400 hover:text-gray-600 p-1 rounded transition-colors"><i class="ph ph-x text-xl"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4 bg-gray-50" x-ref="aiChatBody">
                    <template x-for="(msg, idx) in aiChatMessages" :key="idx">
                        <div class="flex" :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
                            <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed"
                                 :class="msg.role === 'user' ? 'bg-primary text-white rounded-br-sm' : 'bg-white border border-gray-200 text-gray-700 rounded-bl-sm shadow-sm'">
                                <div class="flex items-center gap-1.5 mb-1" x-show="msg.role === 'ai'"><i class="ph-fill ph-sparkle text-primary text-xs"></i><span class="text-xs font-bold text-primary">AI 助手</span></div>
                                <div x-html="msg.content"></div>
                            </div>
                        </div>
                    </template>
                    <div x-show="aiThinking" class="flex justify-start">
                        <div class="bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce" style="animation-delay:0ms"></span>
                            <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce" style="animation-delay:150ms"></span>
                            <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce" style="animation-delay:300ms"></span>
                        </div>
                    </div>
                </div>
                <div class="px-4 py-2 flex flex-wrap gap-2 border-t border-gray-100 flex-shrink-0" x-show="aiChatMessages.length <= 1">
                    <template x-for="q in aiSuggestedQuestions" :key="q">
                        <button @click="askAi(q)" class="px-3 py-1.5 text-xs bg-blue-50 text-primary rounded-full hover:bg-blue-100 transition-colors" x-text="q"></button>
                    </template>
                </div>
                <div class="p-3 border-t border-gray-100 flex gap-2 flex-shrink-0 bg-white">
                    <input type="text" x-model="aiInput" @keydown.enter="askAi()" placeholder="輸入你的問題…" class="floating-input flex-1 bg-gray-50 focus:bg-white">
                    <button @click="askAi()" class="w-10 h-10 flex-shrink-0 flex items-center justify-center bg-primary text-white rounded-lg hover:bg-blue-600 shadow-md active:scale-95 transition-all">
                        <i class="ph ph-paper-plane-tilt text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        window.PAGE_CONFIG = { title: '金流報表', parent: '報表管理' };
    </script>
    <script src="../_shared/shared.js"></script>
    <script src="../_shared/layout.js"></script>
    <script>
        function paymentReportPage() {
            return {
                isLoading: false,
                isColumnModalOpen: false,
                isMobile: window.innerWidth < 1024,
                searchOpen: false,
                currentTab: 'merchant',
                currentPage: 1,
                pageSize: 10,
                search: { merchant: '', channel: '', txType: '' },

                isAlertConfigOpen: false,
                isAiSummaryOpen: false,
                alertConfig: { rules: [], frequency: 'daily', targets: [] },
                alertMetricOptions: ['存款金額', '退款金額', '上分率', '回購率', '淨流量'],
                alertTargetOptions: ['系統管理員', '營運主管', 'Line 群組', 'Email 群組'],
                aiChatMessages: [{ role: 'ai', content: '您好，我是 AI 摘要助手，可以協助您分析目前頁籤的數據，或執行操作（例如切換頁籤、匯出報表）。請問需要什麼協助？' }],
                aiInput: '',
                aiThinking: false,
                aiSuggestedQuestions: ['幫我摘要目前頁籤的重點數據', '哪個通道的上分率最低？', '幫我切換到金額占比頁籤'],

                tabs: [
                    { id: 'merchant',     name: '商戶總覽', icon: 'ph-buildings' },
                    { id: 'channel',      name: '通道分析', icon: 'ph-git-fork' },
                    { id: 'successRate',  name: '上分率',   icon: 'ph-chart-line-up' },
                    { id: 'amountRatio',  name: '金額占比', icon: 'ph-chart-pie' }
                ],

                colStatus: {
                    depositCount: true, depositAmount: true,
                    withdrawCount: true, withdrawAmount: true,
                    totalTx: true, successRate: true, repurchaseRate: true, netFlow: true
                },
                tempColStatus: {},
                colLabels: {
                    depositCount: '存款筆數', depositAmount: '存款金額',
                    withdrawCount: '退款筆數', withdrawAmount: '退款金額',
                    totalTx: '總交易量', successRate: '上分率', repurchaseRate: '回購率', netFlow: '淨流量'
                },

                merchantData: [],
                channelData: [],
                successRateData: [],
                amountRatioData: { channels: [], merchants: [], detail: [] },

                get currentTabDataLength() {
                    if (this.currentTab === 'merchant') return this.merchantData.length;
                    if (this.currentTab === 'channel') return this.channelData.length;
                    if (this.currentTab === 'successRate') return this.successRateData.length;
                    return 0;
                },
                get totalPages() { return Math.max(1, Math.ceil(this.currentTabDataLength / this.pageSize)); },
                get pagesArray() { return Array.from({ length: Math.min(this.totalPages, 5) }, (_, i) => i + 1); },
                get summaryMetrics() {
                    if (this.currentTab === 'merchant') {
                        const d = this.merchantData;
                        const totalDeposit = d.reduce((s, r) => s + r.depositAmount, 0);
                        const totalWithdraw = d.reduce((s, r) => s + r.withdrawAmount, 0);
                        const avgSuccess = d.length ? Math.round(d.reduce((s, r) => s + r.successRate, 0) / d.length) : 0;
                        return [
                            { label: '商戶數', value: d.length.toLocaleString() },
                            { label: '存款', value: '$' + totalDeposit.toLocaleString(), color: 'text-green-600' },
                            { label: '退款', value: '$' + totalWithdraw.toLocaleString(), color: 'text-orange-500' },
                            { label: '平均上分率', value: avgSuccess + '%', color: avgSuccess >= 95 ? 'text-green-600' : avgSuccess >= 85 ? 'text-yellow-500' : 'text-red-500' },
                            { label: '淨流量', value: (totalDeposit - totalWithdraw >= 0 ? '+$' : '-$') + Math.abs(totalDeposit - totalWithdraw).toLocaleString(), color: totalDeposit >= totalWithdraw ? 'text-green-600' : 'text-red-500' }
                        ];
                    }
                    if (this.currentTab === 'channel') {
                        const d = this.channelData;
                        const avgRate = d.length ? Math.round(d.reduce((s, r) => s + r.successRate, 0) / d.length) : 0;
                        return [
                            { label: '通道數', value: d.length.toLocaleString() },
                            { label: '總交易量', value: d.reduce((s, r) => s + r.txCount, 0).toLocaleString() },
                            { label: '總交易額', value: '$' + d.reduce((s, r) => s + r.txAmount, 0).toLocaleString() },
                            { label: '平均上分率', value: avgRate + '%', color: avgRate >= 95 ? 'text-green-600' : 'text-yellow-500' }
                        ];
                    }
                    if (this.currentTab === 'successRate') {
                        const d = this.successRateData;
                        const avgRate = d.length ? Math.round(d.reduce((s, r) => s + r.rate, 0) / d.length) : 0;
                        return [
                            { label: '筆數', value: d.reduce((s, r) => s + r.total, 0).toLocaleString() },
                            { label: '成功筆數', value: d.reduce((s, r) => s + r.success, 0).toLocaleString(), color: 'text-green-600' },
                            { label: '失敗筆數', value: d.reduce((s, r) => s + r.fail, 0).toLocaleString(), color: 'text-red-500' },
                            { label: '平均上分率', value: avgRate + '%', color: avgRate >= 95 ? 'text-green-600' : 'text-yellow-500' }
                        ];
                    }
                    if (this.currentTab === 'amountRatio') {
                        const total = this.amountRatioData.channels.reduce((s, r) => s + r.amount, 0);
                        return [
                            { label: '總金額', value: '$' + total.toLocaleString() },
                            { label: '通道數', value: this.amountRatioData.channels.length.toLocaleString() },
                            { label: '商戶數', value: this.amountRatioData.merchants.length.toLocaleString() }
                        ];
                    }
                    return [];
                },

                get currentNotes() {
                    if (this.currentTab === 'merchant') return [
                        '總交易量：存款筆數 + 退款筆數',
                        '上分率：成功存款筆數 ÷ 總存款筆數 × 100%',
                        '回購率：重複儲值玩家數 ÷ 總儲值玩家數 × 100%',
                        '淨流量：存款金額 - 退款金額'
                    ];
                    if (this.currentTab === 'channel') return [
                        '上分率：成功筆數 ÷ 交易量 × 100%',
                        '平均金額：交易金額 ÷ 交易量',
                        '平均處理(秒)：交易從送出到完成的平均耗時'
                    ];
                    if (this.currentTab === 'successRate') return [
                        '上分率：成功 ÷ 總筆數 × 100%',
                        '較前日：今日上分率 - 前一日上分率'
                    ];
                    if (this.currentTab === 'amountRatio') return [
                        '占比(全量)：該筆金額 ÷ 全部商戶總金額 × 100%',
                        '占比(同商戶)：該筆金額 ÷ 同商戶總金額 × 100%'
                    ];
                    return [];
                },

                addAlertRule() { this.alertConfig.rules.push({ metric: this.alertMetricOptions[0], operator: '>', value: '' }); },
                saveAlertConfig() { this.isAlertConfigOpen = false; this.$dispatch('notify', '告警設定已儲存'); },
                askAi(preset) {
                    const q = (preset || this.aiInput).trim();
                    if (!q) return;
                    this.aiChatMessages.push({ role: 'user', content: q });
                    this.aiInput = '';
                    this.aiThinking = true;
                    this.$nextTick(() => { this.$refs.aiChatBody.scrollTop = this.$refs.aiChatBody.scrollHeight; });
                    setTimeout(() => {
                        this.aiThinking = false;
                        const tabName = this.tabs.find(t => t.id === this.currentTab)?.name || '';
                        this.aiChatMessages.push({ role: 'ai', content: `這是模擬回覆：根據目前「${tabName}」頁籤的資料進行分析...（Demo 用途，實際功能開發中）` });
                        this.$nextTick(() => { this.$refs.aiChatBody.scrollTop = this.$refs.aiChatBody.scrollHeight; });
                    }, 900);
                },

                switchTab(id) { this.currentTab = id; this.currentPage = 1; this.fetchData(); },
                changePage(p) { if (p >= 1 && p <= this.totalPages) this.currentPage = p; },
                fetchData() { this.isLoading = true; setTimeout(() => { this.isLoading = false; }, 600); },

                openColumnModal() { this.tempColStatus = { ...this.colStatus }; this.isColumnModalOpen = true; },
                confirmColumnModal() {
                    if (!Object.values(this.tempColStatus).some(v => v)) {
                        this.$dispatch('notify', { message: '至少選取 1 個項目' });
                        return;
                    }
                    this.colStatus = { ...this.tempColStatus };
                    this.isColumnModalOpen = false;
                },
                selectedColCount() { return Object.values(this.tempColStatus).filter(v => v).length; },
                isAllChecked() { return this.selectedColCount() === Object.keys(this.colLabels).length; },
                isAllIndeterminate() { const c = this.selectedColCount(); return c > 0 && c < Object.keys(this.colLabels).length; },
                toggleAll() { const c = this.isAllChecked(); Object.keys(this.tempColStatus).forEach(k => this.tempColStatus[k] = !c); },

                getChannelIcon(ch) {
                    const map = { 'ATM': 'ph-bank', '超商': 'ph-storefront', '信用卡': 'ph-credit-card', 'GASH 樂點': 'ph-game-controller', '街口支付': 'ph-device-mobile', 'LINE Pay': 'ph-device-mobile' };
                    return map[ch] || 'ph-arrows-left-right';
                },

                init() {
                    window.addEventListener('resize', () => { this.isMobile = window.innerWidth < 1024; });
                    flatpickr(this.$refs.dateStart,  { locale: 'zh_tw', dateFormat: 'Y-m-d', allowInput: true });
                    flatpickr(this.$refs.dateEnd,    { locale: 'zh_tw', dateFormat: 'Y-m-d', allowInput: true });

                    /* Mock Data */
                    const merchants = ['USDT Pay', 'EcoPay', 'QuickPay', 'FastTransfer', 'UniPay'];
                    this.merchantData = merchants.map((name, i) => {
                        const dCount = Math.floor(Math.random() * 5000) + 1000;
                        const wCount = Math.floor(Math.random() * 3000) + 500;
                        const dAmt = dCount * (Math.floor(Math.random() * 800) + 200);
                        const wAmt = wCount * (Math.floor(Math.random() * 600) + 150);
                        return {
                            id: i + 1, name, depositCount: dCount, depositAmount: dAmt,
                            withdrawCount: wCount, withdrawAmount: wAmt,
                            successRate: Math.floor(Math.random() * 15) + 83,
                            repurchaseRate: Math.floor(Math.random() * 40) + 30
                        };
                    });

                    const channels = ['ATM', '超商', '信用卡', 'GASH 樂點', '街口支付', 'LINE Pay'];
                    const txTypes = ['存款', '退款'];
                    this.channelData = channels.flatMap((ch, ci) =>
                        merchants.slice(0, Math.floor(Math.random() * 3) + 2).map((m, mi) => {
                            const txType = txTypes[Math.floor(Math.random() * 2)];
                            const txCount = Math.floor(Math.random() * 2000) + 300;
                            const successRate = Math.floor(Math.random() * 15) + 82;
                            const sCount = Math.floor(txCount * successRate / 100);
                            return {
                                id: ci * 10 + mi, channel: ch, merchant: m, txType,
                                txCount, txAmount: txCount * (Math.floor(Math.random() * 600) + 200),
                                successCount: sCount, failCount: txCount - sCount - Math.floor(Math.random() * 10),
                                pending: Math.floor(Math.random() * 10),
                                successRate, avgAmount: Math.floor(Math.random() * 600) + 200,
                                avgSeconds: Math.floor(Math.random() * 120) + 5
                            };
                        })
                    );

                    const recentDays = Array.from({ length: 14 }, (_, i) => {
                        const d = new Date(2025, 4, 17 - i);
                        return d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    });
                    this.successRateData = recentDays.flatMap(date =>
                        channels.slice(0, 3).map((ch, ci) => {
                            const total = Math.floor(Math.random() * 800) + 200;
                            const rate = Math.floor(Math.random() * 18) + 80;
                            const success = Math.floor(total * rate / 100);
                            return {
                                id: date + ch, date, channel: ch, merchant: merchants[ci % merchants.length],
                                total, success, fail: total - success - Math.floor(Math.random() * 5),
                                pending: Math.floor(Math.random() * 5), rate,
                                delta: Math.floor(Math.random() * 10) - 4
                            };
                        })
                    );

                    const channelAmounts = channels.map(ch => ({ channel: ch, amount: Math.floor(Math.random() * 5000000) + 500000 }));
                    const totalChannelAmt = channelAmounts.reduce((s, r) => s + r.amount, 0);
                    channelAmounts.sort((a, b) => b.amount - a.amount);
                    this.amountRatioData.channels = channelAmounts.map(r => ({ ...r, pct: Math.round(r.amount / totalChannelAmt * 100) }));

                    const merchantAmounts = merchants.map(m => ({ merchant: m, amount: Math.floor(Math.random() * 8000000) + 1000000 }));
                    const totalMerchantAmt = merchantAmounts.reduce((s, r) => s + r.amount, 0);
                    merchantAmounts.sort((a, b) => b.amount - a.amount);
                    this.amountRatioData.merchants = merchantAmounts.map(r => ({ ...r, pct: Math.round(r.amount / totalMerchantAmt * 100) }));

                    let detailId = 1;
                    this.amountRatioData.detail = merchants.flatMap(m => {
                        const mAmt = merchantAmounts.find(x => x.merchant === m)?.amount || 0;
                        return channels.slice(0, 3).map(ch => {
                            const amt = Math.floor(mAmt * (Math.random() * 0.4 + 0.05));
                            return { id: detailId++, merchant: m, channel: ch, amount: amt, globalPct: Math.round(amt / totalMerchantAmt * 100), merchantPct: Math.round(amt / mAmt * 100) };
                        });
                    }).sort((a, b) => b.amount - a.amount);
                }
            };
        }
    </script>
</body>
