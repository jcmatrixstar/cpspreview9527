<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
html, body { margin:0; height:100%; background:#f3f4f6; color:#1f2937; font-family:'Microsoft JhengHei',sans-serif; }
a { color:#2088ea; text-decoration:none; }
a:hover { color:#1a7acb; }
.om-nav::-webkit-scrollbar { width:6px; }
.om-nav::-webkit-scrollbar-track { background:transparent; }
.om-nav::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
.om-nav::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
</style>
</helmet>
<div style="height:100vh;display:flex;overflow:hidden;background:#f3f4f6;font-family:'Microsoft JhengHei',sans-serif;color:#1f2937">

  <aside style="width:{{ sidebarWidth }};flex:none;height:100%;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;transition:width 0.3s">
    <div style="height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #f3f4f6;overflow:hidden">
      <div style="width:32px;flex:none;color:#6b7280;cursor:pointer;display:flex;align-items:center" style-hover="color:#2088ea" onClick="{{ toggleSidebar }}">
        <i class="ph ph-list" style="font-size:24px"></i>
      </div>
      <sc-if value="{{ sidebarOpen }}" hint-placeholder-val="{{ true }}">
        <span style="font-size:20px;font-weight:700;color:#1f2937;white-space:nowrap">合規後台</span>
      </sc-if>
    </div>

    <nav class="om-nav" style="flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;user-select:none">
      <sc-for list="{{ menus }}" as="m" hint-placeholder-count="12">
        <div style="display:flex;flex-direction:column;gap:4px" onMouseEnter="{{ m.hoverEnter }}">
          <div style="position:relative;display:flex;align-items:center;justify-content:{{ m.justify }};gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ m.bg }};color:{{ m.color }}" style-hover="background:#eff6ff" title="{{ m.name }}" onClick="{{ m.toggle }}">
            <div style="display:flex;align-items:center;gap:12px;min-width:0">
              <i class="ph {{ m.icon }}" style="font-size:20px;flex:none;color:{{ m.iconColor }}"></i>
              <sc-if value="{{ sidebarOpen }}" hint-placeholder-val="{{ true }}">
                <span style="font-size:14px;font-weight:500;white-space:nowrap">{{ m.name }}</span>
              </sc-if>
            </div>
            <sc-if value="{{ m.showCaret }}" hint-placeholder-val="{{ true }}">
              <i class="ph ph-caret-right" style="font-size:14px;color:{{ m.caretColor }};transform:{{ m.caretRotate }};transition:transform 0.2s"></i>
            </sc-if>
            <sc-if value="{{ m.showIndicator }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;right:0;top:50%;transform:translateY(-50%);width:4px;height:24px;background:#2088ea;border-top-left-radius:4px;border-bottom-left-radius:4px"></div>
            </sc-if>
          </div>

          <sc-if value="{{ m.expanded }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 8px 0 40px;display:flex;flex-direction:column;gap:4px">
              <sc-for list="{{ m.items }}" as="s" hint-placeholder-count="4">
                <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:14px;cursor:pointer;background:{{ s.bg }};color:{{ s.color }};font-weight:{{ s.weight }}" style-hover="background:#eff6ff;color:#2088ea" onClick="{{ s.pick }}">
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.name }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div style="flex:none;border-top:1px solid #e5e7eb;background:#f9fafb;padding:16px;display:flex;align-items:center;justify-content:{{ footJustify }};gap:16px;flex-direction:{{ footDir }}">
      <div style="padding:8px;border-radius:8px;color:#6b7280;cursor:pointer;display:flex" style-hover="background:#fff;color:#2088ea" title="顯示模式">
        <i class="ph ph-sun" style="font-size:20px"></i>
      </div>
      <sc-if value="{{ sidebarOpen }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;align-items:flex-end">
          <span style="font-size:12px;font-weight:700;color:#374151;font-family:ui-monospace,monospace">{{ clock }}</span>
          <span style="font-size:10px;color:#9ca3af">(GMT+8)</span>
        </div>
      </sc-if>
      <sc-if value="{{ sidebarClosed }}" hint-placeholder-val="{{ false }}">
        <i class="ph ph-clock" style="font-size:20px;color:#9ca3af" title="{{ clock }}"></i>
      </sc-if>
    </div>
  </aside>

  <div style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column">
    <header style="height:64px;flex:none;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:space-between;padding:0 24px">
      <h1 style="margin:0;font-size:20px;font-weight:700;color:#1f2937;letter-spacing:-0.01em">{{ pageTitle }}</h1>
      <div style="display:flex;align-items:center;gap:20px">
        <div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9999px;border:1px solid transparent;cursor:pointer" style-hover="background:#f3f4f6;border-color:#e5e7eb">
          <img src="https://flagcdn.com/w20/tw.png" alt="TW" style="width:20px;height:auto;border-radius:2px">
          <span style="font-size:14px;font-weight:500;color:#4b5563">繁中</span>
          <i class="ph ph-caret-down" style="font-size:12px;color:#9ca3af"></i>
        </div>
        <div style="position:relative;padding:8px;border-radius:9999px;color:#6b7280;cursor:pointer;display:flex" style-hover="background:#f3f4f6;color:#2088ea">
          <i class="ph ph-bell" style="font-size:20px"></i>
          <span style="position:absolute;top:6px;right:6px;width:10px;height:10px;background:#ef4444;border-radius:50%;border:2px solid #fff"></span>
        </div>
        <div style="width:1px;height:24px;background:#e5e7eb"></div>
        <div style="display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:9999px;border:1px solid transparent;cursor:pointer" style-hover="background:#f3f4f6;border-color:#e5e7eb">
          <div style="width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">A</div>
          <span style="font-size:14px;font-weight:500;color:#374151">admin</span>
          <i class="ph ph-caret-down" style="font-size:12px;color:#9ca3af"></i>
        </div>
      </div>
    </header>

    <div ref="{{ holeRef }}" style="flex:1;min-height:0;background:#f8fafc;position:relative">
      <iframe ref="{{ iframeRef }}" src="{{ pageSrc }}" title="{{ pageTitle }}" allowtransparency="true" style="width:100%;height:100%;border:0;display:block;background:transparent;{{ iframeFix }}"></iframe>
    </div>
  </div>

  <sc-if value="{{ flyoutOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:80px;top:{{ flyoutTop }};z-index:2000;padding-left:8px" onMouseLeave="{{ closeFlyout }}">
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.15);padding:8px;min-width:200px">
        <div style="padding:8px 16px;font-size:12px;font-weight:700;color:#9ca3af;background:#f9fafb;border-bottom:1px solid #f3f4f6;border-radius:4px 4px 0 0;margin-bottom:4px">{{ flyoutName }}</div>
        <div style="display:flex;flex-direction:column">
          <sc-for list="{{ flyoutItems }}" as="s" hint-placeholder-count="4">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;border-radius:4px;font-size:14px;cursor:pointer;background:{{ s.bg }};color:{{ s.color }};font-weight:{{ s.weight }}" style-hover="background:#eff6ff;color:#2088ea" onClick="{{ s.pick }}">
              <span style="white-space:nowrap">{{ s.name }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ toastOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;top:20px;right:20px;z-index:500;background:#1f2937;color:#fff;padding:12px 16px;border-radius:4px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.2);display:flex;align-items:center;gap:12px;min-width:240px">
      <i class="ph ph-info" style="color:#facc15;font-size:20px"></i>
      <span style="font-size:14px;font-weight:500">{{ toastText }}</span>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  state = { sidebarOpen: true, open: '設定管理', page: 'settings', clock: '', toast: null, hover: null, hoverTop: 0, dim: false };

  componentDidMount() {
    this.tick();
    this.timer = setInterval(() => this.tick(), 1000);
    this.onMsg = e => {
      if (!e.data) return;
      if (typeof e.data.dcModal === 'boolean') this.setState({ dim: e.data.dcModal });
      if (e.data.dcNeedRect) this.sendRect();
    };
    window.addEventListener('message', this.onMsg);
    this.onResize = () => this.sendRect();
    window.addEventListener('resize', this.onResize);
  }
  componentDidUpdate() { this.sendRect(); }
  componentWillUnmount() {
    clearInterval(this.timer);
    window.removeEventListener('message', this.onMsg);
    window.removeEventListener('resize', this.onResize);
  }
  sendRect() {
    if (!this.holeEl || !this.iframeEl || !this.iframeEl.contentWindow) return;
    const r = this.holeEl.getBoundingClientRect();
    this.iframeEl.contentWindow.postMessage({ dcShellRect: { left: r.left, top: r.top, width: r.width, height: r.height } }, '*');
  }
  tick() {
    this.setState({ clock: new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });
  }

  notify(msg) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: msg });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2200);
  }

  tree() {
    return [
      { name: '焦點資訊', icon: 'ph-house' },
      { name: '報表管理', icon: 'ph-chart-bar', items: [
        { name: '聊天相關報表', page: 'reports' },
        { name: '交收報表' }, { name: '遊戲報表' }, { name: '金流報表' },
        { name: '玩家報表' }, { name: '活動報表' }
      ] },
      { name: '紀錄管理', icon: 'ph-clipboard-text', items: [
        { name: '押注紀錄' }, { name: '活動遊戲紀錄' }, { name: '登入紀錄' }, { name: '獎勵紀錄' },
        { name: '成就徽章紀錄' }, { name: '序號兌換紀錄' }, { name: '異動紀錄', dev: true },
        { name: 'VIP 階級紀錄' }, { name: '彩池紀錄' }, { name: '資料交換紀錄' },
        { name: '下載紀錄' }, { name: '執行異常紀錄' }
      ] },
      { name: '財務管理', icon: 'ph-currency-circle-dollar', items: [
        { name: '系統存提紀錄' }, { name: '儲值紀錄' }, { name: '交易紀錄' }
      ] },
      { name: '設定管理', icon: 'ph-gear', items: [
        { name: '聊天設定', page: 'settings' },
        { name: '站台設定' }, { name: '站台資訊', dev: true },
        { name: 'VIP 階級' }, { name: '成就徽章' }
      ] },
      { name: '客端管理', icon: 'ph-megaphone', items: [
        { name: 'CTA 客端路由' }, { name: '跑馬燈公告' }, { name: '輪播廣告' }, { name: '優惠活動' }
      ] },
      { name: '活動管理', icon: 'ph-gift', items: [
        { name: '終身限定' }, { name: '週期任務' }, { name: '序號設定' }
      ] },
      { name: '遊戲管理', icon: 'ph-game-controller', items: [
        { name: '遊戲類型', dev: true }, { name: '遊戲供應商', dev: true }, { name: '遊戲平台', dev: true },
        { name: '遊戲設定' }, { name: '遊戲曝光' }, { name: '彩池設定' }, { name: '免費旋轉' }
      ] },
      { name: '儲值管理', icon: 'ph-credit-card', items: [
        { name: '金流設定' }, { name: '金流商戶' }, { name: '儲值優惠' }
      ] },
      { name: '會員管理', icon: 'ph-users', items: [{ name: '會員列表' }] },
      { name: '用戶管理', icon: 'ph-user-gear', items: [{ name: '用戶列表' }, { name: '角色權限' }] },
      { name: '助理精靈', icon: 'ph-magic-wand', items: [
        { name: '維護設定' }, { name: '風控設定', dev: true }, { name: '模擬注單生成', dev: true }
      ] }
    ];
  }

  renderVals() {
    const open = this.state.sidebarOpen;
    const page = this.state.page;
    const pages = {
      settings: { title: '聊天設定', src: 'chat-settings-v4.39.dc.html' },
      reports: { title: '聊天相關報表', src: 'chat-reports-v2.2.dc.html' }
    };

    return {
      sidebarOpen: open,
      sidebarClosed: !open,
      iframeRef: el => { this.iframeEl = el; },
      holeRef: el => { this.holeEl = el; },
      iframeFix: this.state.dim ? 'position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:1600' : '',
      dismissModal: () => {
        if (this.iframeEl && this.iframeEl.contentWindow) this.iframeEl.contentWindow.postMessage({ dcShell: 'dismiss' }, '*');
      },
      sidebarWidth: open ? '256px' : '80px',
      toggleSidebar: () => this.setState({ sidebarOpen: !open, open: open ? null : '設定管理', hover: null }),
      flyoutOpen: !open && this.state.hover !== null,
      flyoutTop: this.state.hoverTop + 'px',
      flyoutName: this.state.hover ? this.state.hover.name : '',
      flyoutItems: this.state.hover ? this.state.hover.items : [],
      closeFlyout: () => this.setState({ hover: null }),
      footJustify: open ? 'space-between' : 'center',
      footDir: open ? 'row' : 'column',
      clock: this.state.clock,
      pageTitle: pages[page].title,
      pageSrc: pages[page].src,
      toastOpen: !!this.state.toast,
      toastText: this.state.toast || '',

      menus: this.tree().map(m => {
        const hasActive = (m.items || []).some(s => s.page === page);
        const expanded = open && this.state.open === m.name && !!m.items;
        const subs = (m.items || []).map(s => {
            const active = s.page === page;
            return {
              name: s.name,
              dev: false,
              bg: active ? '#eff6ff' : 'transparent',
              color: active ? '#2088ea' : (s.page ? '#4b5563' : '#cbd5e1'),
              weight: active ? 700 : (s.page ? 500 : 400),
              dot: active ? '#2088ea' : '#d1d5db',
              pick: () => (s.page
                ? this.setState({ page: s.page, hover: null, dim: false })
                : this.notify('此頁面未納入本次原型範圍'))
            };
          });
        return {
          name: m.name,
          icon: m.icon,
          items: subs,
          hoverEnter: e => {
            if (open) return;
            const r = e.currentTarget.getBoundingClientRect();
            this.setState({ hover: m.items ? { name: m.name, items: subs } : null, hoverTop: r.top });
          },
          expanded,
          justify: open ? (m.items ? 'space-between' : 'flex-start') : 'center',
          bg: (expanded || (!open && hasActive)) ? '#eff6ff' : 'transparent',
          color: (expanded || hasActive) ? '#2088ea' : (m.items || []).some(s => s.page) ? '#4b5563' : '#a8b3c2',
          iconColor: (expanded || hasActive) ? '#2088ea' : (m.items || []).some(s => s.page) ? '#6b7280' : '#b6c0cc',
          showCaret: open && !!m.items,
          caretColor: expanded ? '#2088ea' : '#9ca3af',
          caretRotate: expanded ? 'rotate(90deg)' : 'rotate(0deg)',
          showIndicator: !open && hasActive,
          toggle: () => {
            if (!open) { this.setState({ sidebarOpen: true, open: m.name }); return; }
            if (!m.items) { this.notify('此頁面未納入本次原型範圍'); return; }
            this.setState({ open: this.state.open === m.name ? null : m.name });
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
